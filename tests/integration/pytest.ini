[pytest]
markers =
    kb: knowledge-base pipeline tests (connector → dataset → KB → search)
    smoke: quick API smoke (login + create project)
    projects: project lifecycle happy path (create → get → list-with-role → rename → metrics → delete)
    members: project user-management happy path (add/change-role/remove member via workflow-engine; read via config-service)
    models: model happy paths (platform-hosted built-in TEI models; gated provider registration)
    s3compatible: S3-compatible object store pipeline
    mysql: MySQL pipeline
    postgres: PostgreSQL pipeline
    anf: Azure NetApp Files (metrics connector and/or MCP server)
    metrics: metrics-as-resource dataset acquisition tests
    mcp: managed MCP server provisioning and tool tests
    gcp: GCP metrics acquisition pipeline
    ontap: ONTAP metrics pipeline
    agent_service: agent-service E2E suites (config provisioning + sync invoke)
    instantiation: agent-service instantiation flow (project → models → agent/team → invoke)
    memory: agent-service conversation memory flow (project → model → memory agent → seed/recall invoke)
    session: agent-service session lifecycle (list/get/rename/delete + isolation)
    orchestration: agent-service team orchestration policy flows (sequential/concurrent team invoke → metadata.orchestration_type)
    retrieval: agent-service RAG retrieval flow (project → model → KB-bound agent → invoke → kbCitations)
    guardrails: agent-service guardrails enforcement suites (input/output guardrails → redact/block)
    overrides: agent-service per-invoke configOverrides flows (project → model → agent → invoke with configOverrides → citations.respondingAgent)
    interface: agent-service interface transport suites (HTTP sync, SSE streaming, WebSocket, async invoke/tasks)
    structured_output: agent-service structured-output flow (schema -> invoke -> parsedOutput validation)
    tools: MCP tools suites (platform + catalog + remote MCP server lifecycle/discovery via config-service)
    evals: evaluation-template E2E suites (config-service CRUD + testcases upload)

    data_management: credential / datasource / dataset lifecycle suites (no KB)
    credential: credential CRUD and validation
    datasource: datasource connector or volume lifecycle
    dataset: dataset create / acquire / import lifecycle
    manual_upload: manual unstructured file upload flow
    connector_postgresql: PostgreSQL connector datasource tests
    connector_mysql: MySQL connector datasource tests
    connector_s3: S3-compatible connector datasource tests
    connector_gcp: GCP connector datasource tests
    connector_azure_cloud: Azure cloud connector datasource tests
    connector_ontap: ONTAP connector datasource tests
    connector_redash: Redash connector datasource tests
    connector_volume: NFS volume datasource tests
    structured: structured acquired dataset tests
    unstructured: unstructured acquired or manual dataset tests
    disabled: never collected — deselected during collection (see conftest.py)
testpaths = suites
addopts =
    -ra
    --strict-markers
    --html=reports/pytest-report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --alluredir=reports/allure-results
