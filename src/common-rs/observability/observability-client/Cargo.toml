[package]
name = "agentstudio-observability-client-runtime"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "AgentStudio observability client — structured logs + OTLP traces + Prometheus/OTLP metrics, parity with Go/Python/TypeScript clients"
license = "Apache-2.0"

[lib]
name = "agentstudio_observability_client"
path = "src/lib.rs"

[dependencies]
# OpenTelemetry API + SDK + OTLP exporter (kept on the same minor).
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }

# Prometheus exporter for the long-lived `/metrics` endpoint.
opentelemetry-prometheus = "0.32"
prometheus = { version = "0.14", default-features = false }

# Structured logging facade + JSON output.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }

# Async runtime + HTTP server for Prometheus scrape endpoint.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Config / parsing.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["http"]
http = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower",
    "dep:uuid",
]
