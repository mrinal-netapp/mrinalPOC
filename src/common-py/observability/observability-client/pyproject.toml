[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstudio-observability-client-runtime"
version = "0.1.0"
description = "AgentStudio observability client runtime with structlog, OpenTelemetry traces and metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "structlog>=24.0.0",
  "opentelemetry-api>=1.34.0,<2.0.0",
  "opentelemetry-sdk>=1.34.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.34.0,<2.0.0",
  "opentelemetry-exporter-prometheus>=0.51b0,<1.0.0",
  "opentelemetry-instrumentation-logging>=0.51b0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "traceloop-sdk>=0.58.0,<1.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
observability_client_runtime = ["config/log_config.json"]

[tool.setuptools.packages.find]
include = ["observability_client_runtime*"]
