[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secrets-client"
version = "1.0.0"
description = "Agent Studio secrets-client library — reads CSI-mounted secrets from /mnt/secrets with live rotation support"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["secrets_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
