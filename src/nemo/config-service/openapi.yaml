    AgentTeam:
      type: object
      description: |
        Full AgentTeam entity as returned by GET endpoints. Members may be
        either agents or other teams; the `team -> team` graph is guaranteed
        to be acyclic by the create/update routes.
      required: [name, members]
      properties:
        id:
          type: string
          description: Short team ID (`agr-<8 lowercase alphanumeric>`).
          pattern: '^agr-[a-z0-9]{8}$'
          readOnly: true
        projectId:
          type: string
          description: Owning project ID.
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        orchestrationPolicy:
          type: string
          enum: [coordinate, route, collaborate, sequential, concurrent]
          default: coordinate
          description: |
            How the team's manager orchestrates its members at runtime:
            - `coordinate` — manager assigns subtasks and gathers results.
            - `route` — manager routes the inbound request to one member.
            - `collaborate` — members work in parallel on the same task.
            - `sequential` — members run in fixed order.
            - `concurrent` — members run independently at the same time.
        manager:
          $ref: '#/components/schemas/AgentTeamManager'
        members:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentTeamMember'
        sharedKnowledgeBaseIds:
          type: array
          default: []
          items:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        sharedDatasetIds:
          type: array
          default: []
          items:
            type: string
        artifactStoreIds:
          type: array
          default: []
          items:
            type: string
          description: |
            Artifact stores shared by every member of this team for the
            duration of an invocation. Members may also have per-agent
            `artifactStoreIds`; the effective set is the union, filtered
            by ACL.
        memoryType:
          type: string
          enum: [none, conversation, sliding_window]
          default: conversation
          description: Team-level memory type. Mirrors `Agent.memoryType`.
        memoryConfig:
          $ref: '#/components/schemas/AgentMemoryConfig'
        a2aServer:
          $ref: '#/components/schemas/A2AServerConfig'
        terminationStrategy:
          $ref: '#/components/schemas/TerminationStrategy'
        labels:
          type: array
          default: []
          items:
            type: string
          description: Free-form labels for filtering / display.
        status:
          type: string
          enum: [Healthy, Unhealthy]
          default: Healthy
          description: |
            Health status of the agent team. Surfaced as a simple `Healthy`
            / `Unhealthy` pill in the GUI. Lifecycle detail is tracked
            separately on `deploymentStatus`. Update via the regular
            `PUT /agent-teams/{id}` or the dedicated
            `PUT /agent-teams/{id}/status` endpoint.
        statusMessage:
          type: string
          nullable: true
        deploymentStatus:
          type: string
          enum: [draft, preview, not_deployed, deploying, deployed, failed, terminating, terminated]
          default: not_deployed
        associatedResources:
          allOf:
            - $ref: '#/components/schemas/AgentTeamAssociatedResources'
          readOnly: true
        dependentsSummary:
          $ref: '#/components/schemas/DependentsSummary'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    AgentTeamMember:
      type: object
      required: [memberType, memberId]
      properties:
        memberType:
          type: string
          enum: [agent, team]
        memberId:
          type: string
          description: |
            Agent id (`ag-<8>`) when `memberType=agent`, team id
            (`agr-<8>`) when `memberType=team`. Must resolve to an entity
            in the same project.
        role:
          type: string
          nullable: true
          description: Optional role label for this member within the team.

    AgentTeamManager:
      type: object
      description: |
        Manager configuration for the team. Two valid shapes:

        1. **Reference mode** — set `agent_id` to the ID of an existing
           agent in the same project. All other manager fields are optional;
           the team resolves the effective manager config (name, model,
           systemPrompt, …) from the referenced agent at runtime.
        2. **Inline mode** — omit `agent_id` and provide inline values.
           In this case `name` + `systemPrompt` are required, and at
           least one of `modelId` / `modelClass` must be set (on update
           the two cannot be cleared simultaneously).
      properties:
        agent_id:
          type: string
          description: |
            Reference to an existing agent in the same project. When set,
            the other manager fields are optional and ignored at runtime.
        name:
          type: string
          minLength: 1
          description: Required in inline mode (when `agent_id` is not set).
        role:
          type: string
        modelId:
          type: string
          nullable: true
        modelClass:
          type: string
          nullable: true
        systemPrompt:
          type: string
          minLength: 1
          description: Required in inline mode.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        maxTokens:
          type: integer
          minimum: 1
        guardrails:
          $ref: '#/components/schemas/AgentGuardrails'

    CreateAgentTeamRequest:
