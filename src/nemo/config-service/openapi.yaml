  # --- Analytics preview (cross-service, served by analytics-engine) ---
  /api/v1/datasets/preview:
    post:
      summary: Preview rows from an Iceberg dataset table
      tags: [AnalyticsPreview]
      description: |
        Served by the `analytics-engine`. Returns a paginated, filterable
        preview of a registered dataset's Iceberg table. The default
        projection is the full table; `piiView` lets clients hide PII columns
        or render a side-by-side with/without view.
      operationId: previewDataSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsPreviewRequest'
      responses:
        '200':
          description: Preview rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsPreviewResponse'
        '400':
          description: Invalid request body or filter/order column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/datasets/stats:
    post:
      summary: Per-column statistics for an Iceberg dataset table
