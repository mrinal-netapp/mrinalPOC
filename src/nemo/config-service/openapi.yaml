openapi: 3.0.3
info:
  title: AgentStudio Config Service API
  version: 1.0.0
  description: Unified service for managing connectors, datasets, projects, buckets, deployments, configuration distribution, and health/metrics
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: http://config-service:3000
    description: Kubernetes service
paths:
  # --- Setup (top-level) ---
  /api/v1/setup/status:
    get:
      summary: Get setup status
      tags: [Setup]
      description: Returns whether Keycloak realm setup is complete and admin console URL/credentials
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSetupComplete:
                    type: boolean
                  adminConsoleUrl:
                    type: string
                  adminCredentials:
                    type: object
                    properties:
                      username:
                        type: string
                      password:
                        type: string
                  realmName:
                    type: string

  # --- Projects (top-level) ---
  /api/v1/projects:
    post:
      summary: Create project
      tags: [Projects]
      description: Creates a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List the caller's projects
      tags: [Projects]
      description: |
        Lists the projects the authenticated caller is a member of, with their
        role on each. Membership comes from Keycloak Authorization Services; the
        project metadata is joined from config-service. Not an admin-wide list —
        only the caller's own projects are returned.
      operationId: listProjects
      responses:
        '200':
          description: List of the caller's projects (with role)
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Project'
                        - type: object
                          properties:
                            role:
                              type: string
                              enum: [admin, member, viewer]
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to query Keycloak or project store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}:
    get:
      summary: Get project
      tags: [Projects]
      description: Gets a project by ID
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update project
      tags: [Projects]
      description: Updates a project
      operationId: updateProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete project
      tags: [Projects]
      description: Deletes a project
      operationId: deleteProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Project deleted
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Project membership reads (Keycloak-backed) ---
  # Writes (POST/DELETE/PUT) live in workflow-engine because they start
  # Temporal workflows. See docs/design/keycloak-per-project-authorization.md.
  /api/v1/projects/{projectId}/members:
    get:
      summary: List project members (from Keycloak)
      tags: [Projects]
      description: |
        Returns the list of users with any role on the given project, derived
        from Keycloak Authorization Services policies (`usr-{userId}-proj-{projectId}-{role}`).
        Each member is enriched with their profile (username, email) from the
        Keycloak user directory; profile fields are omitted for any member whose
        directory lookup does not resolve.
      operationId: listProjectMembers
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        role:
                          type: string
                          enum: [admin, member, viewer]
                        username:
                          type: string
                          description: Keycloak username; omitted if the user lookup did not resolve.
                        email:
                          type: string
                          description: Keycloak email; omitted if the user lookup did not resolve.
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to query Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/service-account:
    post:
      summary: Create or get project service account
      tags: [Projects]
      description: Creates a Keycloak client (service account) for the project; idempotent
      operationId: createProjectServiceAccount
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Service account created
        '200':
          description: Service account already exists
        '404':
          description: Project not found
    get:
      summary: Get project service account
      tags: [Projects]
      operationId: getProjectServiceAccount
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service account (includes clientSecret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  clientId:
                    type: string
                  clientSecret:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '404':
          description: Project or service account not found

  # --- Buckets (under project) ---
  /api/v1/projects/{projectId}/buckets:
    post:
      summary: Create bucket
      tags: [Buckets]
      description: Registers a new bucket in a project
      operationId: createBucket
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bucket already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List buckets
      tags: [Buckets]
      description: Lists all buckets in a project
      operationId: listBuckets
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bucket'

  /api/v1/projects/{projectId}/buckets/{bucketName}:
    get:
      summary: Get bucket
      tags: [Buckets]
      description: Gets a bucket by name
      operationId: getBucket
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bucketName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bucket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update bucket
      tags: [Buckets]
      description: Updates a bucket
      operationId: updateBucket
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bucketName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete bucket
      tags: [Buckets]
      description: Deletes a bucket
      operationId: deleteBucket
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bucketName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Bucket deleted
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Bucket health (under project) ---
  /api/v1/projects/{projectId}/buckets/{bucketName}/health:
    get:
      summary: Get bucket health
      tags: [Health]
      description: Gets health status for a bucket across all deployments
      operationId: getBucketHealth
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bucketName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bucket health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket_health:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketHealth'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Deployments (top-level) ---
  /api/v1/deployments:
    post:
      summary: Register deployment
      tags: [Deployments]
      description: Registers a new regional deployment
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: Deployment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '200':
          description: Deployment updated (re-registration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List deployments
      tags: [Deployments]
      description: Lists all registered deployments
      operationId: listDeployments
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'

  /api/v1/deployments/{deploymentId}:
    get:
      summary: Get deployment
      tags: [Deployments]
      description: Gets a deployment by ID
      operationId: getDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deployment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update deployment
      tags: [Deployments]
      description: Updates a deployment
      operationId: updateDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
      responses:
        '200':
          description: Updated deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Deregister deployment
      tags: [Deployments]
      description: Deregisters a deployment
      operationId: deleteDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deployment deregistered
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/{deploymentId}/buckets:
    get:
      summary: Get deployment buckets
      tags: [Deployments]
      description: Gets bucket assignments for a deployment with role information
      operationId: getDeploymentBuckets
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
          description: Config version for incremental updates
      responses:
        '200':
          description: Deployment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigResponse'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/{deploymentId}/config:
    get:
      summary: Get deployment config
      tags: [Deployments]
      description: Gets full deployment configuration
      operationId: getDeploymentConfig
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
          description: Config version for incremental updates
      responses:
        '200':
          description: Deployment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigResponse'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/buckets/{projectId}/{bucketName}/routing:
    get:
      summary: Get bucket routing
      tags: [Deployments]
      description: Gets routing information for a bucket (all deployments serving it)
      operationId: getBucketRouting
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: bucketName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Routing information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketRoutingResponse'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/storage-classes:
    get:
      summary: List storage classes
      tags: [StorageClasses]
      description: Lists all available StorageClasses aggregated from active deployments
      operationId: listStorageClasses
      responses:
        '200':
          description: List of available StorageClasses
          content:
            application/json:
              schema:
                type: object
                properties:
                  storage_classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageClass'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/{deploymentId}/metrics:
    post:
      summary: Submit metrics
      tags: [Health]
      description: Submits metrics from a regional deployment
      operationId: submitMetrics
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metrics'
      responses:
        '200':
          description: Metrics accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/{deploymentId}/health:
    post:
      summary: Report health
      tags: [Health]
      description: Reports health status from a regional deployment
      operationId: reportHealth
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthReport'
      responses:
        '200':
          description: Health report accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Data Sources (under project) ---
  # A "data source" is the unified entity for both data-plane volumes (PVCs/NFS/SMB)
  # and connector-style integrations (object stores, databases, cloud accounts, ONTAP, APIs).
  # The `type` field discriminates between the two; `volume_config` or `connector_config`
  # is populated accordingly. Routes are mounted at /api/v1/projects/{projectId}/datasources.
  /api/v1/projects/{projectId}/datasources:
    get:
      summary: List data sources
      tags: [DataSources]
      description: |
        List data sources in a project. Optionally filter by `type` (volume | connector)
        and `nameRegex` (case-insensitive substring match on name).
      operationId: listDataSources
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema:
            type: string
            enum: [volume, connector]
          description: Filter by data source type
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: nameRegex
          schema: { type: string }
          description: Case-insensitive substring filter on data source name
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a data source
      tags: [DataSources]
      description: |
        Create a data source. Provide `volume_config` when `type=volume` and
        `connector_config` (plus `credential_id`) when `type=connector`. For volume
        data sources, the `name` is validated as a bucket name and the service will
        attempt to auto-assign the volume to a deployment. For connector data sources
        the `connector_config` is validated against the provider catalog
        (provider-catalog.json) and `credential_id` is required.
      operationId: createDataSource
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataSourceRequest'
      responses:
        '201':
          description: Data source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Validation error (missing/invalid fields, provider validation failed, invalid volume name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A data source with this name already exists in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/bulk-preflight:
    post:
      summary: Bulk ONTAP volume preflight plan
      tags: [DataSources]
      description: |
        Compute a staged plan (no writes) for re-resolving ONTAP NFS mount endpoints
        across many volume data sources. For each volume sourced from the ONTAP
        connector explorer, the service calls the workflow-engine
        `resolveBestMountForVolume` action and returns the current vs. proposed
        endpoint along with mount preflight diagnostics so an operator can review
        before applying.
      operationId: bulkPreflightDataSources
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPreflightRequest'
      responses:
        '200':
          description: Per-volume preflight plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkPreflightResult'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/bulk-apply:
    post:
      summary: Apply bulk ONTAP endpoint updates
      tags: [DataSources]
      description: |
        Apply ONTAP NFS endpoint updates to the listed volume data source IDs.
        For each ID the service re-runs `resolveBestMountForVolume`, skips when
        `blocking` issues are present, and otherwise updates
        `volume_config.volume_info.endpoint` / `mount_options` and refreshes
        `mount_health`. Pass `dry_run=true` to preview without persisting.
      operationId: bulkApplyDataSources
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApplyRequest'
      responses:
        '200':
          description: Per-volume apply outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkApplyOutcome'
        '400':
          description: Missing or invalid `ids`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/preflight:
    post:
      summary: Run mount preflight for a volume data source
      tags: [DataSources]
      description: |
        Run ONTAP NFS mount preflight (`testVolumeMount` via workflow-engine) for a
        single volume data source. The resulting `mount_health` snapshot is
        persisted on the data source and returned in the response.
      operationId: preflightDataSource
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Preflight result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResponse'
        '400':
          description: No ONTAP connector available for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Volume data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream workflow-engine error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}:
    get:
      summary: Get data source by ID
      tags: [DataSources]
      description: Fetch a single data source by its short ID (`vol-...` or `cn-...`).
      operationId: getDataSource
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update data source by ID
      tags: [DataSources]
      description: |
        Update a data source. Patches are merged: `volume_config.volume_info` and
        `volume_config.auth_info` are shallow-merged with the existing object;
        `connector_config` is shallow-merged. Renames must be unique within the
        project. Volume updates enforce provisioning-mode invariants
        (e.g. dynamic requires `storage_class_name`; static requires
        `volume_info.endpoint`). Note that connector_config updates are not
        re-validated against the provider catalog on PUT.
      operationId: updateDataSource
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSourceRequest'
      responses:
        '200':
          description: Data source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflicts with an existing data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete data source by ID
      tags: [DataSources]
      description: |
        Delete a data source. For connector-type data sources, any running
        workflow-engine workflows (test/explorer) are terminated first via the
        workflow-engine API. Reference edges are also cleaned up.
      operationId: deleteDataSource
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Data source deleted (no content)
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/connection-test-result:
    patch:
      summary: Record connection test result (connector data sources only)
      tags: [DataSources]
      description: |
        Persist the outcome of an external connection test against a connector
        data source. Updates `last_connection_test_at`,
        `last_connection_test_status`, and `last_connection_test_message`.
        Only applies to data sources of `type=connector`.
      operationId: recordDataSourceConnectionTest
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionTestResultRequest'
      responses:
        '200':
          description: Connection test result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Validation error (e.g. data source is not a connector, missing `success`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/history:
    get:
      summary: Get data source version history
      tags: [DataSources]
      description: |
        Returns the ordered version history for a data source (newest first).
        History is written automatically by the persistence layer on every change.
      operationId: listDataSourceHistory
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of version history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSourceHistoryEntry'
        '404':
          description: Data source not found or no history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/restore-version:
    post:
      summary: Restore data source to a previous version
      tags: [DataSources]
      description: |
        Restore the data source to a prior version recorded in its history.
        The historical config is reapplied via TypeORM update; the entity's
        primary key, project_id, and timestamps are preserved.
      operationId: restoreDataSourceVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: Version number to restore (from /history)
      responses:
        '200':
          description: Data source restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DataSource'
        '400':
          description: Missing or invalid `version`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/scan:
    post:
      summary: Trigger a volume scan
      tags: [DataSources]
      description: |
        Manually start (or restart) a volume scan. Only valid for `type=volume`
        data sources. Pass an optional `scan_config` in the body to override
        the stored configuration before triggering. Returns 202 with the
        updated data source whose `scan_status` reflects the newly-started
        workflow (state=`scanning` with workflow_id, or `failed` on dispatch
        error).
      operationId: triggerDataSourceScan
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scan_config:
                  $ref: '#/components/schemas/ScanConfig'
      responses:
        '202':
          description: Scan triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Validation error (e.g. not a volume, missing scan_config)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasources/{id}/datasets:
    get:
      summary: List datasets associated with a data source
      tags: [DataSources]
      description: |
        Returns DataSets linked to this DataSource:
        - For `type=connector` (`cn-*` id): datasets whose `originConnector` equals this id.
        - For `type=volume` (`vol-*` id): datasets whose `originVolume` equals this id.
          With `?includeManual=true`, manual datasets stored in the volume's
          bucket (`DataSet.type='manual' AND DataSet.bucketName = DataSource.name`)
          are also included.
      operationId: listAssociatedDataSets
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - in: query
          name: skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: nameRegex
          schema: { type: string }
          description: Case-insensitive substring filter on dataset name
        - in: query
          name: includeManual
          schema: { type: boolean, default: false }
          description: |
            Only meaningful for volume data sources. When true, also include
            manual datasets whose `bucketName` matches this volume's name.
      responses:
        '200':
          description: List of associated datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSetSummary'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/internal/datasources/{projectId}/{id}/scan-result:
    patch:
      summary: Internal — push final scan_status / scan_result from workflow-engine
      tags: [InternalDataSources]
      description: |
        Internal endpoint called by the workflow-engine
        `PostScanResultActivity` when a `VolumeScanWorkflow` finishes (success
        or failure). Persists the supplied `scan_status` and optional
        `scan_result` to the data source. Authenticated with a service
        account; not intended for public clients.
      operationId: postDataSourceScanResultInternal
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCallbackRequest'
      responses:
        '200':
          description: Scan state persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Validation error or non-volume data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- DataSets (under project) ---
  /api/v1/projects/{projectId}/datasets:
    get:
      summary: List datasets
      tags: [DataSets]
      description: |
        Lists datasets in a project with pagination and filtering. In-progress
        datasets and in-progress facets are enriched with live progress from
        the workflow-engine (best-effort, short timeout). Each entry is also
        annotated with a `dependentsSummary` unless the caller sets
        `include=dependentsSummary=false`.
      operationId: listDataSets
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1 }
        - in: query
          name: skip
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: field
          schema: { type: string }
          description: |
            Exact-match column filter; used with `value`. The pair is applied
            as `WHERE ds.{field} = {value}`.
        - in: query
          name: value
          schema: { type: string }
        - in: query
          name: nameRegex
          schema: { type: string }
          description: Case-insensitive substring filter on `name`.
        - in: query
          name: includeCatalog
          schema: { type: boolean, default: false }
          description: Include Lakekeeper catalog table metadata for each dataset.
        - in: query
          name: includeManifest
          schema: { type: boolean, default: false }
          description: |
            Deprecated alias for `includeCatalog`. Retained for backward
            compatibility.
          deprecated: true
        - in: query
          name: include
          schema: { type: string }
          description: |
            Set to `dependentsSummary=false` to skip the per-row
            `dependentsSummary` annotation (saves one extra DB round trip).
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSet'
        '400':
          description: Missing or invalid projectId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a dataset
      tags: [DataSets]
      description: |
        Creates a new dataset in PostgreSQL with `status=in_progress`. The
        catalog table is registered later by the dataset-import workflow.
      operationId: createDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataSetRequest'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '400':
          description: Validation error (invalid name, conflicting origin selectors, mixed metric selectors, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A dataset with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}:
    get:
      summary: Get dataset by ID
      tags: [DataSets]
      description: |
        Returns the dataset with `facets`, `catalogTable` (when registered),
        and live `progress`/`stats` when an import is in progress.
      operationId: getDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '404':
          description: Dataset not found in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update dataset by ID
      tags: [DataSets]
      description: |
        Updates dataset fields. When `uploadedFiles` is provided the service
        creates or replaces the draft manifest with those URIs, and
        auto-commits the draft when this is the first batch (so the import
        workflow is triggered). See `ManualUploadLimits` for the size /
        count caps applied to the `uploadedFiles` path.
      operationId: updateDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSetRequest'
      responses:
        '200':
          description: Dataset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: |
            A file in `uploadedFiles` exceeds the per-file cap, or the
            dataset's total file count would exceed `MANUAL_UPLOAD_MAX_FILES_PER_DATASET`.
            See `ManualUploadLimits`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Patch dataset acquisition/schedule fields (internal/workflow)
      tags: [DataSets]
      description: |
        Workflow-only PATCH used to merge `acquisitionConfig` and/or
        `scheduleConfig` (e.g. updating the watermark after a successful
        acquisition run) without overwriting unspecified fields.
      operationId: patchDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDataSetRequest'
      responses:
        '200':
          description: Dataset patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete dataset by ID
      tags: [DataSets]
      description: |
        Terminates any running workflows (acquisition / import / PII), starts
        an asynchronous S3 + catalog cleanup workflow when the dataset has a
        catalog table, and removes the DB row. Returns 409 if any other
        entity still references this dataset.
      operationId: deleteDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: Dataset deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDataSetResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dataset still has dependents (knowledge bases, agents, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDataSetConflictResponse'

  /api/v1/projects/{projectId}/datasets/{id}/dependents:
    get:
      summary: List entities that depend on this dataset
      tags: [DataSets]
      description: |
        Returns a keyset-paginated page of reference-edges whose `target`
        is this dataset (e.g. knowledge bases, agents). Use `cursor` from the
        previous response to fetch subsequent pages.
      operationId: listDataSetDependents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor returned in `nextCursor` of the previous page.
        - in: query
          name: kind
          schema: { type: string }
          description: Filter dependents by source entity kind (e.g. `knowledge_base`).
      responses:
        '200':
          description: Page of dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentsPage'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/knowledge-bases:
    get:
      summary: List knowledge bases that consume this dataset
      tags: [DataSets]
      description: |
        Reverse lookup of knowledge bases whose `sourceDataset` references this
        dataset. `KnowledgeBase.sourceDataset` historically stores either the
        dataset id or name, so both are matched. Rows are returned with the raw
        KnowledgeBase entity shape under `knowledge_bases`.
      operationId: listDataSetKnowledgeBases
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: Knowledge bases consuming this dataset
          content:
            application/json:
              schema:
                type: object
                required: [dataset_id, knowledge_bases]
                properties:
                  dataset_id:
                    type: string
                  knowledge_bases:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeBase'
        '404':
          description: Dataset not found in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/snapshots:
    get:
      summary: List Iceberg snapshots for a dataset
      tags: [DataSets]
      description: |
        Lists every snapshot of the dataset's catalog table along with the
        `currentSnapshotId` pointer. Snapshots are immutable Iceberg commits;
        the current one is the snapshot the `main` branch points at and is
        what every downstream consumer (knowledge bases, queries, exports)
        reads by default.
      operationId: listDataSetSnapshots
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: Snapshots and current pointer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dataset has no registered catalog table or is currently being imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/snapshots/{snapshotId}/expire:
    post:
      summary: Expire a snapshot
      tags: [DataSets]
      description: |
        Expires `snapshotId` from the dataset's Iceberg table history.

        Semantics:
        - When `snapshotId` is the current snapshot, the service first moves
          the `main` branch to its parent (or to the most recent sibling if
          no parent exists) and then issues `remove-snapshots`. The previous
          snapshot becomes current.
        - When `snapshotId` is not the current snapshot, it is simply
          removed from history.
        - Knowledge bases and other downstream readers resolve "current" at
          read time via PyIceberg (see `workers/kb-processor/data_sources/structured.py`),
          so the next read after a successful expire automatically uses the
          new current snapshot without any KB code change.
        - 409 is returned when the requested snapshot is the only one in the
          table (Iceberg requires at least one snapshot once data exists), or
          when the current snapshot has no parent / sibling to roll back to.
      operationId: expireDataSetSnapshot
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: snapshotId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Snapshot expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpireSnapshotResponse'
        '400':
          description: snapshotId must be a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset or snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The dataset has no catalog table yet, is currently being imported,
            the snapshot is the only one on the table, or the current snapshot
            has no parent or sibling to roll back to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/snapshots/{snapshotId}/set-current:
    post:
      summary: Set a snapshot as the current snapshot (operator rollback)
      tags: [DataSets]
      description: |
        Moves the dataset table's `main` branch to point at `snapshotId`
        without removing the previous current from history. Provided for
        manual recovery; the user-facing happy path is the `expire` endpoint.
      operationId: setDataSetCurrentSnapshot
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: snapshotId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current snapshot pointer updated
          content:
            application/json:
              schema:
                type: object
                required: [currentSnapshotId]
                properties:
                  currentSnapshotId:
                    type: integer
                    format: int64
                  previousSnapshotId:
                    type: integer
                    format: int64
                    nullable: true
        '400':
          description: snapshotId must be a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset or snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dataset has no registered catalog table or is currently being imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/history:
    get:
      summary: List dataset versions
      tags: [DataSets]
      operationId: listDataSetVersions
      description: |
        Returns the full revision history of a dataset, newest first. Each
        entry is a snapshot of the dataset's domain metadata at that version,
        as recorded in the `data_set_history` table. Use
        `POST /datasets/{id}/restore-version` to revert to a specific
        `version`.
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: List of dataset versions (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSetVersion'
        '404':
          description: No versions found for this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/restore-version:
    post:
      summary: Restore dataset to a previous version
      tags: [DataSets]
      description: |
        Restores domain metadata (name, description, configs, etc.) from a
        history entry. Files and Iceberg snapshots are NOT restored.
      operationId: restoreDataSetVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: History version number to restore.
      responses:
        '200':
          description: Dataset restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DataSet'
        '400':
          description: Invalid request (missing or non-numeric version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset or history version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/status:
    put:
      summary: Update dataset status (internal/workflow)
      tags: [DataSets]
      description: |
        Used by the dataset-import workflow / job processors to transition
        a dataset between `in_progress`, `ready`, and `errored`. Sets
        `errorMessage` only when `status=errored`; otherwise clears any
        previously persisted error.
      operationId: updateDataSetStatus
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSetStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/import:
    post:
      summary: Trigger dataset import workflow
      tags: [DataSets]
      description: |
        Triggers the dataset import workflow which:
        - for `structured` datasets: converts files to Parquet, infers schema, and registers the Iceberg table with Lakekeeper;
        - for `unstructured` datasets: creates a metadata table with file info and registers the table with Lakekeeper.

        Call this endpoint after uploading files to the dataset's
        `data_files/` directory. The request is rejected with 400 if a PII
        analysis facet is currently `in_progress` on this dataset.
      operationId: importDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '202':
          description: Import workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDataSetResponse'
        '400':
          description: PII analysis is in progress; wait for it to complete before re-importing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start import workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{datasetId}/acquire:
    post:
      summary: Manually trigger an acquisition run for a dataset
      tags: [DataSets]
      description: |
        Served by the `workflow-engine`. Starts a one-shot data acquisition
        Temporal workflow for the dataset. Used by the GUI "Refresh now"
        action and by repeated scheduled runs.
      operationId: acquireDataSet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '202':
          description: Acquisition workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDataSetResponse'
        '500':
          description: Failed to start acquisition workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{datasetId}/schedule:
    get:
      summary: Describe an acquisition schedule
      tags: [DataSets]
      description: |
        Served by the `workflow-engine`. Looks up a Temporal Schedule by
        `temporalScheduleId` and returns its current state.
      operationId: getAcquisitionSchedule
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: query
          name: temporalScheduleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Temporal schedule descriptor (raw Temporal shape)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing temporalScheduleId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to describe schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create or replace an acquisition schedule
      tags: [DataSets]
      description: |
        Served by the `workflow-engine`. Creates a Temporal Schedule that
        starts `DataAcquisitionWorkflow` on a cron cadence. If a
        `temporalScheduleId` is supplied the existing schedule is deleted
        before the new one is created (create-replace semantics).
      operationId: createOrUpdateAcquisitionSchedule
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cronExpression]
              properties:
                cronExpression:
                  type: string
                  description: Standard cron expression.
                timezone:
                  type: string
                  default: UTC
                enabled:
                  type: boolean
                  default: true
                temporalScheduleId:
                  type: string
                  description: When supplied, the existing schedule with this id is deleted before the new one is created.
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                required: [temporalScheduleId]
                properties:
                  temporalScheduleId:
                    type: string
                  cronExpression:
                    type: string
                  timezone:
                    type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an acquisition schedule
      tags: [DataSets]
      description: |
        Served by the `workflow-engine`. Deletes the Temporal Schedule
        identified by `temporalScheduleId` in the request body.
      operationId: deleteAcquisitionSchedule
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temporalScheduleId]
              properties:
                temporalScheduleId:
                  type: string
      responses:
        '200':
          description: Schedule deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/facets:
    get:
      summary: List facets for a dataset
      tags: [DataSets]
      description: |
        Lists every side-channel facet on this dataset (e.g. `pii`). Facets
        transition independently of the parent dataset `status`.
      operationId: listDataSetFacets
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: List of facets
          content:
            application/json:
              schema:
                type: object
                properties:
                  facets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facet'
        '404':
          description: Dataset not found in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/facets/{facetType}:
    get:
      summary: Get a single facet for a dataset
      tags: [DataSets]
      operationId: getDataSetFacet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema: { type: string }
          description: 'e.g. `pii`'
      responses:
        '200':
          description: Facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facet'
        '404':
          description: Facet not found for this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update facet state (internal/workflow)
      tags: [DataSets]
      description: |
        Workflow / processor endpoint used to transition a facet between
        `in_progress`, `ready`, and `errored`. When the facet is already
        `in_progress` with a non-null `jobId`, the request body's `jobId`
        must match (Layer-3 guard) or the response is 409.
      operationId: updateDataSetFacetState
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacetStateRequest'
      responses:
        '200':
          description: Facet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facet'
        '400':
          description: Invalid state value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: jobId mismatch (concurrent run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{id}/facets/{facetType}/run:
    post:
      summary: Trigger a facet population job
      tags: [DataSets]
      description: |
        Starts the population workflow for a facet. Currently supported:
        `pii` — kicks off the dataset-import workflow with
        `reprocessPiiOnly=true` and atomically transitions the facet to
        `in_progress`. The parent dataset `status` is not changed and must be
        `ready` or `errored` (and not currently importing).
      operationId: runDataSetFacet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema:
            type: string
            enum: [pii]
      responses:
        '202':
          description: Facet job started (or already running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunFacetJobResponse'
        '400':
          description: |
            Dataset is currently being imported, not in `ready`/`errored`
            status, or the facet type is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Manifests (under dataset) ---
  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests:
    get:
      summary: List all manifests for a dataset
      tags: [Manifests]
      operationId: listManifests
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      responses:
        '200':
          description: List of manifests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSetManifest'
    post:
      summary: Create a new manifest for a dataset
      tags: [Manifests]
      operationId: createManifest
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                uris:
                  type: array
                  items:
                    type: string
                  description: Optional initial set of file URIs (e.g. `s3://...`).
                metadata:
                  type: object
                  additionalProperties: true
                schema:
                  type: object
                  additionalProperties: true
                  description: Optional schema definition for the manifest
      responses:
        '201':
          description: Manifest created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetManifest'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Draft manifest already exists for this dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests/from/{sourceManifestId}:
    post:
      summary: Create a new manifest from another manifest
      tags: [Manifests]
      operationId: createManifestFromManifest
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: sourceManifestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetDataSetId:
                  type: string
                  pattern: '^dset[a-z0-9]{8}$'
                  description: Target dataset ID (defaults to the dataset in the path)
                metadata:
                  type: object
                  additionalProperties: true
                  description: Metadata for the new manifest (defaults to source manifest's metadata)
                schema:
                  type: object
                  additionalProperties: true
                  description: Optional schema definition for the manifest (defaults to source manifest's schema)
      responses:
        '201':
          description: Manifest created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetManifest'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source manifest or dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Draft manifest already exists for target dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests/{id}:
    get:
      summary: Get manifest by ID
      tags: [Manifests]
      operationId: getManifest
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Manifest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetManifest'
        '404':
          description: Manifest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests/{id}/files:
    patch:
      summary: Add files to a manifest (draft only) — returns pre-signed URLs
      tags: [Manifests]
      description: |
        Reserves file slots in a draft manifest and returns one pre-signed URL
        per requested file name. The per-dataset file-count cap (see
        `ManualUploadLimits`) is enforced here; the per-file size cap is not
        enforced at this step because the size is not known until upload.
      operationId: addManifestFiles
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileNames]
              properties:
                fileNames:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Returns array of file info with pre-signed URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    preSignedUrl:
                      type: string
                    fileName:
                      type: string
        '400':
          description: Bad request or manifest not in draft status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Manifest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Adding these files would exceed `MANUAL_UPLOAD_MAX_FILES_PER_DATASET`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests/{id}/source-uris:
    put:
      summary: Replace draft manifest file list with already-uploaded S3 URIs
      tags: [Manifests]
      description: |
        Replaces the file list of a draft manifest with the supplied S3 URIs.
        Used by the GUI for chunked large-upload registration (chunk 0) so the
        dataset PUT path does not auto-commit the manifest mid-registration.
      operationId: replaceManifestSourceUris
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris]
              properties:
                uris:
                  type: array
                  maxItems: 2000
                  items:
                    type: string
                    minLength: 1
                    maxLength: 4096
      responses:
        '200':
          description: Manifest file list replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetManifest'
        '400':
          description: Bad request or manifest not in draft status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Manifest or dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The post-replace file list would exceed `MANUAL_UPLOAD_MAX_FILES_PER_DATASET`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/datasets/{dataSetId}/manifests/{id}/append-source-uris:
    post:
      summary: Append already-uploaded S3 URIs to a draft manifest
      tags: [Manifests]
      description: Used by the GUI for subsequent chunks of large-upload registration.
      operationId: appendManifestSourceUris
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: dataSetId
          required: true
          schema:
            type: string
            pattern: '^dset[a-z0-9]{8}$'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris]
              properties:
                uris:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: string
                    minLength: 1
                    maxLength: 4096
      responses:
        '200':
          description: URIs appended to the manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetManifest'
        '400':
