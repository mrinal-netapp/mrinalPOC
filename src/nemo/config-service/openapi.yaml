  # --- Models (under project) ---
  /api/v1/projects/{projectId}/models:
    get:
      summary: List models in a project
      description: |
        Returns all models registered in the project, ordered by `createdAt`
        descending. By default each row is enriched with a
        `dependentsSummary` describing how many other entities reference the
        model; pass `include=dependentsSummary=false` to skip that lookup.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: query
          name: modelClass
          schema:
            type: string
          description: Filter by functional class (e.g. `reasoning`, `balanced`, `fast`, `code`)
        - in: query
          name: modelType
          schema:
            type: string
            enum: [llm, embedding]
          description: Filter by model type
        - in: query
          name: include
          schema:
            type: string
            enum: [dependentsSummary=false]
          description: |
            Reserved for response shaping. Pass
            `dependentsSummary=false` to suppress the per-row
            `dependentsSummary` field. Any other value (or absence) keeps
            the summary enabled.
      responses:
        '200':
          description: List of models (optionally enriched with `dependentsSummary`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a model
      description: |
        Creates a model and, when the Bifrost LLM gateway is enabled,
        registers it upstream so it can be routed by id. Validation rules:

        * `name` is required and must be unique within the project.
        * For remote providers (`openai`, `openai_compatible`, `aws_bedrock`,
          `azure`, `google`) a `credentialId` referencing a project
          Credential is required when the gateway is enabled.
        * For provider `ollama`, an `endpoint` (URL of the Ollama server)
          is required when the gateway is enabled.

        On success the server populates `id`, `gatewayModelId`, and a
        `rateCardOverride._gateway` block reflecting the gateway
        registration.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: Validation error or missing credential/endpoint for the chosen provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A model with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error or credential secret could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/list-available:
    post:
      summary: List models advertised by a provider
      description: |
        Calls the provider adapter to enumerate models the supplied
        credential can access. For credential-free providers (e.g.
        `ollama`) `credentialId` may be omitted. Results are not persisted
        — clients can use them to
        populate the model picker before calling `POST /models`.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAvailableModelsRequest'
      responses:
        '200':
          description: Models exposed by the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAvailableModelsResponse'
        '400':
          description: Missing or unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error or credential secret could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/classes:
    get:
      summary: List distinct model classes used in this project
      description: Returns the set of `modelClass` values currently assigned to models in the project, sorted ascending.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Distinct `modelClass` strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/{id}:
    get:
      summary: Get a model by id
      description: |
        Returns the stored model plus a few computed fields:

        * `gatewayModelId` is backfilled from the stored provider/model
          pair when the column predates the registration that captured it.
        * `contextWindow`, `maxOutputTokens`, and `supportsExtendedOutput`
          come from the static provider catalog when a match exists for
          `(provider, providerModelId)`.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model (enriched with static catalog metadata)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a model
      description: |
        Updates display fields and metadata on an existing model. Provider,
        credential, and endpoint changes are not propagated to the upstream
        gateway; switching those values requires deleting and re-registering
        the model.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: Updated model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A model with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a model
      description: |
        Deletes a model. The request is rejected with `409 HAS_DEPENDENTS`
        when any other entity (agents, agent teams, knowledge bases, ...)
        still references this model — clients should resolve the dependents
        listed in the response and retry. When the Bifrost gateway is
        enabled the model is also de-registered upstream.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Model deleted
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Model still has dependents; remove or rewire them and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasDependentsError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/{id}/infer:
    post:
      summary: Run a chat completion against a registered LLM model
      description: |
        Routes a chat completion through the configured Bifrost LLM gateway
        using this model's id. Falls back to `provider/providerModelId`
        routing when the gateway reports that the id-based routing rule is
        missing (legacy rows). Only LLM models may be invoked.

        Limits enforced by the route:
        * `messages` must be a non-empty array (max 64 entries).
        * Each message must have `role ∈ {system, user, assistant}` and a
          non-empty `content` string (max 20000 characters).
        * `temperature` (if provided) must be a number; `maxTokens` (if
          provided) must be a positive integer.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferRequest'
      responses:
        '200':
          description: Completion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Model is not an LLM (e.g. embedding model)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: LLM gateway not configured, or upstream gateway returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Upstream gateway timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/{id}/dependents:
    get:
      summary: List entities that depend on this model (paginated)
      description: |
        Returns a keyset-paginated page of entities that reference this
        model via the reference-edge catalog. Use this endpoint to inspect
        what is blocking deletion when `DELETE /models/{id}` returns
        `409 HAS_DEPENDENTS`.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size; capped at 200.
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor returned by a previous page (`nextCursor`).
        - in: query
          name: kind
          schema:
            type: string
            enum: [agent, agent_team, knowledge_base, mcp_server, pipeline, dataset, workspace, model]
          description: Filter dependents by source entity kind.
      responses:
        '200':
          description: Page of dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentsPage'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/{id}/history:
    get:
      summary: Get model version history
      description: Returns all snapshots of the model, ordered by `version` descending. Each entry contains the full Model payload at that version under `data`.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of version history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelHistory'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/models/{id}/restore-version:
    post:
      summary: Restore model to a previous version
      description: |
        Overwrites the current model with the snapshot taken at the given
        history `version`. `id`, `createdAt`, and `updatedAt` are preserved.
      tags: [Models]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: number
                  description: Version number to restore (see `GET /history`).
      responses:
        '200':
          description: Model restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Model'
        '400':
          description: Missing or invalid `version` in body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Pipelines (under project) ---
  /api/v1/projects/{projectId}/pipelines:
