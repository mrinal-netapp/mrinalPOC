  # --- Search (top-level) ---
  /api/v1/search:
    post:
      summary: Top-level search for any entity
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityType:
                  type: string
                  enum: [connectors, datasources, datasets]
                  description: |
                    Entity collection to search. `connectors` is a backwards-compatible
                    alias that filters DataSources to `type=connector`.
                fields:
                  type: object
                nameRegex:
                  type: string
                limit:
                  type: integer
                skip:
                  type: integer
      responses:
        '200':
          description: List of matching entities

  # --- Knowledge bases (under project) ---
  /api/v1/projects/{projectId}/knowledgebases:
    get:
      summary: List knowledge bases
      tags: [KnowledgeBases]
      description: |
        Lists every knowledge base in the project. In-progress KBs are enriched
        live from the workflow-engine progress store, and the response always
        includes the side-channel `facets` array. Each row also carries a
        `dependentsSummary` count unless `include=dependentsSummary=false` is
        set.
      operationId: listKnowledgeBases
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: include
          schema: { type: string }
          description: |
            Set to `dependentsSummary=false` to skip the per-row
            `dependentsSummary` annotation (saves one extra DB round trip).
      responses:
        '200':
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a knowledge base
      tags: [KnowledgeBases]
      description: |
        Creates a KB row in PostgreSQL and auto-triggers the KB creation
        workflow that chunks + embeds the source dataset. Returns the freshly
        created KB. If the source dataset is missing or not in `ready` status,
        the KB is still persisted and the response carries a `warning`
        explaining why processing did not start. If the workflow-engine call
        fails, `warning` and `workflowError` are included instead. On success
        the response includes `workflowId` and `workflowStatus=running`, and
        the KB's `status` is set to `in_progress` with `jobId` populated.
      operationId: createKnowledgeBase
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '201':
          description: Knowledge base created (workflow trigger result on `workflowId`/`warning`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKnowledgeBaseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A knowledge base with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}:
    get:
      summary: Get knowledge base by ID
      tags: [KnowledgeBases]
      description: |
        Returns the KB along with its side-channel `facets`. If the KB is
        `in_progress`, the response is enriched with live progress from the
        workflow-engine's in-memory store (falls back to the DB-stored
        `progress` snapshot if the workflow-engine is unreachable).
      operationId: getKnowledgeBase
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      responses:
        '200':
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update knowledge base by ID
      tags: [KnowledgeBases]
      description: |
        Updates KB metadata and, when indexing-related fields change, auto-triggers
        a full reprocessing workflow (same engine path as `POST /knowledgebases/{id}/create`).

        Identity fields (`projectId`, `id`) on the body are ignored. Renaming is
        validated against the `(projectId, name)` unique constraint and returns 409
        on collisions.

        **Metadata-only fields** (saved immediately): `name`, `description`, `labels`,
        `synchronizationConfig`.

        **Processing fields** (trigger reprocess when changed): `sourceDataset`,
        `embeddingModel`, `embeddingModelId`, `chunkSize`, `vectorSize`, `dataType`,
        `chunkStrategy`, `chunkOverlap`, `chunkOptions`, `indexingMode`,
        `quantizationType`, `quantizationOptions`, `textColumns`. These are passed
        to the workflow as overrides and are **not** written to PostgreSQL until
        the workflow completes successfully (so a failed reprocess leaves the live
        index aligned with the persisted config).

        Returns `workflowId` + `workflowStatus=running` when reprocessing starts.
        Returns `warning` + `workflowSkippedReason` when metadata was saved but the
        workflow was not started (e.g. source dataset missing or not `ready`).
        Returns 409 with `code=KB_IN_PROGRESS` when processing fields changed while
        the KB is already `in_progress`.
      operationId: updateKnowledgeBase
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: |
            Knowledge base updated. When indexing-related fields changed, the body may
            include workflow trigger fields (`workflowId`, `warning`, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKnowledgeBaseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden — user-authenticated callers cannot set workflow-managed fields
            such as `status` (`code=WORKFLOW_FIELDS_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Conflict — duplicate name in the project (`error` only), or reprocessing
            blocked because the KB is already `in_progress` (`code=KB_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete knowledge base by ID
      tags: [KnowledgeBases]
      description: |
        Deletes the KB after rejecting the request when other entities
        (agents, agent-teams, etc.) still depend on it. Any running KB
        workflow is best-effort terminated, the row is removed, and a
        fire-and-forget S3 cleanup workflow is started. The response signals
        whether that cleanup workflow was successfully triggered.
      operationId: deleteKnowledgeBase
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      responses:
        '200':
          description: Knowledge base deleted (S3 cleanup may still be in flight)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteKnowledgeBaseResponse'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Knowledge base still has dependents (agents, agent-teams, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteKnowledgeBaseConflictResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/dependents:
    get:
      summary: List entities that depend on this knowledge base
      tags: [KnowledgeBases]
      description: |
        Returns a keyset-paginated page of reference-edges whose `target` is
        this knowledge base (e.g. agents, agent-teams). Use `cursor` from the
        previous response to fetch subsequent pages.
      operationId: listKnowledgeBaseDependents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor returned in `nextCursor` of the previous page.
        - in: query
          name: kind
          schema: { type: string }
          description: Filter dependents by source entity kind (e.g. `agent`).
      responses:
        '200':
          description: Page of dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentsPage'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/history:
    get:
      summary: List knowledge base versions
      tags: [KnowledgeBases]
      description: |
        Returns the full revision history of a KB, newest first. Each entry is
        a snapshot of the KB's domain metadata at that version, as recorded in
        the `knowledge_base_history` table. Use
        `POST /knowledgebases/{id}/restore-version` to revert to a specific
        `version`.
      operationId: listKnowledgeBaseVersions
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      responses:
        '200':
          description: List of KB versions (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseVersion'
        '404':
          description: Knowledge base not found, or no history recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/restore-version:
    post:
      summary: Restore knowledge base to a previous version
      tags: [KnowledgeBases]
      description: |
        Restores domain metadata (name, description, chunking, indexing,
        quantization configs, etc.) from a history entry. Identity fields
        (`projectId`, `id`) and history-internal fields are stripped before
        the restore is applied. The vector index is NOT rebuilt — call
        `POST /knowledgebases/{id}/create` afterwards if the new config
        requires reprocessing.
      operationId: restoreKnowledgeBaseVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: number
                  description: History version number to restore.
      responses:
        '200':
          description: Knowledge base restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreKnowledgeBaseResponse'
        '400':
          description: Invalid request (missing or non-numeric version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Knowledge base or history version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/create:
    post:
      summary: Trigger knowledge base creation/reprocessing
      tags: [KnowledgeBases]
      description: |
        Starts the KB processing workflow that chunks + embeds the source
        dataset and writes a fresh LanceDB index. Always runs in `full`
        processing mode. Optional fields in the request body
        (`embeddingModel`, `chunkSize`, `vectorSize`, `chunkStrategy`,
        `chunkOverlap`, `chunkOptions`, `indexingMode`, `quantizationType`,
        `quantizationOptions`) override the persisted KB config for this run
        only — the DB record is intentionally NOT updated until the workflow
        completes successfully (so a failed reprocess leaves the KB pointing
        at the live index).

        Side effects: KB `status` is set to `in_progress`, `jobId` is set to
        the workflow execution ID, `progress` is reset to
        `{ phase: 'queued', percentage: 0 }`, and `errorMessage` is cleared.
        The source dataset must exist in the same project and be in `ready`
        status.
      operationId: triggerKnowledgeBaseCreation
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerKnowledgeBaseCreationRequest'
      responses:
        '202':
          description: KB processing workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerKnowledgeBaseCreationResponse'
        '400':
          description: Source dataset not in `ready` status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Knowledge base or source dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/versions:
    get:
      summary: List per-sync versions for a knowledge base
      tags: [KnowledgeBases]
      description: |
        Lists every blue-green LanceDB version that the KB processor has
        written under `{pathPrefix}/knowledgebases/{kbId}/`. Each successful
        sync creates a new `lancedb-run-{workflowRunId}/` (or legacy
        `lancedb-{YYYYMMDD-HHMMSS}/`) prefix and atomically rewrites the
        active pointer in `metadata.json#lanceTablePath`. The version whose
        absolute path matches `lanceTablePath` is reported with
        `isActive=true`.
      operationId: listKnowledgeBaseVersions2
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      responses:
        '200':
          description: List of versions (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseSyncListResponse'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to reach the workflow-engine to list versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/versions/{versionId}/rollback:
    post:
      summary: Roll back a knowledge base to a previous sync version
      tags: [KnowledgeBases]
      description: |
        Atomically rewrites `metadata.json#lanceTablePath` to point at the
        target historical version directory. The kb-retrieval-service
        connection pool refreshes automatically because its cache key includes
        the LanceDB path; no explicit cache invalidation is required.
        Best-effort: the KB's `lanceTablePath` column is also updated for UI
        consistency. Rejected with 409 when the KB is currently being
        processed.
      operationId: rollbackKnowledgeBaseVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        - in: path
          name: versionId
          required: true
          schema:
            type: string
            description: |
              Sync version identifier (e.g. `lancedb-run-{runId}` or
              `lancedb-{YYYYMMDD-HHMMSS}`). Must match the directory name
              under the KB root prefix.
      responses:
        '200':
          description: Rollback succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackKnowledgeBaseSyncResponse'
        '404':
          description: Knowledge base or target version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: KB is currently being processed; wait for the run to finish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to reach the workflow-engine to perform the rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/facets:
    get:
      summary: List facets for a knowledge base
      tags: [KnowledgeBases]
      description: |
        Lists every side-channel facet on this KB (e.g. `embedding`). Facets
        transition independently of the parent KB `status`.
      operationId: listKnowledgeBaseFacets
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
      responses:
        '200':
          description: List of facets
          content:
            application/json:
              schema:
                type: object
                properties:
                  facets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facet'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/facets/{facetType}:
    get:
      summary: Get a single facet for a knowledge base
      tags: [KnowledgeBases]
      operationId: getKnowledgeBaseFacet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema: { type: string }
          description: 'e.g. `embedding`'
      responses:
        '200':
          description: Facet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facet'
        '404':
          description: Facet not found for this knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update facet state (internal/workflow)
      tags: [KnowledgeBases]
      description: |
        Workflow / processor endpoint used to transition a facet between
        `in_progress`, `ready`, and `errored`. When the facet is already
        `in_progress` with a non-null `jobId`, the request body's `jobId`
        must match (Layer-3 guard) or the response is 409.
      operationId: updateKnowledgeBaseFacetState
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacetStateRequest'
      responses:
        '200':
          description: Facet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facet'
        '400':
          description: Invalid state value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: jobId mismatch (concurrent run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/knowledgebases/{id}/facets/{facetType}/run:
    post:
      summary: Trigger a facet population job
      tags: [KnowledgeBases]
      description: |
        Starts the population workflow for a facet. Currently supported:
        `embedding` — runs the same KB creation workflow with optional config
        overrides (embedding model, chunking, indexing, quantization) and
        atomically transitions the embedding facet to `in_progress`. The KB
        must be in `ready` or `errored` status; a `400` is returned if it is
        already `in_progress`. The source dataset must be in `ready` status.
      operationId: runKnowledgeBaseFacet
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
        - in: path
          name: facetType
          required: true
          schema:
            type: string
            enum: [embedding]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerKnowledgeBaseCreationRequest'
      responses:
        '202':
          description: Facet job started (or already running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunKnowledgeBaseFacetResponse'
        '400':
          description: |
            KB is currently being processed, not in `ready`/`errored` status,
            source dataset not ready, or unknown facet type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Knowledge base or source dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to start workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

