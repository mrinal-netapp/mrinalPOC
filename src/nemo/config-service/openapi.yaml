  # --- Agents (under project) ---
  /api/v1/projects/{projectId}/agents:
    get:
      summary: List agents
      tags: [Agents]
      description: |
        Lists every agent in the project, ordered by `updatedAt` desc. Each row
        carries a `dependentsSummary` annotation (count of pipelines, teams,
        agents, etc. that reference this agent) unless
        `include=dependentsSummary=false` is set.
      operationId: listAgents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1 }
        - in: query
          name: skip
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: field
          schema: { type: string }
          description: Exact-match column filter (used with `value`); applied as `WHERE agent.{field} = {value}`.
        - in: query
          name: value
          schema: { type: string }
        - in: query
          name: nameRegex
          schema: { type: string }
          description: Case-insensitive substring filter on `name`.
        - in: query
          name: include
          schema: { type: string }
          description: |
            Set to `dependentsSummary=false` to skip the per-row
            `dependentsSummary` annotation.
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an agent
      tags: [Agents]
      description: |
        Creates an agent in PostgreSQL. At least one of `modelId` or
        `modelClass` is required. `datasetIds` is accepted for backward
        compatibility but stripped before persistence; persistent dataset
        references should be added through downstream entities (pipelines,
        teams) instead.
      operationId: createAgent
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: |
            Validation error (missing `role`/`systemPrompt`, both `modelId`
            and `modelClass` absent, invalid `temperature`, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agents/{id}:
    get:
      summary: Get agent by ID
      tags: [Agents]
      description: |
        Returns the agent. When the agent attaches MCP servers (project-scoped
        or platform-scoped auto-attached servers), an `_resolvedMCPServers`
        map is added describing each effective server (name, transport,
        runtime status, prompt fragment from the catalog). Entries in
        `error` status are filtered out.
      operationId: getAgent
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update agent by ID
      tags: [Agents]
      description: |
        Updates editable agent fields. Identity fields (`id`, `projectId`,
        `createdAt`, `updatedAt`) and `datasetIds` are stripped from the body
        before persistence. Renaming is checked against the
        `(projectId, name)` unique index.
      operationId: updateAgent
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete agent by ID
      tags: [Agents]
      description: |
        Deletes the agent after rejecting the request when other entities
        (teams, pipelines, deployments, etc.) still reference it via the
        reference-edge graph.
      operationId: deleteAgent
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent still has dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentConflictResponse'

  /api/v1/projects/{projectId}/agents/{id}/dependents:
    get:
      summary: List entities that depend on this agent
      tags: [Agents]
      description: |
        Returns a keyset-paginated page of reference-edges whose `target` is
        this agent (e.g. teams, pipelines, deployments). Use `cursor` from
        the previous response to fetch the next page.
      operationId: listAgentDependents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor returned in `nextCursor` of the previous page.
        - in: query
          name: kind
          schema: { type: string }
          description: Filter dependents by source entity kind (e.g. `agent_team`).
      responses:
        '200':
          description: Page of dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentsPage'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agents/{id}/history:
    get:
      summary: List agent versions
      tags: [Agents]
      description: |
        Returns the full revision history of an agent, newest first. Each
        entry is a snapshot of the agent's domain metadata at that version,
        as recorded in the `agent_history` table. Use
        `POST /agents/{id}/restore-version` to revert to a specific
        `version`.
      operationId: listAgentVersions
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      responses:
        '200':
          description: List of agent versions (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentVersion'
        '404':
          description: Agent not found, or no history recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agents/{id}/restore-version:
    post:
      summary: Restore agent to a previous version
      tags: [Agents]
      description: |
        Restores domain metadata from a history entry. Identity fields and
        history-internal fields are stripped before the restore is applied.
      operationId: restoreAgentVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: number
                  description: History version number to restore.
      responses:
        '200':
          description: Agent restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreAgentResponse'
        '400':
          description: Invalid request (missing or non-numeric version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent or history version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agents/{id}/status:
    put:
      summary: Update agent lifecycle / deployment status
      tags: [Agents]
      description: |
        Dedicated endpoint for transitioning the agent's `status`,
        `statusMessage`, and `deploymentStatus` fields. Workflow / deployment
        callers should prefer this over the regular `PUT /agents/{id}` because
        it carries a focused contract and never re-validates the rest of the
        agent configuration. Body must include at least one of the three
        fields.
      operationId: updateAgentStatus
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^ag-[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentStatusRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Validation error (no fields provided, invalid enum value, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Agent Teams (under project) ---
  /api/v1/projects/{projectId}/agent-teams:
    get:
      summary: List agent teams
      tags: [AgentTeams]
      description: |
        Lists every agent team in the project, ordered by `updatedAt` desc.
        Each row carries a `dependentsSummary` annotation (count of
        pipelines, parent teams, deployments, etc. that reference this team)
        unless `include=dependentsSummary=false` is set.
      operationId: listAgentTeams
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1 }
        - in: query
          name: skip
          schema: { type: integer, default: 0, minimum: 0 }
        - in: query
          name: nameRegex
          schema: { type: string }
          description: Case-insensitive substring filter on `name`.
        - in: query
          name: include
          schema: { type: string }
          description: |
            Set to `dependentsSummary=false` to skip the per-row
            `dependentsSummary` annotation.
      responses:
        '200':
          description: List of agent teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTeam'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an agent team
      tags: [AgentTeams]
      description: |
        Creates an agent team in PostgreSQL. Member ids must resolve to
        existing agents/teams in the same project. The service rejects
        cycles in the `team -> team` member graph by performing a DFS
        across all teams in the project. When a `manager` is provided, at
        least one of `manager.modelId` or `manager.modelClass` is required.
      operationId: createAgentTeam
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTeamRequest'
      responses:
        '201':
          description: Agent team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeam'
        '400':
          description: |
            Validation error (missing required fields, manager missing
            `modelId`/`modelClass`, member ids not found in this project, or
            team graph contains a cycle).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent team with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agent-teams/{id}:
    get:
      summary: Get agent team by ID
      tags: [AgentTeams]
      operationId: getAgentTeam
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^agr-[a-z0-9]{8}$'
      responses:
        '200':
          description: Agent team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeam'
        '404':
          description: Agent team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update agent team by ID
      tags: [AgentTeams]
      description: |
        Updates editable agent team fields. When `members` is provided the
        ids are revalidated and a fresh cycle check is performed. The
        deprecated `orchestration` body field is silently mapped to
        `orchestrationPolicy` for backward compatibility.
      operationId: updateAgentTeam
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^agr-[a-z0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentTeamRequest'
      responses:
        '200':
          description: Agent team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeam'
        '400':
          description: |
            Validation error, missing member references, or new member graph
            introduces a cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent team with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete agent team by ID
      tags: [AgentTeams]
      description: |
        Deletes the agent team after rejecting the request when other
        entities still reference it. The service performs two checks: the
        reference-edge graph (`HAS_DEPENDENTS`), and a textual scan of
        sibling teams' `members` JSON for the target team id (defense in
        depth until member references are first-class edges).
      operationId: deleteAgentTeam
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^agr-[a-z0-9]{8}$'
      responses:
        '200':
          description: Agent team deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentTeamResponse'
        '404':
          description: Agent team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent team still has dependents (or is referenced by another team)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentTeamConflictResponse'

  /api/v1/projects/{projectId}/agent-teams/{id}/dependents:
    get:
      summary: List entities that depend on this agent team
      tags: [AgentTeams]
      description: |
        Returns a keyset-paginated page of reference-edges whose `target` is
        this agent team (e.g. parent teams, pipelines, deployments).
      operationId: listAgentTeamDependents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^agr-[a-z0-9]{8}$'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor returned in `nextCursor` of the previous page.
        - in: query
          name: kind
          schema: { type: string }
          description: Filter dependents by source entity kind (e.g. `agent_team`).
      responses:
        '200':
          description: Page of dependents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentsPage'
        '404':
          description: Agent team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agent-teams/{id}/history:
    get:
