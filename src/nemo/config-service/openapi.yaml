    # ----------------------------------------------------------------------
    # Evaluations (agent target) family
    #
    # EvaluationTemplate, TestCase, and EvaluationRun entities for
    # /api/v1/projects/{projectId}/evaluation/agents/...
    # Per-case results are served from the artifact store at the computed
    # path projects/{projectId}/evaluations/{evalId}/runs/{runId}/results.json,
    # not from config-service.
    # ----------------------------------------------------------------------
    EvaluationAgentBinding:
      type: object
      description: |
        Target agent or team under evaluation. Provide either `agentId` (single
        agent) or `agentTeam` (agent team id). At least one must be set.
      properties:
        agentId:
          type: string
        agentTeam:
          type: string
        agentVersion:
          type: string
          deprecated: true
          description: |
            Free-form version label (e.g. `'v2.4.1'`). Optional and
            currently unenforced — the `Agent` entity has no version
            column / no `AgentVersion` ledger today. Reserved as a slot
            for future versioning work; until then, treat as
            display-only metadata. Will be replaced by `agentVersionId`
            referencing a real version entity when versioning lands.
    EvaluationAiJudgeConfig:
      type: object
      description: |
        AI-judge config (UI "Configure AI judge" dialog). The whole block is
        required when strategy is 'llm_judge' or 'both', in which case both
        `models` and `dimensions` are required.
      required: [models, dimensions]
      properties:
        models:
          type: array
          minItems: 1
          items: { type: string }
          description: Judge model id(s); required when strategy != deterministic.
        dimensions:
          type: array
          items:
            type: string
            enum: [helpfulness, correctness, completeness, coherence, following_instructions, professional_style_tone, faithfulness_groundedness, safety_harmlessness, refusal_quality]
          description: Selected judge dimension keys (see /api/v1/evaluation/rubric-catalog).
        evalMode:
          type: string
          enum: [pointwise, pairwise]
        samplingMode:
          type: string
          enum: [all, stratified, fraction]
        stratifiedSlices:
          type: boolean
        gateWhenSampled:
          type: string
          enum: [informational, blocking]
        goldenAvailable:
          type: boolean
    EvaluationDeterministicConfig:
      type: object
      description: Deterministic-metric config (UI "Configure deterministic metrics" dialog).
      required: [metrics]
      properties:
        metrics:
          type: array
          items:
            type: string
            enum: [rag_quality, correctness, tool_use, safety, structural_compliance, confusion_matrix]
          description: Selected deterministic metric keys (latency/token_usage/cost are disabled at launch).
    EvaluationEvaluators:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [deterministic, llm_judge, both]
        rubricPreset:
          type: string
        aiJudge:
          $ref: '#/components/schemas/EvaluationAiJudgeConfig'
        deterministic:
          $ref: '#/components/schemas/EvaluationDeterministicConfig'
    EvaluationRubricCatalog:
      type: object
      properties:
        judgeDimensions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              description: { type: string }
              output: { type: string }
        deterministicMetrics:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              description: { type: string }
              enabled: { type: boolean }
        testCaseSources:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              description: { type: string }
    EstimateImpactRequest:
      type: object
      properties:
        testCaseCount: { type: integer, minimum: 0 }
        evaluators: { $ref: '#/components/schemas/EvaluationEvaluators' }
    EstimateImpactResponse:
      type: object
      properties:
        estimatedDurationMinutes: { type: number }
        estimatedCostUsd: { type: number }
        assumptions:
          type: object
          additionalProperties: { type: number }
    EvaluationThresholds:
      type: object
      properties:
        gates:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              level: { type: string, enum: [warning, blocking, informational] }
              threshold: { type: number }
        coverageMinPct: { type: number }
        infraFailureMaxPct: { type: number }
        safetyP0Threshold: { type: number }
        minCompletedCases: { type: integer }
    EvaluationSchedule:
      type: object
      description: When enabled is true, scheduleType and its type-specific fields are required; a disabled schedule may omit scheduleType.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        scheduleType:
          type: string
          enum: [hourly, daily, weekly, monthly, cron]
        hourUtc: { type: integer, minimum: 0, maximum: 23 }
        minuteUtc: { type: integer, minimum: 0, maximum: 59 }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        cron: { type: string }
        timezone: { type: string, default: UTC }
    EvaluationScheduleStatus:
      type: object
      properties:
        state: { type: string, enum: [active, paused] }
        lastRunAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        temporalScheduleId: { type: string }
    EvaluationScheduleResponse:
      type: object
      properties:
        schedule:
          allOf: [{ $ref: '#/components/schemas/EvaluationSchedule' }]
          nullable: true
        scheduleStatus:
          allOf: [{ $ref: '#/components/schemas/EvaluationScheduleStatus' }]
          nullable: true
    EvaluationTemplate:
      type: object
      description: Reusable evaluation definition (what + how) for an agent version.
      required: [templateId, projectId, evalName, target, agent, evaluators]
      properties:
        templateId:
          type: string
          pattern: '^evt-[a-z0-9]{8}$'
          readOnly: true
        projectId:
          type: string
          readOnly: true
        evalName:
          type: string
        description:
          type: string
        labels:
          type: array
          items: { type: string }
        owner:
          type: string
        createdBy:
          type: string
          readOnly: true
        lastModifiedBy:
          type: string
          readOnly: true
        target:
          type: string
          enum: [agent_version]
        agent:
          $ref: '#/components/schemas/EvaluationAgentBinding'
        models:
          type: array
          items: { type: string }
        evaluationScope:
          type: string
          enum: [full_agent_execution, response_only, retrieval_only]
        suite:
          type: string
          enum: [rag, safety, tool_use, custom]
        evaluators:
          $ref: '#/components/schemas/EvaluationEvaluators'
        thresholds:
          $ref: '#/components/schemas/EvaluationThresholds'
        cases:
          type: object
          description: |
            Pointer to the eval's test-cases JSONL on the data plane.
            Test cases are owned by the evaluation template — NOT a
            project Dataset. The JSONL bytes live at
            `projects/{projectId}/evaluations/{evalId}/testcases/{filename ?? 'cases.jsonl'}`
            (PVC) alongside the eval's run history. Authors upload via
            the eval-scoped `PUT /evaluations/{evalId}/testcases` route.
            The eval worker validates the JSONL at workflow start via
            `validateTestCases`. No customer-derived row content lives
            in `config-service` — only the storage pointer + integrity check.
          properties:
            schemaVersion: { type: string, enum: [golden_test_v1, flat_csv_legacy] }
            filename:
              type: string
              description: Override the default `cases.jsonl` filename inside the eval's `testcases/` folder.
            sample:
              type: object
              properties:
                mode: { type: string, enum: [all, fraction, stratified] }
                fraction: { type: number }
                stratifyBy: { type: string }
        schedule:
          $ref: '#/components/schemas/EvaluationSchedule'
        scheduleStatus:
          $ref: '#/components/schemas/EvaluationScheduleStatus'
        runMode:
          type: string
          enum: [single, regression, ab_compare, tuning_sweep, repeats]
        regression:
          type: object
          properties:
            baselineRunId: { type: string }
        concurrency:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    EvaluationTemplateListItem:
      allOf:
        - $ref: '#/components/schemas/EvaluationTemplate'
        - type: object
          properties:
            latestRunStatus:
              type: string
              nullable: true
            runCount:
              type: integer
            lastRunUpdatedAt:
              type: string
              format: date-time
              nullable: true
    CreateEvaluationTemplateRequest:
      type: object
      required: [evalName, agent, evaluators]
      properties:
        evalName: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        owner: { type: string }
        target: { type: string, enum: [agent_version] }
        agent: { $ref: '#/components/schemas/EvaluationAgentBinding' }
        models:
          type: array
          items: { type: string }
        evaluationScope:
          type: string
          enum: [full_agent_execution, response_only, retrieval_only]
        suite:
          type: string
          enum: [rag, safety, tool_use, custom]
        evaluators: { $ref: '#/components/schemas/EvaluationEvaluators' }
        thresholds: { $ref: '#/components/schemas/EvaluationThresholds' }
        cases:
          type: object
        schedule: { $ref: '#/components/schemas/EvaluationSchedule' }
        runMode:
          type: string
          enum: [single, regression, ab_compare, tuning_sweep, repeats]
        concurrency: { type: integer }
    PatchEvaluationTemplateRequest:
      type: object
      description: All fields optional; identity/attribution fields are stripped server-side.
      properties:
        evalName: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        owner: { type: string }
        agent: { $ref: '#/components/schemas/EvaluationAgentBinding' }
        models:
          type: array
          items: { type: string }
        evaluationScope:
          type: string
          enum: [full_agent_execution, response_only, retrieval_only]
        suite:
          type: string
          enum: [rag, safety, tool_use, custom]
        evaluators: { $ref: '#/components/schemas/EvaluationEvaluators' }
        thresholds: { $ref: '#/components/schemas/EvaluationThresholds' }
        cases:
          type: object
        schedule: { $ref: '#/components/schemas/EvaluationSchedule' }
        runMode:
          type: string
          enum: [single, regression, ab_compare, tuning_sweep, repeats]
        concurrency: { type: integer }
    EvaluationTemplateHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string }
        version: { type: integer }
        data: { type: object }
        modifiedAt: { type: string, format: date-time }
        modifiedBy: { type: string, nullable: true }
        op: { type: string, nullable: true }
    # `TestCase`, `BulkTestCasesRequest`, `PatchTestCaseRequest`, and
    # `ValidateTestCasesResponse` schemas were retired in item 4 (JSONL
    # /dataset pivot). Test cases now live as a JSONL on the data plane
    # PVC, addressed by the template's `cases.filename` pointer.
    EvaluationResults:
      type: object
      properties:
        testCaseCoveragePct: { type: number }
        infrastructureFailureRatePct: { type: number }
        qualityPct: { type: number }
        progress:
          type: object
          properties:
            casesDone: { type: integer }
            casesTotal: { type: integer }
            percentage: { type: number }
        domainMetrics:
          type: object
          additionalProperties: { type: number }
        metricGroups:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              passed: { type: integer }
              skipped: { type: integer }
              failed: { type: integer }
        failedCaseCount: { type: integer }
        gateOutcome:
          type: object
          properties:
            passed: { type: boolean }
            failedGates:
              type: array
              items: { type: string }
    EvaluationAuditEvent:
      type: object
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        type: { type: string }
        message: { type: string }
        data: { type: object }
    EvaluationRun:
      type: object
      required: [runId, templateId, projectId, name, status, baselineStatus]
      properties:
        runId:
          type: string
          format: uuid
          readOnly: true
        templateId:
          type: string
        projectId:
          type: string
          readOnly: true
        name:
          type: string
        status:
          type: string
          enum: [queued, running, aggregating, success, failed, cancelled]
        baselineStatus:
          type: string
          enum: [not_set, current_baseline, above_baseline, below_baseline]
        workflowId:
          type: string
        trigger:
          type: object
          properties:
            actor: { type: string }
            reason: { type: string }
            triggeredAt: { type: string, format: date-time }
        provenance:
          type: object
        templateSnapshot:
          $ref: '#/components/schemas/EvaluationTemplate'
        # `casesSnapshot` retired in item 4 (JSONL/dataset pivot).
        # Cases live as a project Dataset on the data plane PVC.
        results:
          $ref: '#/components/schemas/EvaluationResults'
        audit:
          type: array
          items: { $ref: '#/components/schemas/EvaluationAuditEvent' }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    RunOptions:
      type: object
      properties:
        runId: { type: string }
        name: { type: string }
        actor: { type: string }
        reason: { type: string }
        fromRunId: { type: string }
        overrides:
          type: object
          properties:
            concurrency: { type: integer }
            sampleOverride:
              type: object
              properties:
                mode: { type: string, enum: [all, fraction] }
                fraction: { type: number }
    RunTriggerResponse:
      type: object
      properties:
        runId: { type: string, format: uuid }
        workflowId: { type: string }
        status: { type: string }
        run: { $ref: '#/components/schemas/EvaluationRun' }
    PatchEvaluationRunRequest:
      type: object
      description: Workflow-only writer fields.
      properties:
        status:
          type: string
          enum: [queued, running, aggregating, success, failed, cancelled]
        results: { $ref: '#/components/schemas/EvaluationResults' }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        workflowId: { type: string }
        auditAppend:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              message: { type: string }
              actor: { type: string }
              data: { type: object }
    CreateAuditEventRequest:
      type: object
      required: [type]
      properties:
        type: { type: string }
        message: { type: string }
        data: { type: object }
