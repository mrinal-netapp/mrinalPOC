        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^agr-[a-z0-9]{8}$'
      responses:
        '200':
          description: List of agent team versions (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTeamVersion'
        '404':
          description: Agent team not found, or no history recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/agent-teams/{id}/restore-version:
    post:
      summary: Restore agent team to a previous version
      tags: [AgentTeams]
      description: |
        Restores domain metadata from a history entry. The restored team is
        revalidated for cycles before the response is returned.
      operationId: restoreAgentTeamVersion
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
