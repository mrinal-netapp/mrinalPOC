  # ─────────────────────────────────────────────────────────────
  # Test cases (eval-owned, NOT a project Dataset)
  # ─────────────────────────────────────────────────────────────
  # Golden test cases live on the PVC at
  #   `projects/{projectId}/evaluations/{evalId}/testcases/{filename ?? 'cases.jsonl'}`
  # alongside the eval's run history. Authors upload via the eval-scoped
  # routes below; the bytes never reach config-service's database. The
  # template carries only the storage pointer (filename).
  # The eval worker validates the JSONL at workflow start via
  # `validateTestCases`.

  /api/v1/projects/{projectId}/evaluation/agents/evaluations/{evalId}/testcases:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string }
      - in: path
        name: evalId
        required: true
        description: Slugified `evalName` of the template (one-to-one).
        schema: { type: string }
    put:
      summary: Upload the JSONL test cases for an evaluation
      tags: [Evaluations]
      description: |
        Accepts a raw NDJSON body (`Content-Type: application/x-ndjson`,
        `application/octet-stream`, or `text/plain`) and writes it to
        the PVC at
        `projects/{projectId}/evaluations/{evalId}/testcases/{filename}`.
        Schema validation is deferred to the eval worker's
        `validateTestCases` activity at workflow start.
      operationId: uploadEvaluationTestCases
      parameters:
        - in: query
          name: filename
          required: false
          schema: { type: string, pattern: '^[a-zA-Z0-9._-]+\\.(jsonl|json)$' }
          description: Override the default `cases.jsonl` filename.
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: Test cases uploaded
          content:
            application/json:
              schema:
                type: object
                required: [filename, byteCount, lineCount]
                properties:
                  filename: { type: string }
                  byteCount: { type: integer }
                  lineCount: { type: integer }
        '400':
          description: Invalid filename or empty body
        '404':
          description: Evaluation or project not found
    get:
      summary: Get the JSONL test cases for an evaluation (or metadata only)
      tags: [Evaluations]
      operationId: getEvaluationTestCases
      parameters:
        - in: query
          name: include
          required: false
          schema: { type: string, enum: [metadata, body], default: metadata }
      responses:
        '200':
          description: Metadata or raw JSONL bytes (when `include=body`)
          content:
            application/json:
              schema:
                type: object
                required: [filename, byteCount, lineCount]
                properties:
                  filename: { type: string }
                  byteCount: { type: integer }
                  lineCount: { type: integer }
            application/x-ndjson:
              schema: { type: string, format: binary }
        '404':
          description: Test cases not uploaded yet
    delete:
      summary: Remove the JSONL test cases for an evaluation
      tags: [Evaluations]
      description: |
        Idempotent: returns 204 even if the file was already absent.
        Clears the template's `cases.filename` pointer.
      operationId: deleteEvaluationTestCases
      responses:
        '204':
          description: Deleted
        '404':
          description: Evaluation or project not found

  /api/v1/projects/{projectId}/evaluation/agents/templates/{templateId}/runs:
    post:
      summary: Trigger an evaluation run
      tags: [Evaluations]
      description: |
        Creates a run record and hands off to the workflow-engine (PLACEHOLDER
        no-op in this pass; the run stays `queued` until the workflow-engine is
        wired).
      operationId: createEvaluationRun
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: templateId
          required: true
          schema: { type: string, pattern: '^evt-[a-z0-9]{8}$' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunOptions'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTriggerResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/evaluation/agents/runs:
    get:
      summary: List evaluation runs
      tags: [Evaluations]
      operationId: listEvaluationRuns
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: templateId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [queued, running, aggregating, success, failed, cancelled] }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1 }
        - in: query
          name: skip
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationRun'

  /api/v1/projects/{projectId}/evaluation/agents/runs/{runId}:
    get:
      summary: Get an evaluation run by ID
      tags: [Evaluations]
      operationId: getEvaluationRun
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update run state (workflow-only writer)
      tags: [Evaluations]
      description: |
        Used by the workflow-engine / worker-eval to write back status, results,
        artifacts, and timestamps. Optionally appends audit events via
        `auditAppend`.
      operationId: patchEvaluationRun
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEvaluationRunRequest'
      responses:
        '200':
          description: Updated run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/evaluation/agents/runs/{runId}/cancel:
    post:
      summary: Cancel an evaluation run
      tags: [Evaluations]
      operationId: cancelEvaluationRun
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/evaluation/agents/runs/{runId}/baseline:
    post:
      summary: Set a completed run as the current baseline
      tags: [Evaluations]
      operationId: setEvaluationRunBaseline
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run set as baseline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Run is not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{projectId}/evaluation/agents/runs/{runId}/audit-events:
    get:
      summary: List audit events for a run
      tags: [Evaluations]
      operationId: listEvaluationRunAuditEvents
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationAuditEvent'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Append an audit event to a run
      tags: [Evaluations]
      operationId: appendEvaluationRunAuditEvent
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditEventRequest'
      responses:
        '201':
          description: Audit event appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationAuditEvent'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Internal (service-to-service) ---
  /api/v1/internal/workspaces/{id}/status:
    put:
      summary: Update workspace status (internal)
      tags: [Internal]
      description: Used by the workspace orchestrator to report workspace status changes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [new, creating, running, stopping, stopped, error]
                endpoint:
                  type: string
                podName:
                  type: string
                deploymentId:
                  type: string
                errorMessage:
                  type: string
      responses:
        '200':
          description: Status updated
        '404':
          description: Workspace not found

  # --- Workspace query (for workspace orchestrator polling) ---
  /api/v1/workspaces:
    get:
      summary: Query workspaces for management
      tags: [Internal]
      description: Used by the workspace orchestrator to poll for workspaces to manage (filter by status, deploymentId, deploymentType)
      parameters:
        - in: query
          name: status
          schema: { type: string }
          description: Comma-separated statuses (e.g. new,creating,stopping)
        - in: query
          name: deploymentId
          schema: { type: string }
        - in: query
          name: deploymentType
          schema: { type: string }
          description: Must be "nemo"
      responses:
        '200':
          description: List of workspaces matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'

  /api/v1/guardrails:
    get:
      summary: List guardrail definitions
      description: |
        Global (not project-scoped). Optional, AND-combined filters; no filters
        returns the complete set (including disabled rows).
      tags: [Guardrails]
      parameters:
        - in: query
          name: id
          schema: { type: string, format: uuid }
        - in: query
          name: key
          schema: { type: string }
        - in: query
          name: stage
          schema: { type: string, enum: [input, output, tool] }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: enabled
          schema: { type: boolean }
      responses:
        '200':
          description: List of guardrail definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardrailCatalog'
    post:
      summary: Create a guardrail definition
      tags: [Guardrails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailCatalogCreate'
      responses:
        '201':
          description: Created — returns the new guardrail id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: Validation error
        '409':
          description: A guardrail with the same (stage, key) already exists

  /api/v1/guardrails/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a guardrail definition by id
      tags: [Guardrails]
      responses:
        '200':
          description: The guardrail definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCatalog'
        '404':
          description: Not found
    put:
      summary: Update a guardrail definition (partial)
      tags: [Guardrails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailCatalogUpdate'
      responses:
        '200':
          description: The updated guardrail definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCatalog'
        '404':
          description: Not found
    delete:
      summary: Delete a guardrail definition
      tags: [Guardrails]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '404':
          description: Not found

components:
  schemas:
    # ----------------------------------------------------------------------
    # DataSource family
    #
    # A DataSource is the unified entity backing both data-plane volumes
    # (PVCs / NFS / SMB) and connector-style integrations (object stores,
    # databases, cloud accounts, ONTAP, APIs). The `type` field discriminates
    # between the two; exactly one of `volume_config` / `connector_config`
    # is populated depending on `type`.
    # ----------------------------------------------------------------------
    DataSource:
      type: object
      required: [id, project_id, name, type, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          description: |
            Server-generated short ID.
            - Volumes:    `vol-<8 base36>` (12 chars)
            - Connectors: `cn-<8 base36>`  (11 chars)
          example: vol-a7k2m9x1
        project_id:
          type: string
        name:
          type: string
          description: Unique within (project_id, name). For `type=volume`, validated as a bucket name.
        type:
          type: string
          enum: [volume, connector]
        description:
          type: string
          nullable: true
        volume_config:
          description: Present when `type=volume`
          allOf:
            - $ref: '#/components/schemas/VolumeConfig'
        connector_config:
          description: Present when `type=connector`
          allOf:
            - $ref: '#/components/schemas/ConnectorConfig'
        credential_id:
          type: string
          description: |
            Required for `type=connector`; references a Credential in the same project.
            Optional for `type=volume` (volumes typically use `auth_info` embedded in `volume_config`).
        metadata:
          type: object
          additionalProperties: true
          description: |
            Free-form metadata. Common keys include `source`
            (e.g. `ontap-connector-explorer`), `connector_id`,
            `ontap_cluster_url`, `svm_uuid`, `svm_name`, `volume_uuid`,
            `volume_name`, `last_ontap_bulk_repair_at`.
        labels:
          $ref: '#/components/schemas/Labels'
        mount_health:
          description: Latest ONTAP NFS preflight / mount readiness snapshot (volumes only)
          allOf:
            - $ref: '#/components/schemas/DataSourceMountHealth'
        scan_config:
          description: Volume scan configuration (volumes only)
          allOf:
            - $ref: '#/components/schemas/ScanConfig'
        scan_status:
          description: |
            Lifecycle state of the most recent volume scan. Always present on
            volume data sources after create; absent on connector data sources.
          allOf:
            - $ref: '#/components/schemas/ScanStatus'
        scan_result:
          description: Result of the most recent successful volume scan (volumes only)
          allOf:
            - $ref: '#/components/schemas/ScanResult'
        scanned_data_count:
          type: integer
          nullable: true
          description: |
            Convenience copy of the most recent successful scan's `total_files`
            (volumes only); `null` when no scan result is available.
        modified_by:
          type: string
          description: |
            Subject (`sub`) of the user who last created or updated this data
            source. Empty string when the actor is unknown (e.g. unauthenticated
            or system-initiated writes).
        associated_datasets:
          type: array
          description: |
            Datasets that read from this data source (origin-linked via
            `DataSet.originConnector` / `originVolume`). Capped at 20 entries;
            see `associated_datasets_count` for the full total. Embedded on the
            list and detail responses only.
          items:
            type: object
            required: [dset_id, name]
            properties:
              dset_id:
                type: string
              name:
                type: string
        associated_datasets_count:
          type: integer
          description: Total number of datasets associated with this data source.
        last_connection_test_at:
          type: string
          format: date-time
          description: Timestamp of the last connection-test result recorded (connectors only)
        last_connection_test_status:
          type: string
          enum: [success, failed]
          description: Status of the last connection test (connectors only)
        last_connection_test_message:
          type: string
          description: Optional message captured with the last connection test (connectors only)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VolumeConfig:
      type: object
      required: [region, volume_info, auth_info, protocol]
      description: Configuration for a `type=volume` data source.
      properties:
        region:
          type: string
          description: Region used for deployment auto-assignment scoring
        volume_info:
          $ref: '#/components/schemas/VolumeInfo'
        auth_info:
          $ref: '#/components/schemas/VolumeAuthInfo'
        protocol:
          type: string
          enum: [NFS, SMB]
        deployment_config:
          type: object
          additionalProperties: true
          description: Optional pass-through deployment configuration

    VolumeInfo:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Volume backend type, e.g. `nfs`, `smb`
        endpoint:
          type: string
          description: Required for static provisioning; the NFS/SMB mount endpoint
        mount_options:
          type: array
          items: { type: string }
        provisioning_mode:
          type: string
          enum: [static, dynamic]
          description: When `dynamic`, `storage_class_name` is required
        storage_class_name:
          type: string
        storage_size:
          type: string
          description: Kubernetes-style quantity, e.g. `100Gi`
        parameters:
          type: object
          additionalProperties: { type: string }
        access_modes:
          type: array
          items:
            type: string
            description: Kubernetes PVC access modes, e.g. ReadWriteMany

    VolumeAuthInfo:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          description: Auth scheme identifier (e.g. `none`, `kerberos`, `password`)
        username:
          type: string
        password_encrypted:
          type: string
          description: Encrypted password ciphertext (never returned in plaintext)

    ConnectorConfig:
      type: object
      required: [connector_type, scope, provider]
      description: |
        Configuration for a `type=connector` data source. The set of valid
        provider-specific fields is governed by `provider-catalog.json` and is
        enforced on create. Catalog-managed providers today include
        `s3`, `postgresql`, `mysql`, `gcp`, `ontap`, `redash`.
      properties:
        connector_type:
          type: string
          enum: [objectstore, database, cloud, storage, api]
          description: |
            Coarse-grained category of connector.
            Note: the legacy `metrics` connector type has been merged into the
            primary connectors (ONTAP, GCP); metric acquisition is driven by
            `metric_category` resourceSelector entries instead.
        scope:
          type: string
          enum: [account, resource]
          description: |
            `account`-scoped connectors target a cloud/tenant (e.g. GCP project, ONTAP cluster).
            `resource`-scoped connectors target a single resource (e.g. one S3 bucket, one DB).
        provider:
          type: string
          description: Provider id from provider-catalog.json (e.g. `s3`, `postgresql`, `gcp`, `ontap`, `redash`, `mysql`)
        database_type:
          type: string
          enum: [postgresql, mysql]
          description: Optional convenience field for database-style providers
        # Object store / generic resource fields
        bucket:
          type: string
          description: S3 (or compatible) bucket name (provider=s3)
        prefix:
          type: string
          description: S3 key prefix filter (provider=s3)
        endpoint:
          type: string
          description: Custom endpoint URL (e.g. MinIO for s3)
        region:
          type: string
        # Database fields (provider=postgresql | mysql)
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        schema:
          type: string
        ssl_mode:
          type: string
          description: Database SSL mode (e.g. disable, require, verify-ca, verify-full)
        # Cloud account fields (provider=gcp)
        project_id:
          type: string
          description: Cloud project id (e.g. GCP project)
        default_region:
          type: string
        # Storage system fields (provider=ontap, connector_type=storage)
        cluster_url:
          type: string
          description: ONTAP cluster management URL
        verify_tls:
          type: boolean
          description: Verify TLS for upstream cluster/API (default true)
        default_svm:
          type: string
          description: Default ONTAP SVM
        # API connector fields (provider=redash, connector_type=api)
        base_url:
          type: string
          description: API base URL (e.g. Redash instance URL)
        include_query_results:
          type: boolean
        include_dashboards:
          type: boolean
        include_data_sources:
          type: boolean
        max_result_rows:
          type: integer

    DataSourceMountHealth:
      type: object
      required: [status]
      additionalProperties: true
      description: Latest ONTAP NFS preflight / mount readiness snapshot for a volume data source
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, unknown]
        last_checked_at:
          type: string
          format: date-time
        blocking:
          type: array
          items: { type: string }
          description: Blocking issues preventing mount
        warnings:
          type: array
          items: { type: string }
        probed_lif:
          type: string
          description: ONTAP LIF (logical interface) used during the probe
        repair_pending_pod_restart:
          type: boolean

    CreateDataSourceRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [volume, connector]
        description:
          type: string
        volume_config:
          description: Required when `type=volume`
          allOf:
            - $ref: '#/components/schemas/VolumeConfig'
        connector_config:
          description: Required when `type=connector`; validated against provider-catalog.json
          allOf:
            - $ref: '#/components/schemas/ConnectorConfig'
        credential_id:
          type: string
          description: Required when `type=connector`
        metadata:
          type: object
          additionalProperties: true
        labels:
          nullable: true
          description: |
            Optional free-form labels. Pass an empty array on update to clear all
            labels. `null` is accepted and treated as "not provided".
          allOf:
            - $ref: '#/components/schemas/Labels'
        scan_config:
          description: |
            Volume-only. Captured at create time and used to start the initial
            volume scan workflow. Reject for `type=connector`.
          allOf:
            - $ref: '#/components/schemas/ScanConfig'

    UpdateDataSourceRequest:
      type: object
      description: |
        Partial update. Fields are merged into the existing record. For volume
        data sources, `volume_config.volume_info` and `volume_config.auth_info`
        are shallow-merged with the existing object; for connector data sources
        `connector_config` is shallow-merged. `connector_config` is NOT re-validated
        against provider-catalog.json on update.
      properties:
        name:
          type: string
        description:
          type: string
        volume_config:
          $ref: '#/components/schemas/VolumeConfig'
        connector_config:
          $ref: '#/components/schemas/ConnectorConfig'
        credential_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        labels:
          nullable: true
          description: |
            Optional free-form labels. Pass an empty array on update to clear all
            labels. `null` is accepted and treated as "not provided".
          allOf:
            - $ref: '#/components/schemas/Labels'
        mount_health:
          $ref: '#/components/schemas/DataSourceMountHealth'
        scan_config:
          description: |
            Volume-only. When changed, the service kicks off a new
            VolumeScanWorkflow and resets `scan_status`.
          allOf:
            - $ref: '#/components/schemas/ScanConfig'

    ConnectionTestResultRequest:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    DataSourceHistoryEntry:
      type: object
      required: [entityId, version, data]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          description: ID of the DataSource this history entry belongs to
        version:
          type: integer
        data:
          $ref: '#/components/schemas/DataSource'
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
        op:
          type: string
          description: Operation kind (e.g. create, update, delete)

    BulkPreflightRequest:
      type: object
      description: |
        Optional filter for which volumes to include in the bulk preflight plan.
        Only volume data sources whose `metadata.source` matches `filter.source`
        are considered. When `filter.source` is omitted, the service defaults to
        `ontap-connector-explorer`.
      properties:
        filter:
          type: object
          properties:
            source:
              type: string
              description: Match volumes whose `metadata.source` equals this value (default `ontap-connector-explorer`)

    BulkPreflightResult:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        current_endpoint:
          type: string
        proposed_endpoint:
          type: string
        mount_preflight:
          type: object
          additionalProperties: true
          description: Raw mount preflight metadata from workflow-engine
        mount_options:
          type: array
          items: { type: string }
        would_change:
          type: boolean
          description: True when there is a proposed endpoint that differs from the current one
        blocking:
          type: array
          items: { type: string }
          description: Blocking issues that would prevent applying the change
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: Present when this candidate could not be evaluated (e.g. `no_ontap_connector`)

    BulkApplyRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
            description: Volume data source IDs to apply
        dry_run:
          type: boolean
          default: false
          description: When true, returns the proposed endpoints without persisting changes

    BulkApplyOutcome:
      type: object
      required: [id, ok]
      properties:
        id:
          type: string
        ok:
          type: boolean
        dry_run:
          type: boolean
        proposed_endpoint:
          type: string
        skipped:
          type: boolean
          description: True when blocking preflight issues prevented apply
        blocking:
          type: array
          items: { type: string }
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    PreflightResponse:
      type: object
      required: [mount_health]
      properties:
        mount_health:
          $ref: '#/components/schemas/DataSourceMountHealth'
        explorer:
          type: object
          properties:
            metadata:
              type: object
              additionalProperties: true
        explorer_error:
          type: object
          additionalProperties: true
        data_source:
          $ref: '#/components/schemas/DataSource'

    # ----------------------------------------------------------------------
    # Labels — reusable free-form tag list applied to DataSource, DataSet,
    # and KnowledgeBase resources.
    # ----------------------------------------------------------------------
    Labels:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
      description: |
        Optional free-form labels (tags) applied to the resource. Used for
        organization, search, and bulk operations. Up to 32 entries; each
        entry is a non-empty string of at most 64 characters. Passing an
        empty array on update clears all labels.

    # ----------------------------------------------------------------------
    # Scan family — volume scan configuration, lifecycle, and result.
    # ----------------------------------------------------------------------
    ScanConfig:
      type: object
      required: [scan_depth]
      description: |
        Folder-depth configuration for volume scanning. Captured at data
        source create/update time and used by VolumeScanWorkflow to bound the
        recursive walk.
      properties:
        scan_depth:
          type: string
          enum: [none, all_levels, top_5_levels, top_2_levels, custom]
          description: |
            Folder depth for scanning:
              - `none`         : Disables scanning (scan_status='skipped').
              - `all_levels`   : All folder levels (recommended for fast preview).
              - `top_5_levels` : Top 5 folder levels (balanced detail and speed).
              - `top_2_levels` : Top 2 folder levels (shallow, fast).
              - `custom`       : Custom folder level amount (requires `custom_depth`).
        custom_depth:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: |
            Required when `scan_depth` is `custom`. Must be an integer in [1, 100].
            Must be omitted (or null) when `scan_depth` is not `custom`.

    ScanStatus:
      type: object
      required: [state]
      description: |
        Lifecycle state of the most recent volume scan. Mutated by the
        config-service trigger helper, by the workflow-engine callback on
        completion, or set to `skipped` when scan_depth is `none`.
      properties:
        state:
          type: string
          enum: [pending, scanning, completed, failed, skipped]
        started_at:
          type: string
          format: date-time
          description: When the scan workflow was accepted by Temporal
        completed_at:
          type: string
          format: date-time
          description: When the scan terminated (completed or failed)
        workflow_id:
          type: string
          description: Temporal workflow id of the running/last scan
        last_error:
          type: string
          description: Error message captured on failed transitions

    FileTypeStat:
      type: object
      required: [file_type, count]
      properties:
        file_type:
          type: string
          description: |
            Lowercase file extension including the leading dot (e.g. `.pdf`).
            Files without an extension are aggregated under the literal
            `<noext>`.
        count:
          type: integer
          minimum: 0

    ScanResult:
      type: object
      required: [completed_at, total_files, total_folders, total_size_bytes, file_type_stats]
      description: |
        Aggregate stats returned by the ScanVolume connector-worker activity
        and persisted on the data source. `file_type_stats` is capped at the
        top 50 most frequent types.
      properties:
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
          description: Populated when the walk encountered an unrecoverable error
        total_files:
          type: integer
          minimum: 0
        total_folders:
          type: integer
          minimum: 0
        total_size_bytes:
          type: integer
          format: int64
          minimum: 0
        file_type_stats:
          type: array
          items:
            $ref: '#/components/schemas/FileTypeStat'

    ScanCallbackRequest:
      type: object
      required: [scan_status]
      description: |
        Payload for the internal workflow-engine -> config-service callback
        (PATCH /api/v1/internal/datasources/{projectId}/{id}/scan-result).
      properties:
        scan_status:
          $ref: '#/components/schemas/ScanStatus'
        scan_result:
          $ref: '#/components/schemas/ScanResult'

    DataSetSummary:
      type: object
      description: |
        Minimal DataSet shape returned by the associated-datasets endpoint.
        Use the full GET /datasets/{id} endpoint to retrieve full details.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [acquired, manual]
        kind:
          type: string
          enum: [unstructured, structured]
        originConnector:
          type: string
          nullable: true
        originVolume:
          type: string
          nullable: true
        bucketName:
          type: string
          nullable: true
        status:
          type: string
        file_scope:
          type: integer
          description: |
            Source-file count captured at import completion (from the dataset's
            `stats.sourceFileCount`, falling back to the latest snapshot's file
            count, then 0).
        synchronization_schedule:
          type: string
          nullable: true
          description: Derived cron expression from the dataset's scheduleConfig, or `null`.
        labels:
          $ref: '#/components/schemas/Labels'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Model:
      type: object
      description: |
        A model registration in a project. Remote-provider models are also
        registered with the Bifrost LLM gateway when it is enabled; that
        registration metadata is mirrored in `rateCardOverride._gateway` and
        the routable id is captured in `gatewayModelId`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-assigned UUID. Stable across renames.
        projectId:
          type: string
          readOnly: true
          description: Project that owns the model. Sourced from the URL on create.
        name:
          type: string
          description: Unique (per project) human/programmatic identifier.
        displayName:
          type: string
        provider:
          type: string
          enum: [openai, openai_compatible, aws_bedrock, azure, google, local]
          description: Upstream provider key. Drives how credentials and endpoints are interpreted.
        providerModelId:
          type: string
          description: |
            Model id as known by the provider, e.g. `gpt-4o-mini`,
            `anthropic.claude-3-5-sonnet-20241022-v2:0`. Used for routing
            and for looking up static catalog metadata.
        providerDeploymentName:
          type: string
          description: |
            Upstream deployment/inference name when distinct from
            `providerModelId`. For gateway providers that expose a
            deployment routing map (e.g. Bifrost `azure_key_config.deployments`),
            this value is the upstream id Bifrost forwards to. When omitted,
            the gateway falls back to identity routing (`providerModelId`).
        gatewayModelId:
          type: string
          readOnly: true
          description: |
            Ready-to-send model id for Bifrost, computed at registration
            time as `<bifrost-provider>/<providerModelId>` (e.g.
            `azure/gpt-4o-mini-model`). Consumed verbatim by callers so
            the provider prefix lives in config, not in each runtime hop.
        credentialId:
          type: string
          format: uuid
          description: |
            Reference to a project `Credential` for remote providers.
            Required when the LLM gateway is enabled and `provider` is
            one of `openai`, `openai_compatible`, `aws_bedrock`, `azure`,
            `google`.
        modelType:
          type: string
          enum: [llm, embedding]
        modelClass:
          type: string
          description: Functional classification (e.g. `reasoning`, `balanced`, `fast`, `code`).
        rateCardOverride:
          type: object
          description: |
            Free-form pricing/rate overrides. The server adds a
            `_gateway` sub-object reflecting Bifrost registration
            (`gatewayProvider`, `keyName`, `keyId`, `bifrostTeamId`,
            `bifrostVirtualKeyId`) after a successful create.
        model_info:
          type: object
          properties:
            architecture:
              type: string
            base_model:
              type: string
            variant:
              type: string
            parameters:
              type: string
            quantization:
              type: string
            size:
              type: number
        endpoint:
          type: string
          description: Provider endpoint URL (e.g. Ollama server URL). Required for the `ollama` provider when the LLM gateway is enabled.
        auth:
          type: object
          description: Legacy inline auth payload. Prefer `credentialId`.
          properties:
            access_token:
              type: string
            secret_key:
              type: string
        limits:
          type: object
          properties:
            tpm:
              type: number
            timeout:
              type: number
            stream_timeout:
              type: number
            max_retries:
              type: number
        contextWindow:
          type: integer
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`. Populated on `GET /models/{id}`.
        maxOutputTokens:
          type: integer
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`. Populated on `GET /models/{id}`.
        supportsExtendedOutput:
          type: boolean
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`. Populated on `GET /models/{id}`.
        dependentsSummary:
          allOf:
            - $ref: '#/components/schemas/DependentsSummary'
          readOnly: true
          description: |
            Per-row dependents summary returned on `GET /models` unless the
            caller opts out via `include=dependentsSummary=false`. Counts
            entities (agents, agent teams, knowledge bases, ...) that
            reference this model.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    CreateModelRequest:
      type: object
      description: |
        Payload accepted by `POST /api/v1/projects/{projectId}/models`. Any
        field marked `readOnly` on the `Model` schema is ignored on input.
      required: [name]
      properties:
        name:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum: [openai, openai_compatible, aws_bedrock, azure, google, local]
        providerModelId:
          type: string
        providerDeploymentName:
          type: string
        credentialId:
          type: string
          format: uuid
        modelType:
          type: string
          enum: [llm, embedding]
        modelClass:
          type: string
        endpoint:
          type: string
        model_info:
          $ref: '#/components/schemas/ModelInfo'
        auth:
          $ref: '#/components/schemas/ModelAuth'
        limits:
          $ref: '#/components/schemas/ModelLimits'
        rateCardOverride:
          type: object

    UpdateModelRequest:
      type: object
      description: |
        Payload accepted by `PUT /api/v1/projects/{projectId}/models/{id}`.
        All fields are optional and only the provided ones are written;
        credential/provider/endpoint changes are *not* re-propagated to the
        gateway — delete and recreate the model for those.
      properties:
        name:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum: [openai, openai_compatible, aws_bedrock, azure, google, local]
        providerModelId:
          type: string
        providerDeploymentName:
          type: string
        gatewayModelId:
          type: string
        credentialId:
          type: string
          format: uuid
        modelType:
          type: string
          enum: [llm, embedding]
        modelClass:
          type: string
        endpoint:
          type: string
        model_info:
          $ref: '#/components/schemas/ModelInfo'
        auth:
          $ref: '#/components/schemas/ModelAuth'
        limits:
          $ref: '#/components/schemas/ModelLimits'
        rateCardOverride:
          type: object

    ModelInfo:
      type: object
      properties:
        architecture:
          type: string
        base_model:
          type: string
        variant:
          type: string
        parameters:
          type: string
        quantization:
          type: string
        size:
          type: number

    ModelAuth:
      type: object
      properties:
        access_token:
          type: string
        secret_key:
          type: string

    ModelLimits:
      type: object
      properties:
        tpm:
          type: number
        timeout:
          type: number
        stream_timeout:
          type: number
        max_retries:
          type: number

    ModelHistory:
      type: object
      description: A single immutable snapshot of a `Model` taken on every successful create/update.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entityId:
          type: string
          format: uuid
          description: UUID of the model this snapshot belongs to.
        version:
          type: integer
          description: Monotonically increasing version number per model.
        data:
          $ref: '#/components/schemas/Model'
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          nullable: true
        op:
          type: string
          nullable: true
          description: Operation that produced the snapshot (e.g. `create`, `update`, `restore`).
      required:
        - entityId
        - version
        - data

    ListAvailableModelsRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [openai, openai_compatible, aws_bedrock, azure, google, local]
        credentialId:
          type: string
          format: uuid
          description: Required for remote providers; the secret is resolved server-side.
        type:
          type: string
          enum: [llm, embedding]
          description: Optional filter applied by the adapter.

    ListAvailableModelsResponse:
      type: object
      properties:
        provider:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/ProviderModelEntry'

    ProviderModelEntry:
      type: object
      description: Normalized model item returned by a provider adapter.
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [llm, embedding]
        description:
          type: string
        contextWindow:
          type: integer
        maxOutputTokens:
          type: integer
        supportsExtendedOutput:
          type: boolean
        rateCard:
          type: object
          properties:
            inputPricePerToken:
              type: number
            outputPricePerToken:
              type: number
            currency:
              type: string
        metadata:
          type: object
          additionalProperties: true

    InferRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InferMessage'
        temperature:
          type: number
        maxTokens:
          type: integer
          minimum: 1
          description: Forwarded to the gateway as `max_tokens`.

    InferMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 20000

    InferResponse:
      type: object
      properties:
        response:
          type: string
          description: Concatenated assistant content returned by the gateway.
        latencyMs:
          type: integer
          description: End-to-end gateway round-trip latency measured in the route.
        modelName:
          type: string
          description: Resolved model label as reported by the gateway (falls back to `displayName`/`name`).
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            totalTokens:
              type: integer

    DependentItem:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          description: Source entity kind (e.g. `agent`, `agent_team`, `knowledge_base`, `mcp_server`).
        id:
          type: string
          description: Source entity id.
        name:
          type: string
          nullable: true
          description: Resolved display name; `null` when the source row could not be looked up.
        relation:
          type: string
          description: Edge label describing how the source references the target.

    DependentsPage:
      type: object
      required: [items, totalByKind]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DependentItem'
        nextCursor:
          type: string
          nullable: true
          description: Opaque base64url cursor for the next page, or `null` when exhausted.
        totalByKind:
          type: object
          additionalProperties:
            type: integer
          description: Total dependents grouped by source kind. Independent of the current page.

    DependentsSummary:
      type: object
      required: [total, byKind]
      properties:
        total:
          type: integer
          description: Total number of edges pointing at this target.
        byKind:
          type: object
          additionalProperties:
            type: integer
          description: Per-kind counts of source entities.

    HasDependentsError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [HAS_DEPENDENTS]
        dependents:
          $ref: '#/components/schemas/DependentsPage'
    DataSet:
      type: object
      description: |
        Full DataSet entity as returned by GET endpoints.
        Persisted fields come from PostgreSQL; `facets`, `catalogTable`,
        `progress`, `stats`, and `dependentsSummary` are enriched at read time
        by the service and are read-only on writes.
      required: [name, description, type, kind]
      properties:
        id:
          type: string
          description: Short dataset ID (`dset<8 lowercase alphanumeric>`)
          pattern: '^dset[a-z0-9]{8}$'
          readOnly: true
        projectId:
          type: string
          description: Owning project ID
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Dataset name. Must be a valid Iceberg/Lakekeeper table identifier:
            - lowercase letters, digits, underscores, hyphens only
            - must start with a letter (a-z) or underscore
            - not a SQL reserved word
          pattern: '^[a-z_][a-z0-9_-]*$'
        description:
          type: string
        type:
          type: string
          enum: [acquired, manual]
          description: |
            `acquired` — data is pulled from a connector or mounted volume.
            `manual` — files are uploaded directly via manifests.
        originConnector:
          type: string
          nullable: true
          description: |
            DataSource ID of the connector (when `type=acquired`).
            Mutually exclusive with `originVolume`.
        originVolume:
          type: string
          nullable: true
          description: |
            DataSource ID of a mounted volume (POSIX/NFS, when `type=acquired`).
            Mutually exclusive with `originConnector`.
        sourceDatabase:
          type: string
          nullable: true
          description: For acquired DB datasets — overrides the connector default database.
        sourceSchema:
          type: string
          nullable: true
          description: For acquired DB datasets — overrides the connector default schema.
        kind:
          type: string
          enum: [unstructured, structured]
        filterSpec:
          type: object
          nullable: true
          additionalProperties: true
          description: Free-form filter spec consumed by acquisition adapters.
        fileProcessors:
          type: array
          nullable: true
          items:
            type: string
          description: Names of file processors to run on each file.
        sqlQuery:
          type: string
          nullable: true
          description: SQL query (required when `kind=structured` and acquiring from a DB).
        resourceSelector:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: |
            Connector-specific resource picker entries. When entries contain a
            `category` field, the dataset is treated as a metric_category dataset:
            it must be `kind=structured` and the dataset cannot mix metric and
            non-metric selector shapes.
        acquisitionConfig:
          $ref: '#/components/schemas/AcquisitionConfig'
        scheduleConfig:
          $ref: '#/components/schemas/ScheduleConfig'
        refresh_config:
          $ref: '#/components/schemas/DatasetRefreshConfig'
        labels:
          $ref: '#/components/schemas/Labels'
        enablePiiAnalysis:
          type: boolean
          default: false
          description: Run PII analysis during the import workflow.
        piiAnalysisImageOnly:
          type: boolean
          default: false
          description: Restrict PII analysis to image-only mode.
        bucketName:
          type: string
          nullable: true
          readOnly: true
          description: Resolved from the project `home_dir` at creation; ignored on create/update requests.
        warehouseName:
          type: string
          nullable: true
          readOnly: true
          description: Lakekeeper warehouse name (defaults to `nemo`).
        namespace:
          type: string
          nullable: true
          readOnly: true
          description: Dot-joined catalog namespace (defaults to `projectId`).
        catalogTableName:
          type: string
          nullable: true
          readOnly: true
          description: Iceberg table name in the catalog (mirrors `name`).
        catalogTableRef:
          type: string
          nullable: true
          readOnly: true
          description: Fully-qualified `namespace.table` reference set by the import workflow.
        status:
          type: string
          enum: [in_progress, ready, errored, deprecated]
          readOnly: true
          description: |
            Processing status:
            - `in_progress` — being created or imported
            - `ready` — import finished successfully
            - `errored` — import failed
            - `deprecated` — soft-retired dataset
        jobId:
          type: string
          nullable: true
          readOnly: true
          description: Temporal workflow execution ID for the most recent operation.
        errorMessage:
          type: string
          nullable: true
          readOnly: true
        modifiedBy:
          type: string
          nullable: true
          readOnly: true
          description: |
            Subject (`sub`) of the user who last created or updated this dataset.
            Null/absent when the actor is unknown. Serialized as the entity
            property name `modifiedBy` (dataset responses are not snake-cased).
        progress:
          $ref: '#/components/schemas/DataSetProgress'
        stats:
          $ref: '#/components/schemas/DataSetStats'
        latestSnapshot:
          $ref: '#/components/schemas/DataSetLatestSnapshotSummary'
        dataSourceName:
          type: string
          readOnly: true
          description: |
            Resolved name of the origin data source (`originConnector` /
            `originVolume`). Empty string when unresolved or unset. Attached on
            list and detail responses.
        data_source_type:
          type: string
          nullable: true
          enum: [connector, volume]
          readOnly: true
          description: |
            Which origin field is set — `connector` when `originConnector` is
            present, `volume` when `originVolume` is present, else `null`.
            Attached on list and detail responses.
        synchronization_status:
          type: string
          enum: [Completed, Synchronizing, Failed, Pending, Never]
          readOnly: true
          description: |
            Synchronization state derived from `status`
            (`in_progress`→`Synchronizing`, `ready`→`Completed`,
            `errored`→`Failed`, otherwise `Never`). Attached on list and detail responses.
        synchronization_summary:
          allOf:
            - $ref: '#/components/schemas/DatasetSynchronizationSummary'
          readOnly: true
          description: Synchronization summary attached on list and detail responses.
        latest_snapshot:
          allOf:
            - $ref: '#/components/schemas/DatasetLatestSnapshot'
          nullable: true
          readOnly: true
          description: |
            UI-shaped projection of the persisted `latestSnapshot` summary, or
            `null` when no snapshot has been captured. Attached on list and detail responses.
        facets:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Facet'
          description: Side-channel facets (e.g. `pii`) populated by independent jobs.
        catalogTable:
          $ref: '#/components/schemas/CatalogTable'
        dependentsSummary:
          $ref: '#/components/schemas/DependentsSummary'
        manifest:
          $ref: '#/components/schemas/DataSetManifest'
          description: Latest manifest (draft or committed) containing files for this dataset
        uploadedFiles:
          type: array
          items:
            type: string
          description: |
            Deprecated — files are now managed through manifests. When provided
            on a PUT request the service creates or replaces the draft manifest
            with these URIs.
          deprecated: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateDataSetRequest:
      type: object
      required: [name, type, kind]
      description: |
        Body for `POST /api/v1/projects/{projectId}/datasets`.
        - `acquired` datasets must specify exactly one of `originConnector` or `originVolume`.
        - `structured` datasets require `sqlQuery`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z_][a-z0-9_-]*$'
        description:
          type: string
        type:
          type: string
          enum: [acquired, manual]
        kind:
          type: string
          enum: [unstructured, structured]
        originConnector:
          type: string
        originVolume:
          type: string
        sourceDatabase:
          type: string
        sourceSchema:
          type: string
        filterSpec:
          type: object
          additionalProperties: true
        fileProcessors:
          type: array
          items:
            type: string
        sqlQuery:
          type: string
        resourceSelector:
          type: array
          items:
            type: object
            additionalProperties: true
        acquisitionConfig:
          $ref: '#/components/schemas/AcquisitionConfig'
        scheduleConfig:
          $ref: '#/components/schemas/ScheduleConfig'
        refresh_config:
          $ref: '#/components/schemas/DatasetRefreshConfig'
        labels:
          $ref: '#/components/schemas/Labels'
        enablePiiAnalysis:
          type: boolean
          default: false
        piiAnalysisImageOnly:
          type: boolean
          default: false

    UpdateDataSetRequest:
      type: object
      description: |
        Body for `PUT /api/v1/projects/{projectId}/datasets/{id}`.
        All fields are optional; when `uploadedFiles` is provided the service
        creates or replaces the draft manifest with those URIs.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z_][a-z0-9_-]*$'
        description:
          type: string
        type:
          type: string
          enum: [acquired, manual]
        kind:
          type: string
          enum: [unstructured, structured]
        originConnector:
          type: string
        originVolume:
          type: string
        sourceDatabase:
          type: string
        sourceSchema:
          type: string
        filterSpec:
          type: object
          additionalProperties: true
        fileProcessors:
          type: array
          items:
            type: string
        sqlQuery:
          type: string
        resourceSelector:
          type: array
          items:
            type: object
            additionalProperties: true
        acquisitionConfig:
          $ref: '#/components/schemas/AcquisitionConfig'
        scheduleConfig:
          $ref: '#/components/schemas/ScheduleConfig'
        refresh_config:
          $ref: '#/components/schemas/DatasetRefreshConfig'
        labels:
          $ref: '#/components/schemas/Labels'
        enablePiiAnalysis:
          type: boolean
        piiAnalysisImageOnly:
          type: boolean
        uploadedFiles:
          type: array
          items:
            $ref: '#/components/schemas/UploadedFileInfo'
          description: |
            Optional list of S3 URIs (with metadata) representing files already
            uploaded out-of-band. Triggers draft-manifest reconciliation and
            auto-commits the draft when this is the first batch for the dataset.

    PatchDataSetRequest:
      type: object
      description: |
        Body for `PATCH /api/v1/projects/{projectId}/datasets/{id}`.
        Used by the workflow-engine to merge watermark / schedule fields
        without overwriting the rest of the entity.
      properties:
        acquisitionConfig:
          $ref: '#/components/schemas/AcquisitionConfig'
        scheduleConfig:
          $ref: '#/components/schemas/ScheduleConfig'
        refresh_config:
          $ref: '#/components/schemas/DatasetRefreshConfig'

    UploadedFileInfo:
      type: object
      required: [key, url]
      properties:
        key:
          type: string
          description: S3 object key
        url:
          type: string
          description: Fully-qualified S3 URI (e.g. `s3://bucket/path/to/file`)
        size:
          type: integer
          format: int64
        originalName:
          type: string

    AcquisitionConfig:
      type: object
      description: Connector-driven acquisition configuration.
      properties:
        fileIncludePattern:
          type: string
          description: |
            Preferred include filter — comma-separated glob list applied to file
            names (e.g. `*.csv,*.parquet`). When both `fileIncludePattern` and
            `fileGlob` are set, `fileIncludePattern` wins.
        fileGlob:
          type: string
          description: |
            Legacy include filter. Kept for backward compatibility; use
            `fileIncludePattern` instead.
          deprecated: true
        fileExcludePattern:
          type: string
          description: Comma-separated glob list of file names to exclude.
        maxFileSize:
          type: integer
          format: int64
          minimum: 1
          description: |
            Skip files whose object size (bytes) exceeds this cap during
            discovery. Applies to object-store, GCS, and POSIX/volume
            acquisitions. Omit (or 0) for no cap.
        modifiedAfter:
          type: string
          format: date-time
          description: |
            ISO-8601 cutoff — only include files modified at or after this
            timestamp. Applies to object-store / GCS LastModified and POSIX
            mtime.
        writeMode:
          type: string
          enum: [append, overwrite, incremental]
        watermarkColumn:
          type: string
        lastWatermarkValue:
          type: string
        maxRows:
          type: integer
        queryTimeoutSeconds:
          type: integer

    ScheduleConfig:
      type: object
      readOnly: true
      description: |
        Derived Temporal schedule configuration. Server-managed: when the
        client supplies a `refresh_config` (`DatasetRefreshConfig`), the
        config-service computes the cron expression, pushes the schedule to
        the workflow-engine, and writes the resulting cron / timezone /
        `temporalScheduleId` back here. Clients should set `refresh_config`
        instead of `scheduleConfig`.
      required: [cronExpression, timezone, enabled]
      properties:
        cronExpression:
          type: string
        timezone:
          type: string
        temporalScheduleId:
          type: string
        enabled:
          type: boolean

    DatasetRefreshConfig:
      type: object
      description: |
        User-facing refresh schedule, persisted as the `refresh_config` JSONB
        column on the dataset. Coexists with `scheduleConfig` (see above):
        the config-service derives a cron expression from this object and
        writes the result (plus the Temporal schedule id) back into
        `scheduleConfig`.

        Snake_case property names match the spec.
      required: [auto_refresh_enabled, schedule_type, paused]
      properties:
        auto_refresh_enabled:
          type: boolean
          default: false
        schedule_type:
          type: string
          enum: [hourly, daily, weekly, monthly, cron]
          default: hourly
          description: |
            - `hourly`  — run every N hours (uses `interval_minutes`, min 120)
            - `daily`   — run once per day at `time_of_day`
            - `weekly`  — run on `day_of_week[]` at `time_of_day`
            - `monthly` — run on `day_of_month` at `time_of_day`
            - `cron`    — explicit `cron_expression`
        interval_minutes:
          type: integer
          minimum: 120
          description: Required when `schedule_type=hourly`. Minimum 2 hours (120 minutes).
        time_of_day:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          nullable: true
          description: 'HH:mm (24-hour). Required for daily / weekly / monthly.'
        day_of_week:
          type: array
          nullable: true
          description: 'Days of the week (0=Sunday, 6=Saturday). Required when `schedule_type=weekly`.'
          items:
            type: integer
            minimum: 0
            maximum: 6
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: 'Day of the month (1-31). Required when `schedule_type=monthly`.'
        timezone:
          type: string
          nullable: true
          default: UTC
          description: 'IANA timezone identifier (e.g. `UTC`, `America/New_York`). Applies to `time_of_day`.'
        cron_expression:
          type: string
          nullable: true
          description: 'Standard cron expression. Required when `schedule_type=cron`.'
        paused:
          type: boolean
          default: false

    DataSetProgress:
      type: object
      description: |
        Live progress for an in-progress dataset import or facet job. Populated
        only when the underlying workflow is reachable.
      readOnly: true
      properties:
        phase:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
        message:
          type: string
        totalFiles:
          type: integer
        processedFiles:
          type: integer
        currentFile:
          type: string
        estimatedRemainingFormatted:
          type: string
        elapsedFormatted:
          type: string
        lastUpdated:
          type: string
          format: date-time
        totalUnits:
          type: integer
        units:
          type: string

    DataSetStats:
      type: object
      description: Aggregate statistics computed during/after import.
      readOnly: true
      properties:
        sourceFileCount:
          type: integer
        rowCount:
          type: integer
          format: int64
        columnCount:
          type: integer

    DataSetLatestSnapshotSummary:
      type: object
      readOnly: true
      description: |
        Persisted summary of the latest catalog snapshot, captured at import
        completion (status → `ready`) so list/detail reads avoid a per-request
        catalog call. Stored on the `latest_snapshot` JSONB column.
      properties:
        snapshotId:
          type: integer
          format: int64
        version:
          type: integer
          description: 1-based position of the snapshot in oldest→newest order.
        timestampMs:
          type: integer
          format: int64
        totalFiles:
          type: integer
        filesAdded:
          type: integer
        filesRemoved:
          type: integer

    DatasetLatestSnapshot:
      type: object
      readOnly: true
      description: |
        UI-shaped projection of `latestSnapshot`, attached to list/detail
        responses as `latest_snapshot`.
      properties:
        id:
          type: string
          description: String form of the snapshot id.
        version:
          type: integer
        date:
          type: string
          format: date-time
          description: ISO timestamp derived from the snapshot's `timestampMs`.
        total_files:
          type: integer
        files_added:
          type: integer
        files_removed:
          type: integer

    DatasetSynchronizationSummary:
      type: object
      readOnly: true
      description: |
        Synchronization summary attached to dataset list/detail responses.
        `next_scheduled_synchronization` is always `null` today (no backend
        next-run computation).
      properties:
        status:
          type: string
          enum: [Completed, Synchronizing, Failed, Pending, Never]
        schedule:
          type: string
          nullable: true
          description: Derived cron expression from `scheduleConfig`, or `null`.
        last_completed_synchronization:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp of the latest captured snapshot, or `null`.
        next_scheduled_synchronization:
          type: string
          format: date-time
          nullable: true
          description: Always `null` — next-run is not computed server-side.

    Facet:
      type: object
      description: |
        Side-channel state for an entity-scoped sub-pipeline (e.g. PII analysis).
        Facets transition independently of the parent entity status.
      required: [id, projectId, entityType, entityId, facetType, state]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        entityType:
          type: string
          enum: [dataset, knowledge_base, agent, project]
        entityId:
          type: string
        facetType:
          type: string
          description: 'e.g. `pii`, `embedding`, `usage`'
        state:
          type: string
          enum: [in_progress, ready, errored]
        jobId:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        summary:
          description: |
            Facet-type-specific final stats; populated when state is `ready`.
            For `facetType=pii` this is a `PiiSummary`; other facet types may
            use their own shape.
          oneOf:
            - $ref: '#/components/schemas/PiiSummary'
            - type: object
              additionalProperties: true
        progress:
          $ref: '#/components/schemas/DataSetProgress'
        lastUpdated:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PiiSummary:
      type: object
      description: |
        Aggregate PII counts for a dataset, persisted as the `pii` facet's
        `summary` when the facet is `ready`. Also returned at the top of
        `PiiDetails`.
      required: [filesWithPii, totalFiles, piiAnalysisEnabled]
      properties:
        filesWithPii:
          type: integer
        totalFiles:
          type: integer
        piiAnalysisEnabled:
          type: boolean
        filesWithHighRisk:
          type: integer
        filesWithMediumRisk:
          type: integer
        filesWithLowRisk:
          type: integer

    PiiFileDetail:
      type: object
      description: |
        Per-file PII analysis row. Mirrors what the dataset-processor writes
        to `pii_details.json` and what the analytics-engine preview projects
        from the Iceberg metadata table.
      required: [fileName, filePath, fileSize, mimeType, piiRiskLevel]
      properties:
        fileName:
          type: string
        filePath:
          type: string
        fileSize:
          type: integer
          format: int64
        mimeType:
          type: string
        piiEntities:
          type: array
          nullable: true
          items:
            type: string
          description: Distinct detected PII entity types (e.g. `EMAIL_ADDRESS`, `PERSON`).
        piiCount:
          type: integer
          nullable: true
        sensitivityClass:
          type: string
          description: Classifier-assigned bucket (e.g. `public`, `internal`, `restricted`, `sensitive`).
        hasPii:
          type: boolean
          nullable: true
        piiRiskLevel:
          type: string
          enum: [none, low, medium, high]
        highRiskCount:
          type: integer
        mediumRiskCount:
          type: integer
        lowRiskCount:
          type: integer

    PiiDetails:
      type: object
      description: |
        Full PII analysis payload written by the dataset-processor to
        `pii_details.json` in the dataset's data prefix when PII analysis is
        enabled. Read directly from S3 by the GUI; not currently exposed via
        the config-service API.
      required: [datasetId, analysisTimestamp, summary, files]
      properties:
        datasetId:
          type: string
        analysisTimestamp:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/PiiSummary'
        files:
          type: array
          items:
            $ref: '#/components/schemas/PiiFileDetail'

    UpdateFacetStateRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [in_progress, ready, errored]
        jobId:
          type: string
          description: |
            Workflow execution ID. When the facet is already `in_progress` with
            a non-null `jobId`, this value must match (Layer-3 conflict guard).
        errorMessage:
          type: string
        summary:
          type: object
          additionalProperties: true
          description: Accepted when `state=ready`.

    RunFacetJobResponse:
      type: object
      properties:
        workflowId:
          type: string
        status:
          type: string
          enum: [started, already_running]
        facet:
          $ref: '#/components/schemas/Facet'
        datasetId:
          type: string

    CatalogTable:
      type: object
      readOnly: true
      description: Iceberg table metadata fetched from the Lakekeeper catalog.
      properties:
        name:
          type: string
        namespace:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    DeleteDataSetConflictResponse:
      type: object
      description: Returned by `DELETE /datasets/{id}` when the dataset has dependents.
      required: [error, code, dependents]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [HAS_DEPENDENTS]
        dependents:
          $ref: '#/components/schemas/DependentsPage'

    DeleteDataSetResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
        workflowId:
          type: string
          description: Async S3/catalog cleanup workflow ID, when triggered.
        message:
          type: string

    ImportDataSetResponse:
      type: object
      properties:
        workflowId:
          type: string
        status:
          type: string
        datasetId:
          type: string
        message:
          type: string

    UpdateDataSetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, ready, errored]
        errorMessage:
          type: string

    Snapshot:
      type: object
      description: |
        One Iceberg snapshot returned by `GET /datasets/{id}/snapshots`. Field
        names match Iceberg metadata (camelCased for the JSON wire shape).
      required: [snapshotId, timestampMs]
      properties:
        snapshotId:
          type: integer
          format: int64
        parentSnapshotId:
          type: integer
          format: int64
          nullable: true
        timestampMs:
          type: integer
          format: int64
        summary:
          type: object
          nullable: true
          additionalProperties:
            type: string
        operation:
          type: string
          nullable: true
          description: 'Operation key copied from `summary.operation` (e.g. `append`, `overwrite`, `delete`).'
        manifestList:
          type: string
          nullable: true

    SnapshotsResponse:
      type: object
      required: [snapshots]
      properties:
        currentSnapshotId:
          type: integer
          format: int64
          nullable: true
          description: |
            The id of the snapshot the table's `main` branch points at. Null
            for tables that have never had a successful commit.
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'

    ExpireSnapshotResponse:
      type: object
      required: [expired]
      properties:
        expired:
          type: integer
          format: int64
        newCurrentSnapshotId:
          type: integer
          format: int64
          nullable: true
          description: |
            Set to the new current snapshot when the expired snapshot was the
            previous current. Equal to the unchanged current otherwise.

    AnalyticsFilterCriteria:
      type: object
      required: [column, op, value]
      properties:
        column:
          type: string
        op:
          type: string
          enum: ['=', '!=', '>', '<', '>=', '<=', LIKE, 'NOT LIKE', 'IS NULL', 'IS NOT NULL', IN]
        value:
          type: string
          description: For `IN`, a comma-separated list. Ignored for `IS NULL` / `IS NOT NULL`.

    AnalyticsOrderBy:
      type: object
      required: [column]
      properties:
        column:
          type: string
        direction:
          type: string
          enum: [ASC, DESC]
          default: ASC

    AnalyticsPreviewRequest:
      type: object
      required: [namespace, table]
      properties:
        namespace:
          type: string
        table:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsFilterCriteria'
        orderBy:
          $ref: '#/components/schemas/AnalyticsOrderBy'
        piiView:
          type: string
          enum: [with, without, both]
          default: with
          description: |
            Controls projection of PII columns in the response:
            - `with` (default): include all columns (e.g. `pii_count`, `pii_risk_level`, `sensitivity_class`, `has_pii`, `pii_entities`).
            - `without`: omit PII columns at the SQL layer.
            - `both`: the primary response is the with-PII view; an additional `withoutPii` block carries the same rows projected without PII columns, for side-by-side rendering.

    AnalyticsPreviewResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        columnTypes:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        rowCount:
          type: integer
        totalCount:
          type: integer
        offsetCapped:
          type: boolean
        executionTime:
          type: integer
          format: int64
          description: Server-side execution time in milliseconds.
        withoutPii:
          type: object
          description: Present only when the request `piiView=both`.
          properties:
            columns:
              type: array
              items:
                type: string
            columnTypes:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items: {}

    DataSetVersion:
      type: object
      description: |
        One row of `data_set_history` — a point-in-time snapshot of a dataset's
        domain metadata. The `data` field carries the persisted dataset shape
        at that version.
      required: [id, entityId, version, data, modifiedAt]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          description: Dataset ID this version belongs to.
        version:
          type: integer
          description: Monotonically increasing version number (1, 2, 3, ...).
        data:
          type: object
          additionalProperties: true
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          nullable: true
        op:
          type: string
          nullable: true
          description: 'Operation that produced this version: e.g. `create`, `update`, `restore`.'

    ManualUploadLimits:
      type: object
      description: |
        Server-enforced caps on manual uploads. Both can be overridden via env
        vars on the config-service:
        - `MANUAL_UPLOAD_MAX_FILE_BYTES` (default 5368709120 = 5 GiB)
        - `MANUAL_UPLOAD_MAX_FILES_PER_DATASET` (default 50000)
        A value of `0` disables the cap. The per-file size cap is only enforced
        on the `PUT /datasets/{id}` `uploadedFiles` path because that's the
        only request where the client supplies the file size. The per-dataset
        file-count cap is additive across every committed and draft manifest.
      properties:
        maxFileBytes:
          type: integer
          format: int64
        maxFilesPerDataset:
          type: integer

    DataSetManifest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Manifest UUID (primary key)
        dataSetId:
          type: string
          description: Short dataset ID (`dset<8 lowercase alphanumeric>`)
          pattern: '^dset[a-z0-9]{8}$'
        manifestId:
          type: integer
          description: Monotonically increasing manifest version number
        status:
          type: string
          enum: [draft, committed, deprecated]
          description: Manifest status - only draft manifests can be modified
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the manifest
        schema:
          type: object
          additionalProperties: true
          description: Optional schema definition for the manifest
        files:
          type: array
          items:
            $ref: '#/components/schemas/DataSetManifestFile'
          description: List of files in this manifest
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    DataSetManifestFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        manifestId:
          type: string
          format: uuid
        fileName:
          type: string
          description: Original file name
        uri:
          type: string
          description: S3 URI or file path (e.g., s3://bucket/path/to/file)
        createdAt:
          type: string
          format: date-time

    KnowledgeBase:
      type: object
      description: |
        Full KnowledgeBase entity as returned by GET endpoints. Persisted
        fields come from PostgreSQL; `facets`, `progress`, `stats`, and
        `dependentsSummary` are enriched at read time and are read-only on
        writes. Vector index artifacts live at
        `s3://{bucketName}/knowledgebases/{id}/lancedb` under the resolved
        project storage root.
      required: [name, sourceDataset, embeddingModel, chunkSize, vectorSize]
      properties:
        id:
          type: string
          description: Short knowledge base ID (`kb<8 lowercase alphanumeric>`)
          pattern: '^kb[a-z0-9]{8}$'
          readOnly: true
        projectId:
          type: string
          description: Owning project ID
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            KB name. Unique per project. Trimmed on create and update; a 409
            is returned on collisions with the `(projectId, name)` index.
        description:
          type: string
          nullable: true
        sourceDataset:
          type: string
          description: |
            Dataset ID this KB chunks and embeds from. Must be a dataset in
            the same project; the dataset must be in `ready` status before
            the KB processing workflow can run.
        embeddingModel:
          type: string
          description: Identifier of the embedding model used to vectorize chunks.
        chunkSize:
          type: integer
          minimum: 1
          description: Target chunk size (characters/tokens depending on `chunkStrategy`).
        chunkStrategy:
          type: string
          enum: [fixed, sentence, recursive, token, markdown]
          default: fixed
          description: |
            Chunking strategy used to split source documents. Strategy-specific
            knobs live in `chunkOptions`.
        chunkOverlap:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Overlap between consecutive chunks (used by `fixed` and `token`
            strategies). Defaults to `50` when triggering a workflow if unset.
        chunkOptions:
          $ref: '#/components/schemas/ChunkOptions'
        indexingMode:
          type: string
          enum: [hybrid, semantic, fts]
          default: hybrid
          description: |
            Controls whether a full-text search index is built alongside the
            vector index and which mode the retrieval service prefers:
            - `hybrid` — vector + FTS with reciprocal-rank fusion
            - `semantic` — vector only
            - `fts` — full-text only
        quantizationType:
          type: string
          enum: [auto, none, ivf_pq, scalar, ivf_rq]
          default: auto
          description: |
            Vector index compression strategy. `auto` lets the processor pick
            based on dataset size; explicit values pin the strategy.
        quantizationOptions:
          $ref: '#/components/schemas/QuantizationOptions'
        vectorSize:
          type: integer
          minimum: 1
          description: Embedding dimensionality (must match the embedding model output).
        textColumns:
          type: string
          nullable: true
          description: |
            Comma-separated list of column names for text extraction. Required
            when the source dataset is `kind=structured`; ignored otherwise.
        dataType:
          type: string
          nullable: true
          deprecated: true
          description: Deprecated — no longer used in the UI or workflow.
        bucketName:
          type: string
          nullable: true
          readOnly: true
          description: |
            Storage bucket resolved from the project `home_dir` when the
            workflow starts. Ignored on create/update requests.
        namespace:
          type: string
          nullable: true
          readOnly: true
          description: |
            Logical namespace for the KB (set to `projectId` for project-level
            isolation). Set by the workflow trigger; ignored on writes.
        lanceTablePath:
          type: string
          nullable: true
          readOnly: true
          description: |
            Resolved LanceDB table path
            (e.g. `s3://{bucket}/knowledgebases/{id}/lancedb`). Populated by
            the workflow on successful processing.
        status:
          type: string
          enum: [in_progress, ready, errored, deprecated]
          readOnly: true
          description: |
            Processing status:
            - `in_progress` — KB processing workflow is running
            - `ready` — index built and queryable
            - `errored` — workflow failed (`errorMessage` is populated)
            - `deprecated` — soft-retired KB
        jobId:
          type: string
          nullable: true
          readOnly: true
          description: Temporal workflow execution ID for the most recent run.
        errorMessage:
          type: string
          nullable: true
          readOnly: true
        progress:
          $ref: '#/components/schemas/KnowledgeBaseProgress'
        stats:
          $ref: '#/components/schemas/KnowledgeBaseStats'
        synchronizationConfig:
          $ref: '#/components/schemas/KBSynchronizationConfig'
        scheduleConfig:
          $ref: '#/components/schemas/KnowledgeBaseScheduleConfig'
        lastSyncedAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            ISO 8601 timestamp of the most recent successful KB sync. Set by
            the KB workflow on `status=ready`. Used by the
            `after_dataset_updates` trigger as the basis for the file-change
            diff threshold.
        labels:
          $ref: '#/components/schemas/Labels'
        facets:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Facet'
          description: |
            Side-channel facets (e.g. `embedding`) populated by independent
            workflow runs and surfaced in list/get responses.
        dependentsSummary:
          $ref: '#/components/schemas/DependentsSummary'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ChunkOptions:
      type: object
      description: |
        Strategy-specific chunking knobs. Only the fields relevant to the
        active `chunkStrategy` are honored by the processor; others are
        ignored.
      properties:
        maxSentences:
          type: integer
          minimum: 1
          description: '`sentence` strategy: max sentences per chunk.'
        overlapSentences:
          type: integer
          minimum: 0
          description: '`sentence` strategy: overlap sentences between chunks.'
        maxTokens:
          type: integer
          minimum: 1
          description: '`token` strategy: max tokens per chunk.'
        tokenOverlap:
          type: integer
          minimum: 0
          description: '`token` strategy: overlap tokens between chunks.'
        splitOnHeaders:
          type: boolean
          description: '`markdown` strategy: split on Markdown headers.'

    QuantizationOptions:
      type: object
      description: |
        Tuning options for the vector quantization strategy. Only the fields
        relevant to the active `quantizationType` are read.
      properties:
        numPartitions:
          type: integer
          minimum: 1
          description: '`ivf_pq` / `ivf_hnsw_sq` / `ivf_rq`: number of IVF partitions.'
        numSubVectors:
          type: integer
          minimum: 1
          description: '`ivf_pq`: number of PQ sub-vectors (default: 96).'
        efConstruction:
          type: integer
          minimum: 1
          description: '`ivf_hnsw_sq`: HNSW `ef_construction` (default: 150).'
        m:
          type: integer
          minimum: 1
          description: '`ivf_hnsw_sq`: HNSW connectivity parameter.'
        numBits:
          type: integer
          minimum: 1
          maximum: 8
          description: '`ivf_rq`: bits per dimension (default: 1).'

    KnowledgeBaseProgress:
      type: object
      description: |
        Live progress for an in-progress KB workflow. Populated only when the
        workflow-engine is reachable; otherwise the last persisted snapshot
        is returned.
      readOnly: true
      properties:
        phase:
          type: string
          description: 'High-level phase (e.g. `queued`, `chunking`, `embedding`, `indexing`).'
        percentage:
          type: number
          minimum: 0
          maximum: 100
        totalFiles:
          type: integer
        processedFiles:
          type: integer
        totalDocuments:
          type: integer
        chunksCreated:
          type: integer
        vectorsCreated:
          type: integer
        currentFile:
          type: string
        estimatedRemainingFormatted:
          type: string
        elapsedFormatted:
          type: string
        lastUpdated:
          type: string
          format: date-time
        totalUnits:
          type: integer
        units:
          type: array
          items:
            type: object
            properties:
              unitId:
                type: string
              status:
                type: string
              metrics:
                type: object
                additionalProperties: true

    KnowledgeBaseStats:
      type: object
      description: |
        Aggregate statistics for the KB. Populated during processing
        (from `progress.json`) and after completion (from the kb-retrieval
        metadata API when not already cached locally).
      readOnly: true
      properties:
        documentCount:
          type: integer
          minimum: 0
          description: Number of source documents processed.
        chunkCount:
          type: integer
          minimum: 0
          description: Total number of chunks created.
        vectorCount:
          type: integer
          minimum: 0
          description: Total number of vectors (typically equals `chunkCount`).
        storageBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total storage size in bytes.
        storageMB:
          type: number
          minimum: 0
          description: Total storage size in megabytes.
        fileCount:
          type: integer
          minimum: 0
          description: Number of LanceDB files on disk.
        avgChunkSize:
          type: number
          minimum: 0
          description: Average chunk size in characters.
        lastProcessedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the last successful processing run.

    CreateKnowledgeBaseRequest:
      type: object
      description: |
        Body for `POST /api/v1/projects/{projectId}/knowledgebases`. Creates
        the KB row and auto-triggers the processing workflow. `processingMode`
        defaults to `full` and is the only mode currently supported on
        creation.
      required: [name, sourceDataset, embeddingModel, chunkSize, vectorSize]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        sourceDataset:
          type: string
        embeddingModel:
          type: string
        chunkSize:
          type: integer
          minimum: 1
        vectorSize:
          type: integer
          minimum: 1
        chunkStrategy:
          type: string
          enum: [fixed, sentence, recursive, token, markdown]
        chunkOverlap:
          type: integer
          minimum: 0
        chunkOptions:
          $ref: '#/components/schemas/ChunkOptions'
        indexingMode:
          type: string
          enum: [hybrid, semantic, fts]
        quantizationType:
          type: string
          enum: [auto, none, ivf_pq, scalar, ivf_rq]
        quantizationOptions:
          $ref: '#/components/schemas/QuantizationOptions'
        textColumns:
          type: string
          description: |
            Comma-separated list of column names for text extraction. Required
            when the source dataset is `kind=structured`.
        processingMode:
          type: string
          enum: [full, incremental]
          default: full
          description: |
            Used by the workflow trigger only; not persisted on the KB
            entity.
        synchronizationConfig:
          $ref: '#/components/schemas/KBSynchronizationConfig'
        labels:
          $ref: '#/components/schemas/Labels'
        dataType:
          type: string
          deprecated: true

    UpdateKnowledgeBaseRequest:
      type: object
      description: |
        Body for `PUT /api/v1/projects/{projectId}/knowledgebases/{id}`. All
        fields are optional. Identity fields (`projectId`, `id`) on the body
        are stripped before persistence.

        Changing indexing-related fields (`chunkSize`, `embeddingModel`,
        `chunkStrategy`, `indexingMode`, `quantizationType`, etc.) auto-triggers
        reprocessing when the values differ from the persisted row. Processing
        fields are deferred until the workflow succeeds; metadata fields save
        immediately.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        sourceDataset:
          type: string
        embeddingModel:
          type: string
        chunkSize:
          type: integer
          minimum: 1
        vectorSize:
          type: integer
          minimum: 1
        chunkStrategy:
          type: string
          enum: [fixed, sentence, recursive, token, markdown]
        chunkOverlap:
          type: integer
          minimum: 0
        chunkOptions:
          $ref: '#/components/schemas/ChunkOptions'
        indexingMode:
          type: string
          enum: [hybrid, semantic, fts]
        quantizationType:
          type: string
          enum: [auto, none, ivf_pq, scalar, ivf_rq]
        quantizationOptions:
          $ref: '#/components/schemas/QuantizationOptions'
        textColumns:
          type: string
        dataType:
          type: string
          deprecated: true
        status:
          type: string
          enum: [in_progress, ready, errored, deprecated]
          description: Workflow-only — set by the KB processor when finalizing a run.
        lanceTablePath:
          type: string
          description: Workflow-only — set by the KB processor on success.
        errorMessage:
          type: string
          description: Workflow-only — set by the KB processor on failure.
        stats:
          $ref: '#/components/schemas/KnowledgeBaseStats'
        synchronizationConfig:
          $ref: '#/components/schemas/KBSynchronizationConfig'
        lastSyncedAt:
          type: string
          format: date-time
          description: Workflow-only — set when status transitions to `ready`.
        labels:
          $ref: '#/components/schemas/Labels'

    CreateKnowledgeBaseResponse:
      type: object
      description: |
        Response shape for `POST /knowledgebases`. The body is always the
        persisted KB; the additional fields below describe whether and how
        the auto-triggered workflow was started.
      allOf:
        - $ref: '#/components/schemas/KnowledgeBase'
        - type: object
          properties:
            workflowId:
              type: string
              description: Workflow execution ID when the workflow was started successfully.
            workflowStatus:
              type: string
              enum: [running]
              description: Present when `workflowId` is set.
            warning:
              type: string
              description: |
                Human-readable explanation when the KB was persisted but the
                workflow did not start (e.g. source dataset missing, source
                dataset not in `ready` status, workflow-engine unreachable).
            workflowError:
              type: string
              description: Workflow-engine error string when the trigger call failed.

    UpdateKnowledgeBaseResponse:
      type: object
      description: |
        Response shape for `PUT /knowledgebases/{id}`. The body is always the
        persisted KB (metadata applied immediately). When indexing-related
        fields changed, the additional fields describe whether reprocessing
        was started, skipped, or failed to trigger.
      allOf:
        - $ref: '#/components/schemas/KnowledgeBase'
        - type: object
          properties:
            workflowId:
              type: string
              description: Workflow execution ID when reprocessing started successfully.
            workflowStatus:
              type: string
              enum: [running]
              description: Present when `workflowId` is set.
            warning:
              type: string
              description: |
                Human-readable explanation when metadata was saved but reprocessing
                did not start (e.g. source dataset missing or not `ready`) or when
                the workflow-engine call failed.
            workflowError:
              type: string
              description: Workflow-engine error string when the trigger call threw.
            workflowSkippedReason:
              type: string
              enum: [dataset_not_found, dataset_not_ready, project_not_found]
              description: |
                Machine-readable reason when `warning` is set because a pre-flight
                check prevented the workflow from starting. Not set when reprocessing
                was blocked with 409 (`KB_IN_PROGRESS`).

    TriggerKnowledgeBaseCreationRequest:
      type: object
      description: |
        Body for `POST /knowledgebases/{id}/create` and the embedding facet
        `run` endpoint. All fields are optional and override the persisted
        KB config for this workflow run only — the row is updated atomically
        on success by the workflow.
      properties:
        embeddingModel:
          type: string
        chunkSize:
          type: integer
          minimum: 1
        vectorSize:
          type: integer
          minimum: 1
        chunkStrategy:
          type: string
          enum: [fixed, sentence, recursive, token, markdown]
        chunkOverlap:
          type: integer
          minimum: 0
        chunkOptions:
          $ref: '#/components/schemas/ChunkOptions'
        indexingMode:
          type: string
          enum: [hybrid, semantic, fts]
        quantizationType:
          type: string
          enum: [auto, none, ivf_pq, scalar, ivf_rq]
        quantizationOptions:
          $ref: '#/components/schemas/QuantizationOptions'

    TriggerKnowledgeBaseCreationResponse:
      type: object
      required: [workflowId, status, knowledgeBaseId, projectId]
      properties:
        workflowId:
          type: string
        status:
          type: string
          enum: [running]
        knowledgeBaseId:
          type: string
          pattern: '^kb[a-z0-9]{8}$'
        projectId:
          type: string

    RunKnowledgeBaseFacetResponse:
      type: object
      required: [workflowId, status, facet, knowledgeBaseId, projectId]
      properties:
        workflowId:
          type: string
        status:
          type: string
          enum: [started, already_running]
        facet:
          $ref: '#/components/schemas/Facet'
        knowledgeBaseId:
          type: string
          pattern: '^kb[a-z0-9]{8}$'
        projectId:
          type: string

    KnowledgeBaseVersion:
      type: object
      description: |
        One row of `knowledge_base_history` — a point-in-time snapshot of a
        KB's domain metadata. The `data` field carries the persisted KB
        shape at that version.
      required: [id, entityId, version, data]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          description: Knowledge base ID this version belongs to.
        version:
          type: integer
          description: Monotonically increasing version number (1, 2, 3, ...).
        data:
          type: object
          additionalProperties: true
          description: Snapshot of the KB at this version.
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          nullable: true
        op:
          type: string
          nullable: true
          description: 'Operation that produced this version: e.g. `create`, `update`, `restore`.'

    RestoreKnowledgeBaseResponse:
      type: object
      required: [restored, data]
      properties:
        restored:
          type: boolean
        data:
          $ref: '#/components/schemas/KnowledgeBase'

    DeleteKnowledgeBaseResponse:
      type: object
      required: [message]
      description: |
        Returned when the KB row was deleted. S3 cleanup is best-effort and
        runs asynchronously; the flags below describe whether the cleanup
        workflow was successfully started.
      properties:
        message:
          type: string
        s3CleanupStarted:
          type: boolean
        warning:
          type: string
          description: Present when the S3 cleanup workflow failed to start.

    DeleteKnowledgeBaseConflictResponse:
      type: object
      description: Returned by `DELETE /knowledgebases/{id}` when the KB has dependents.
      required: [error, code, dependents]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [HAS_DEPENDENTS]
        dependents:
          $ref: '#/components/schemas/DependentsPage'

    KBSynchronizationConfig:
      type: object
      description: |
        User-facing knowledge-base synchronization config persisted as the
        `synchronization_config` JSONB column. Coexists with the server-derived
        `KnowledgeBaseScheduleConfig` (cron + Temporal schedule id): the
        config-service derives a cron expression from this object when
        `sync_mode='scheduled'` and writes the resulting Temporal schedule id
        into `scheduleConfig`. Snake-case property names match the public spec.

        Sync modes:
        - `manual` — updates must be applied manually (POST `/knowledgebases/{id}/create`).
        - `after_dataset_updates` — KB sync starts automatically when the source
          dataset transitions to `ready`. Subject to the optional file-change
          threshold below.
        - `scheduled` — independent recurring schedule defined by `schedule_type`.
      required: [sync_mode, data_change_threshold_enabled]
      properties:
        sync_mode:
          type: string
          enum: [manual, after_dataset_updates, scheduled]
          default: manual
        schedule_type:
          type: string
          nullable: true
          enum: [hourly, daily, weekly, monthly, cron]
          description: |
            Required when `sync_mode='scheduled'`. Maps to the schedule-builder
            tabs (hourly/daily/weekly/monthly) vs the explicit cron tab.
        interval_minutes:
          type: integer
          minimum: 120
          nullable: true
          description: |
            Required when `schedule_type='hourly'`. Minimum 2 hours
            (120 minutes).
        time_of_day:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          nullable: true
          description: |
            HH:mm (24-hour). Required when `schedule_type` is one of
            `daily` / `weekly` / `monthly`.
        day_of_week:
          type: array
          nullable: true
          description: |
            Days of the week (0=Sunday, 6=Saturday). Required when
            `schedule_type='weekly'`.
          items:
            type: integer
            minimum: 0
            maximum: 6
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: |
            Day of the month (1-31). Required when
            `schedule_type='monthly'`.
        timezone:
          type: string
          nullable: true
          default: UTC
          description: 'IANA timezone identifier (e.g. `UTC`, `America/New_York`). Applies to `time_of_day`.'
        cron_expression:
          type: string
          nullable: true
          description: 'Standard cron expression. Required when `schedule_type=cron`.'
        data_change_threshold_enabled:
          type: boolean
          default: false
          description: |
            When disabled, every dataset update triggers a fresh KB sync
            (subject to `sync_mode`). When enabled, syncs are only triggered
            once `data_change_threshold_value` file changes have accumulated
            since the previous successful sync (`lastSyncedAt`).
        data_change_threshold_value:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Minimum number of dataset file changes required before a sync is
            triggered. Required when
            `data_change_threshold_enabled=true`.

    KnowledgeBaseScheduleConfig:
      type: object
      readOnly: true
      description: |
        Server-derived schedule state. Populated by the config-service from
        `synchronizationConfig` and the workflow-engine's Temporal Schedule
        API. Read-only on writes.
      required: [cronExpression, timezone, enabled]
      properties:
        cronExpression:
          type: string
          description: 5-field cron expression derived from `synchronizationConfig`.
        timezone:
          type: string
          default: UTC
          description: IANA timezone the cron expression evaluates in.
        temporalScheduleId:
          type: string
          nullable: true
          description: |
            Temporal Schedule id. Format `kbsync-{projectId}-{kbId}`. Absent
            when `enabled=false`.
        enabled:
          type: boolean
          description: True when a Temporal schedule has been provisioned.

    KnowledgeBaseSync:
      type: object
      description: |
        One blue-green sync version on storage. Each successful KB sync writes
        a new `lancedb-run-{workflowRunId}/` (or legacy
        `lancedb-{YYYYMMDD-HHMMSS}/`) prefix beneath
        `{pathPrefix}/knowledgebases/{kbId}/`. The version whose absolute path
        equals `metadata.json#lanceTablePath` is reported as `isActive=true`.
      required: [versionId, prefix, lanceTablePath, isActive]
      properties:
        versionId:
          type: string
          description: Sync version identifier (directory name without the bucket/path prefix).
        prefix:
          type: string
          description: Bucket-relative prefix (e.g. `prefix/knowledgebases/{kbId}/lancedb-run-{runId}`).
        lanceTablePath:
          type: string
          description: Absolute LanceDB path (`s3://{bucket}/{prefix}`).
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Most-recent object LastModified within the version directory.

    KnowledgeBaseSyncListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBaseSync'
        activeVersionId:
          type: string
          nullable: true
          description: |
            The `versionId` whose `lanceTablePath` matches
            `metadata.json#lanceTablePath`. Absent when no metadata.json
            exists yet.

    RollbackKnowledgeBaseSyncResponse:
      type: object
      required: [rolledBackTo]
      description: |
        Returned by the rollback endpoint. The kb-retrieval-service connection
        pool refreshes lazily because its cache key includes the LanceDB path
        — no explicit cache invalidation is required.
      properties:
        rolledBackTo:
          type: object
          required: [versionId, lanceTablePath]
          properties:
            versionId:
              type: string
            lanceTablePath:
              type: string
        previous:
          type: object
          nullable: true
          description: The version that was active immediately prior to the rollback.
          properties:
            versionId:
              type: string
            lanceTablePath:
              type: string

    ModelParams:
      type: object
      description: |
        LLM generation parameters. Used today for the fallback set
        (`agents.fallback_model_params`); the primary model uses the flat
        `temperature` / `maxTokens` / `topP` / `topK` columns on the Agent.
        Snake-case property names match the public spec.
      properties:
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 1
        top_k:
          type: integer
          minimum: 0
          maximum: 1000
          default: 50
        token_limit:
          type: integer
          minimum: 1
          maximum: 100000
          default: 2000

    AgentOutputResponse:
      type: object
      description: |
        Optional example response shown in the agent UI as a hint to the
        operator. Persisted on the agent row but not yet injected into the
        runtime system prompt by the agent-service.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: false
        example_response:
          type: string
          nullable: true
          maxLength: 500

    AgentStructuredOutput:
      type: object
      description: |
        Structured-output card. When `enabled=true`, `responseFormat` selects
        the output shape and `outputSchema` (a string) is required.
        `outputSchema` carries either a JSON Schema serialized as a string
        (when `responseFormat=json_object`) or free-form text guidelines (when
        `responseFormat=text`). When `responseFormat=json_object`, the server
        validates that `outputSchema` parses to a JSON Schema object (draft
        2020-12). Boolean schemas (e.g. `true`) and non-object values (e.g.
        arrays) are rejected, as are arbitrary JSON objects that are not valid
        schemas. The legacy top-level
        `outcomeSchema` / `outcomeDescription` fields on `Agent` are not used
        by this card.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: false
        responseFormat:
          type: string
          enum: [text, json_object]
          description: |
            Output format. `text` for free-form output, `json_object` for a
            JSON response. Required when `enabled=true`.
        outputSchema:
          type: string
          nullable: true
          maxLength: 5000
          description: |
            JSON Schema serialized as a string (for `json_object`) or free-form
            text guidelines (for `text`). Required (non-empty) when
            `enabled=true`. When `responseFormat=json_object`, must parse to a
            JSON Schema object serialized as a string. Boolean schemas and
            non-object values are rejected.

    AgentMemoryContext:
      type: object
      description: |
        Unified conversation memory configuration on `Agent` and `AgentTeam`.
        Source of truth for memory behavior. The legacy `memoryType` and
        `memoryConfig` fields are derived from this server-side on save
        (kept populated for agent-service back-compat); clients should
        write only this object.

        Per the locked memory-context plan, every field is optional —
        sensible defaults are applied server-side:

          message_window_limit          = 20
          summary_token_limit           = 2000
          summary_refresh_every_turns   = 0 (always summarize on overflow)
          summary_model                 = resolved by the runtime
                                          (explicit value → manager model
                                          → first agent's model →
                                          framework default)

        Defaults apply only when memory is enabled and the relevant
        `type` is selected. A minimum-viable payload is
        `{ "enabled": true, "type": "window" }` (or `"summary"` /
        `"summary_buffer"`).
      properties:
        enabled:
          type: boolean
          default: true
          description: Master switch. When false, no history is sent to the model.
        type:
          type: string
          enum: [none, window, summary, summary_buffer]
          default: window
          description: |
            Memory strategy (maps 1:1 to the MAF runtime buffer):
            - `none` — memory disabled.
            - `window` — sliding window (last K messages or N tokens).
            - `summary` — LLM-summarized history with minimal verbatim tail.
            - `summary_buffer` — last K verbatim + summary of older.
        message_window_limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
          description: |
            Window / SummaryBuffer: last K messages kept verbatim. Counts
            messages (NOT turns). Permitted range is 1..200; omit the
            field to apply the server default of 20. (Earlier drafts
            allowed `0` as an "unlimited" sentinel — this is no longer
            accepted; the UI never produced it and round-trip semantics
            were ambiguous.) Wins over `message_token_limit` only when
            `message_token_limit` is unset.
        message_token_limit:
          type: integer
          minimum: 0
          maximum: 200000
          description: |
            Window: alternative cap expressed in tokens. When both
            `message_window_limit` and `message_token_limit` are set, the
            token limit wins (tokens are the truer cost signal).
        summary_token_limit:
          type: integer
          minimum: 0
          maximum: 50000
          default: 2000
          description: |
            Summary / SummaryBuffer — max output tokens for the summary
            blob. Permitted values are `0` (special-cased: "use the
            server default of 2000") OR any integer `>= 64`. Non-zero
            values below 64 are REJECTED by the validator with a 400 —
            the MAF SummaryBuffer cannot produce a meaningful summary
            below that floor, so we surface the rejection at the API
            edge instead of silently truncating at runtime.
        summary_refresh_every_turns:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
          description: |
            Summary / SummaryBuffer — cadence gate. Only invoke the
            summarizer once N new messages have accumulated since the
            last summary. 0 = always summarize on overflow.
        summary_model:
          type: string
          maxLength: 200
          description: |
            Which LLM does summarization. Accepts a catalog UUID OR an
            already-resolved `provider/name` string. Empty/absent → MAF
            resolves via fallback chain: manager model → first agent's
            model → framework default. When the resolved model is
            unreachable at runtime, MAF silently degrades to `window`
            with a structured warn log.
        adaptive_summarize:
          type: object
          description: |
            SummaryBuffer-only adaptive switch (preserves the legacy
            `contextStrategy='hybrid'` cost optimization). When the
            overflow ratio is below `overflow_threshold`, the buffer
            trims (cheap) instead of summarizing (LLM call).
          properties:
            overflow_threshold:
              type: number
              format: float
              minimum: 0
              maximum: 1
              default: 0.30
              description: |
                Ratio above which the engine summarizes. 0.30 mirrors
                agent-service's DEFAULT_SUMMARY_OVERFLOW_THRESHOLD.
        budget:
          type: object
          description: |
            Token-budget reservations subtracted from the model's context
            window before any history is included. AgentStudio's
            distinctive contribution over plain LangChain-style memory.
            Defaults are baked into the runtime when fields are absent.
          properties:
            tool_round_reservation:
              type: integer
              minimum: 0
              maximum: 64000
              description: Tokens reserved for tool schemas + tool I/O mid-turn.
            output_reservation:
              type: integer
              minimum: 0
              maximum: 64000
              description: Tokens reserved for the assistant's response.
            safety_buffer_pct:
              type: number
              format: float
              minimum: 0
              maximum: 0.5
              description: |
                Percentage (0..0.5) of context window held back as
                tokenizer-drift insurance.

    GuardrailRule:
      type: object
      description: |
        A lean per-agent guardrail reference. `guardrail_id` points at a
        `guardrails_catalog` definition; `action` / `config` are optional
        per-agent overrides (omitted fields fall back to the catalog defaults).
        config-service stores this verbatim and does not resolve it.
      required: [guardrail_id]
      properties:
        guardrail_id:
          type: string
          format: uuid
          minLength: 1
          description: References `guardrails_catalog.id` (UUID).
        action:
          type: string
          description: Optional override of the catalog default action.
        config:
          type: object
          additionalProperties: true
          description: Optional partial override of the catalog default `config`.

    GuardrailCatalog:
      type: object
      description: |
        A guardrail definition in the catalog. The reusable resource backing
        `/api/v1/guardrails`; agents reference these by id. config-service does
        not validate `key` against the runtime registry or seed the catalog.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: 'Dispatch slug mapped to the runtime implementation (e.g. `pii_masker`).'
        stage:
          type: string
          enum: [input, output, tool]
        display_name:
          type: string
        description:
          type: string
        type:
          type: string
          description: 'Category, e.g. `privacy`, `security`, `safety`, `validation`, `content_policy`, `accuracy`.'
        supported_actions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          description: Availability flag — when true the guardrail is published for selection.
        priority:
          type: integer
        default_action:
          type: string
          description: Default action; one of `supported_actions`.
        message:
          type: string
        config:
          type: object
          additionalProperties: true
        config_schema:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Optional JSON Schema validating `config` and per-agent overrides.
            Constrained to a fixed meta-schema: a flat object whose every
            property declares `type`, `is_required`, and `can_override`
            (no nested objects, no top-level `required` array). Required
            whenever `config` is non-empty.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GuardrailCatalogCreate:
      type: object
      required: [key, stage, display_name, description, type, supported_actions, default_action, message]
      properties:
        key:
          type: string
        stage:
          type: string
          enum: [input, output, tool]
        display_name:
          type: string
        description:
          type: string
        type:
          type: string
        supported_actions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        priority:
          type: integer
        default_action:
          type: string
          description: Default action; must be one of `supported_actions`.
        message:
          type: string
        config:
          type: object
          additionalProperties: true
        config_schema:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Flat object whose every property declares `type`, `is_required`,
            and `can_override`; no nested objects and no top-level `required`
            array. Required whenever `config` is non-empty.
        version:
          type: integer

    GuardrailCatalogUpdate:
      type: object
      description: >-
        Partial update of a guardrail definition (`PUT /api/v1/guardrails/{id}`).
        All fields are optional; only the supplied fields are changed.
        `description` and `message` must not be null (the columns are NOT NULL).
      properties:
        key:
          type: string
        stage:
          type: string
          enum: [input, output, tool]
        display_name:
          type: string
        description:
          type: string
        type:
          type: string
        supported_actions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        priority:
          type: integer
        default_action:
          type: string
          description: Default action; must be one of `supported_actions` (validated against the merged record).
        message:
          type: string
        config:
          type: object
          additionalProperties: true
        config_schema:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Flat object whose every property declares `type`, `is_required`,
            and `can_override`; no nested objects and no top-level `required`
            array. Required whenever the merged `config` is non-empty.
        version:
          type: integer

    AgentRetriesConfig:
      type: object
      description: |
        Automatic retries card. Persisted but not yet wrapped around the
        agent-service LLM call.
      required: [enabled, max_retries]
      properties:
        enabled:
          type: boolean
          default: false
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
          default: 3

    AgentRateLimitingConfig:
      type: object
      description: |
        Per-agent API rate-limiting card. Persisted but no token bucket /
        sliding-window enforcement is hooked up in the agent-service yet.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: false
        max_requests_per_minute:
          type: integer
          minimum: 1
          nullable: true

    A2AServerConfig:
      type: object
      description: |
        Agent-to-Agent (A2A) external server endpoint configuration on an
        AgentTeam. When `enabled=true` the team can hand off requests to an
        externally hosted agent reachable at `server_url`. The validator
        rejects `enabled=true` with a missing/blank `server_url`. The
        runtime adapter that calls the external server is not yet
        implemented — this is a persistence-only addition.
      required: [enabled, server_url]
      properties:
        enabled:
          type: boolean
          default: false
        server_url:
          type: string

    EntityRef:
      type: object
      description: |
        Minimal reference to another entity (id + display name). Used inside
        the read-only `associatedResources` blocks on `Agent` / `AgentTeam`.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    ModelSummary:
      type: object
      description: |
        Read-only subset of a Model row, embedded into agent read responses
        so callers can render the primary / fallback model name without an
        extra round-trip. Resolved by the config-service at read time from
        the `models` table via `modelId` and `fallbackModelIds[]`.
      readOnly: true
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
          description: 'Provider identifier (e.g. `openai`, `aws_bedrock`, `azure`, `google`, `local`).'
        providerModelId:
          type: string
          nullable: true
          description: Model ID as known by the provider (e.g. `gpt-4o`).

    AgentAssociatedResources:
      type: object
      description: |
        Read-only summary of resources the agent is associated with.
        Computed by the config-service at read time:
        - `knowledgeBases` — resolved from `knowledgeBaseIds`.
        - `agentTeams` — teams in the same project whose `members[]`
          includes this agent.
      readOnly: true
      required: [knowledgeBases, agentTeams]
      properties:
        knowledgeBases:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        agentTeams:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'

    AgentTeamAssociatedResources:
      type: object
      description: |
        Read-only summary of the team's `members[]` resolved into
        `{id, name}` pairs partitioned by member type.
      readOnly: true
      required: [agents, agentTeams]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        agentTeams:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'

    FunctionChoiceBehavior:
      type: string
      enum: [auto, none, required, any]
      default: auto
      description: |
        Tool-call selection behavior the runtime hands to the model.
        `auto` lets the model decide; `none` disables tool calls;
        `required` / `any` force a tool call. Persistence-only today —
        agent-service does not yet thread this into LiteLLM kwargs.

    MaximumIterationsTermination:
      type: object
      required: [type, maximum_iterations]
      properties:
        type:
          type: string
          enum: [maximum_iterations]
        maximum_iterations:
          type: integer
          minimum: 1
          description: Stop once the agent / team has run this many iterations.

    KeywordTermination:
      type: object
      required: [type, keywords]
      properties:
        type:
          type: string
          enum: [keyword]
        keywords:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Stop once any keyword appears in a model response.

    TimeoutTermination:
      type: object
      required: [type, timeout_seconds]
      properties:
        type:
          type: string
          enum: [timeout]
        timeout_seconds:
          type: integer
          minimum: 1

    LeafTerminationStrategy:
      description: |
        Single-strategy variant — used both directly on
        `terminationStrategy` and inside an `aggregator.sub_strategies` list.
        Nested aggregators are not supported.
      oneOf:
        - $ref: '#/components/schemas/MaximumIterationsTermination'
        - $ref: '#/components/schemas/KeywordTermination'
        - $ref: '#/components/schemas/TimeoutTermination'
      discriminator:
        propertyName: type
        mapping:
          maximum_iterations: '#/components/schemas/MaximumIterationsTermination'
          keyword: '#/components/schemas/KeywordTermination'
          timeout: '#/components/schemas/TimeoutTermination'

    AggregatorTermination:
      type: object
      description: |
        Composes multiple leaf strategies. `sub_strategies` may NOT contain
        another `aggregator` — only one level of nesting is supported.
      required: [type, condition, sub_strategies]
      properties:
        type:
          type: string
          enum: [aggregator]
        condition:
          type: string
          enum: [any, all]
          description: |
            `any` — terminate when any sub-strategy fires.
            `all` — terminate only when every sub-strategy has fired.
        sub_strategies:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LeafTerminationStrategy'

    TerminationStrategy:
      description: |
        Discriminated union controlling when the agent (or team) loop stops.
        Persistence-only today; the legacy `guardrails.maxIterations` /
        `guardrails.timeoutSeconds` still drive runtime termination.
      oneOf:
        - $ref: '#/components/schemas/MaximumIterationsTermination'
        - $ref: '#/components/schemas/KeywordTermination'
        - $ref: '#/components/schemas/TimeoutTermination'
        - $ref: '#/components/schemas/AggregatorTermination'
      discriminator:
        propertyName: type
        mapping:
          maximum_iterations: '#/components/schemas/MaximumIterationsTermination'
          keyword: '#/components/schemas/KeywordTermination'
          timeout: '#/components/schemas/TimeoutTermination'
          aggregator: '#/components/schemas/AggregatorTermination'

    Agent:
      type: object
      description: |
        Full Agent entity as returned by GET endpoints. Persisted fields come
        from PostgreSQL; `_resolvedMCPServers` and `dependentsSummary` are
        enriched at read time and are read-only on writes.
      required: [name, role, systemPrompt]
      properties:
        id:
          type: string
          description: Short agent ID (`ag-<8 lowercase alphanumeric>`).
          pattern: '^ag-[a-z0-9]{8}$'
          readOnly: true
        projectId:
          type: string
          description: Owning project ID.
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Agent name. Unique per project; trimmed on create/update. A 409 is
            returned on collisions with the `(projectId, name)` index.
        description:
          type: string
          nullable: true
        role:
          type: string
          description: Functional role label (free-form, e.g. `analyst`, `researcher`).
        goal:
          type: string
          nullable: true
          description: |
            High-level goal statement for the agent (free-form). Distinct
            from `role` and `systemPrompt`; intended for UI display and to be
            optionally appended to the runtime system prompt by future
            agent-service work.
        systemPrompt:
          type: string
          description: System prompt the agent runs with.
        modelId:
          type: string
          nullable: true
          description: |
            Specific model ID to bind the agent to. At least one of `modelId`
            or `modelClass` must be set on create. On update, both cannot be
            cleared simultaneously.
        modelClass:
          type: string
          nullable: true
          description: |
            Functional model class (e.g. `reasoning`, `balanced`, `fast`,
            `code`). Resolved to a concrete model at runtime when `modelId`
            is absent.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          nullable: true
          description: Primary-model temperature (the legacy flat column).
        maxTokens:
          type: integer
          minimum: 1
          nullable: true
          description: Primary-model max tokens (the legacy flat column).
        topP:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Primary-model nucleus-sampling parameter.
        topK:
          type: integer
          minimum: 0
          maximum: 1000
          nullable: true
          description: Primary-model top-K sampling parameter.
        fallbackModelIds:
          type: array
          default: []
          items:
            type: string
          description: |
            Ordered list of model IDs to fail over to when the primary model
            errors. Persisted but not yet honored by the agent-service
            runtime.
        fallbackModelParams:
          allOf:
            - $ref: '#/components/schemas/ModelParams'
          nullable: true
          description: Generation parameters applied to every fallback model.
        mcpServerIds:
          type: array
          default: []
          items:
            type: string
          description: |
            Project-scoped MCP server ids the agent can call. Servers in
            `error` status are filtered out of the read-time
            `_resolvedMCPServers` map.
        mcpServerConfig:
          type: object
          nullable: true
          description: |
            Per-server overrides keyed by MCP server id. Used to scope
            permissions and tool access for this agent.
          additionalProperties:
            $ref: '#/components/schemas/AgentMCPServerOverride'
        knowledgeBaseIds:
          type: array
          default: []
          items:
            type: string
            pattern: '^kb[a-z0-9]{8}$'
          description: Knowledge base ids the agent reads from at retrieval time.
        ragConfig:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/AgentRagConfig'
          description: >-
            Per-knowledge-base RAG config, keyed by knowledgeBaseId. Strict 1:1
            with `knowledgeBaseIds`: every attached KB must have an entry and no
            orphan keys are allowed. Omit / null / {} only when no KBs are
            attached.
        requirements:
          allOf:
            - $ref: '#/components/schemas/AgentRequirements'
          nullable: true
          description: |
            Declarative KB / MCP placeholders the agent expects but hasn't
            been bound to concrete ids yet. Invisible to the runtime —
            placeholders never enter `knowledgeBaseIds` / `mcpServerIds`.
        datasetIds:
          type: array
          readOnly: true
          default: []
          items:
            type: string
          description: |
            Deprecated — accepted on the request body for backwards
            compatibility but stripped before persistence. Use
            `knowledgeBaseIds` for retrieval and pipeline-level wiring for
            other dataset access.
          deprecated: true
        artifactStoreIds:
          type: array
          default: []
          items:
            type: string
          description: |
            Artifact store ids auto-attached on every invocation. Agents may
            additionally attach stores at runtime via the `artifact.attach`
            MCP tool; the effective set is the union, filtered by ACL.
        outcomeSchema:
          type: object
          nullable: true
          additionalProperties: true
          deprecated: true
          description: |
            Deprecated and no longer consumed by the structured-output
            feature. New integrations should use the `structuredOutput`
            card (`responseFormat` + `outputSchema`) instead.
        outcomeDescription:
          type: string
          nullable: true
          deprecated: true
        memoryType:
          type: string
          enum: [none, conversation, sliding_window]
          default: conversation
          readOnly: true
          deprecated: true
          description: |
            Deprecated — server-derived from `memoryContext` on save (kept
            populated for agent-service back-compat until the legacy
            runtime is retired). Clients should NOT set this field;
            config-service overwrites whatever the client sends from the
            normalized `memoryContext`. Returned on reads.
        memoryConfig:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryConfig'
          readOnly: true
          deprecated: true
        guardrails:
          $ref: '#/components/schemas/AgentGuardrails'
        outputResponse:
          $ref: '#/components/schemas/AgentOutputResponse'
        structuredOutput:
          $ref: '#/components/schemas/AgentStructuredOutput'
        memoryContext:
          $ref: '#/components/schemas/AgentMemoryContext'
        retries:
          $ref: '#/components/schemas/AgentRetriesConfig'
        rateLimiting:
          $ref: '#/components/schemas/AgentRateLimitingConfig'
        functionChoiceBehavior:
          $ref: '#/components/schemas/FunctionChoiceBehavior'
        terminationStrategy:
          $ref: '#/components/schemas/TerminationStrategy'
        labels:
          type: array
          default: []
          items:
            type: string
          description: Free-form labels for filtering / display.
        status:
          type: string
          enum: [Healthy, Unhealthy]
          default: Healthy
          description: |
            Health status of the agent. Surfaced as a simple `Healthy` /
            `Unhealthy` pill in the GUI. Lifecycle detail (draft / preview /
            deploying / deployed / failed / ...) is tracked separately on
            `deploymentStatus`. Update via the regular `PUT /agents/{id}`
            (alongside config edits) or the dedicated
            `PUT /agents/{id}/status` endpoint.
        statusMessage:
          type: string
          nullable: true
          description: |
            Human-readable detail accompanying `status` / `deploymentStatus`
            (e.g. the reason an agent is `Unhealthy`, or the failure detail
            when `deploymentStatus='failed'`).
        deploymentStatus:
          type: string
          enum: [draft, preview, not_deployed, deploying, deployed, failed, terminating, terminated]
          default: not_deployed
          description: |
            Deployment lifecycle, tracked separately from `status` so the
            deployment workflow can publish progress without overwriting
            agent configuration state.
        _resolvedMCPServers:
          type: object
          readOnly: true
          description: |
            Read-time map of effective MCP servers for this agent (project
            servers attached via `mcpServerIds` plus any platform-scoped
            auto-attached servers). Servers in `error` status are filtered
            out. Only present on the `GET /agents/{id}` response.
          additionalProperties:
            $ref: '#/components/schemas/AgentResolvedMCPServer'
        model:
          allOf:
            - $ref: '#/components/schemas/ModelSummary'
          nullable: true
          readOnly: true
          description: |
            Primary model resolved from `modelId` at read time. `null` when
            `modelId` is unset or the referenced model has been deleted.
            Computed by the config-service; ignored on writes.
        fallbackModels:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ModelSummary'
          description: |
            Fallback models resolved from `fallbackModelIds[]` in order.
            Unknown ids are skipped. Computed by the config-service;
            ignored on writes.
        associatedResources:
          allOf:
            - $ref: '#/components/schemas/AgentAssociatedResources'
          readOnly: true
        dependentsSummary:
          $ref: '#/components/schemas/DependentsSummary'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    AgentRagConfig:
      type: object
      description: |
        Retrieval-augmented-generation tuning for a single knowledge base.
        Used as the value type of the agent's `ragConfig` map, keyed by
        `knowledgeBaseId` (strict 1:1 with `knowledgeBaseIds`).
      required:
        - topK
        - similarityThreshold
        - searchMode
      properties:
        topK:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of chunks to retrieve per query.
        similarityThreshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Minimum similarity score (0-1) for a chunk to be returned.
        searchMode:
          type: string
          enum: [semantic, hybrid, fts]
          description: Retrieval mode passed through to the kb-retrieval-service.
        rerankingEnabled:
          type: boolean
          description: |
            When true, asks the kb-retrieval-service to rerank candidates
            before returning. Persisted on the agent row; consumer wiring is
            tracked separately.
        similarityThresholdEnabled:
          type: boolean
          description: |
            When true, `similarityThreshold` is applied as a filter; when
            false the threshold is ignored even if set. Persisted on the
            agent row; consumer wiring is tracked separately.

    AgentResourceRequirement:
      type: object
      description: |
        Declarative placeholder for a KB / MCP server the agent expects
        but hasn't been bound to a concrete id yet. Lives on
        `Agent.requirements`. Stored verbatim — placeholders NEVER enter
        `knowledgeBaseIds` / `mcpServerIds`, so runtime KB / MCP
        resolution is unaffected.
      additionalProperties: false
      required:
        - id
        - label
        - description
        - required
      properties:
        id:
          type: string
          format: uuid
          description: |
            RFC-4122 UUID. Unique within its containing list
            (`knowledgeBases` or `mcpServers`); cross-list collisions
            are allowed.
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Display label shown in the agent's requirements list.
            Leading / trailing whitespace is trimmed on save.
        description:
          type: string
          maxLength: 1000
          description: Free-form description of what this resource should provide.
        required:
          type: boolean
          description: |
            Hard requirement — when true, the agent cannot transition to
            `deploymentStatus='deployed'` until this placeholder is
            resolved to a concrete attachment.

    AgentRequirements:
      type: object
      description: |
        Unresolved resource requirements grouped by kind. Each list
        holds `AgentResourceRequirement` entries with unique `id`s
        within the list. An absent list and an empty list are
        equivalent — both mean "no placeholders of that kind".
      additionalProperties: false
      properties:
        knowledgeBases:
          type: array
          items:
            $ref: '#/components/schemas/AgentResourceRequirement'
          description: KB placeholders awaiting resolution to a concrete `knowledgeBaseId`.
        mcpServers:
          type: array
          items:
            $ref: '#/components/schemas/AgentResourceRequirement'
          description: MCP-server placeholders awaiting resolution to a concrete `mcpServerId`.

    AgentMemoryConfig:
      type: object
      description: |
        Memory and context-management tuning. See
        `docs/design/agent-service-context-management.md`.
      properties:
        windowSize:
          type: integer
          minimum: 1
          description: Backwards-compat knob for `memoryType=sliding_window`.
        contextStrategy:
          type: string
          enum: [trim, summarize, hybrid, sliding_window_strict, none]
          description: How to handle history that overflows the model context window.
        summaryModel:
          type: string
          description: |
            Model id used when `contextStrategy` is `summarize` or `hybrid`.
            Defaults to a cheap provider-picked model.
        verbatimTurns:
          type: integer
          minimum: 0
          description: Number of recent user-to-user turns kept verbatim before summarization.
        toolRoundReservation:
          type: integer
          minimum: 0
          description: Tokens reserved for in-turn tool-call rounds.
        outputReservation:
          type: integer
          minimum: 0
          description: Tokens reserved for the model's response.
        safetyBufferPct:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Percentage of the context window held back as a safety buffer.
        summaryRefreshEveryTurns:
          type: integer
          minimum: 1
          description: Cadence (in turns) for background summary refresh.

    AgentGuardrails:
      type: object
      description: |
        Unified agent guardrails (mirrors the runtime `GuardrailSection`):
        optional suite settings and per-stage lean rule references.
        config-service stores and returns this as-is; agent-service resolves
        each `guardrail_id` against `guardrails_catalog`.
      properties:
        enabled:
          type: boolean
        fail_open:
          type: boolean
        log_blocked_requests:
          type: boolean
        input_guardrails:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRule'
        output_guardrails:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRule'
        tool_guardrails:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRule'

    AgentMCPServerOverride:
      type: object
      description: Per-MCP-server override for an agent.
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
        rateLimit:
          type: integer
          minimum: 0
          description: Requests-per-minute cap (0/unset means inherit server default).
        allowedTools:
          type: array
          items:
            type: string
          description: |
            Allow-list of tool names from this MCP server the agent may call.
            When absent the agent inherits the server's default tool set.

    AgentResolvedMCPServer:
      type: object
      readOnly: true
      description: |
        Read-only snapshot of one effective MCP server attachment for an
        agent, materialized by the config-service when serving
        `GET /agents/{id}`.
      properties:
        name:
          type: string
        litellmServerName:
          type: string
          nullable: true
        litellmServerId:
          type: string
          nullable: true
