                $ref: '#/components/schemas/Workspace'
        '404':
          description: Workspace not found
  /config/api/v1/projects/{projectId}/workspaces/{id}/token:
    put:
      summary: Update workspace token
      tags:
      - Workspaces
      description: Updates the workspace access token (e.g. for Jupyter server)
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          description: Workspace not found
  /config/api/v1/internal/workspaces/{id}/status:
    put:
      summary: Update workspace status (internal)
      tags:
      - Internal
      description: Used by the workspace orchestrator to report workspace status changes
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - new
                  - creating
                  - running
                  - stopping
                  - stopped
                  - error
                endpoint:
                  type: string
                podName:
                  type: string
                deploymentId:
                  type: string
                errorMessage:
                  type: string
      responses:
        '200':
          description: Status updated
        '404':
          description: Workspace not found
  /config/api/v1/workspaces:
    get:
      summary: Query workspaces for management
      tags:
      - Internal
      description: Used by the workspace orchestrator to poll for workspaces to manage
        (filter by status, deploymentId, deploymentType)
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses (e.g. new,creating,stopping)
      - in: query
        name: deploymentId
        schema:
          type: string
      - in: query
        name: deploymentType
        schema:
          type: string
        description: Must be "nemo"
      responses:
        '200':
          description: List of workspaces matching the query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
components:
  schemas:
    Connector:
      type: object
      required:
      - name
      - description
      - type
      - connectionInfo
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - filestore
          - objectstore
          - database
          - stream
        connectionInfo:
          type: object
        authInfo:
          type: object
        protocol:
          type: string
          enum:
          - NFS
          - SMB
    Model:
      type: object
      description: 'A model registration in a project. Remote-provider models are
        also

        registered with the Bifrost LLM gateway when it is enabled; that

        registration metadata is mirrored in `rateCardOverride._gateway` and

        the routable id is captured in `gatewayModelId`.

        '
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-assigned UUID. Stable across renames.
        projectId:
          type: string
          readOnly: true
          description: Project that owns the model. Sourced from the URL on create.
        name:
          type: string
          description: Unique (per project) human/programmatic identifier.
        displayName:
          type: string
        provider:
          type: string
          enum:
          - openai
          - openai_compatible
          - aws_bedrock
          - azure
          - google
          - local
          description: Upstream provider key. Drives how credentials and endpoints
            are interpreted.
        providerModelId:
          type: string
          description: 'Model id as known by the provider, e.g. `gpt-4o-mini`,

            `anthropic.claude-3-5-sonnet-20241022-v2:0`. Used for routing

            and for looking up static catalog metadata.

            '
        providerDeploymentName:
          type: string
          description: 'Upstream deployment/inference name when distinct from

            `providerModelId`. For gateway providers that expose a deployment

            routing map (e.g. Bifrost azure_key_config.deployments), this is the

            upstream id Bifrost forwards to. When omitted the gateway falls back

            to identity routing.

            '
        gatewayModelId:
          type: string
          readOnly: true
          description: 'Ready-to-send model id for Bifrost, computed at registration

            time as `<bifrost-provider>/<providerModelId>` (e.g.

            `azure/gpt-4o-mini-model`). Consumed verbatim by callers so

            the provider prefix lives in config, not in each runtime hop.

            '
        credentialId:
          type: string
          format: uuid
          description: 'Reference to a project `Credential` for remote providers.

            Required when the LLM gateway is enabled and `provider` is

            one of `openai`, `openai_compatible`, `aws_bedrock`, `azure`,

            `google`.

            '
        modelType:
          type: string
          enum:
          - llm
          - embedding
        modelClass:
          type: string
          description: Functional classification (e.g. `reasoning`, `balanced`, `fast`,
            `code`).
        rateCardOverride:
          type: object
          description: 'Free-form pricing/rate overrides. The server adds a

            `_gateway` sub-object reflecting Bifrost registration

            (`gatewayProvider`, `keyName`, `keyId`, `bifrostTeamId`,
            `bifrostVirtualKeyId`)

            after a successful create.

            '
        model_info:
          type: object
          properties:
            architecture:
              type: string
            base_model:
              type: string
            variant:
              type: string
            parameters:
              type: string
            quantization:
              type: string
            size:
              type: number
        endpoint:
          type: string
          description: Provider endpoint URL (e.g. Ollama server URL). Required for the `ollama` provider
            when the LLM gateway is enabled.
        auth:
          type: object
          description: Legacy inline auth payload. Prefer `credentialId`.
          properties:
            access_token:
              type: string
            secret_key:
              type: string
        limits:
          type: object
          properties:
            tpm:
              type: number
            timeout:
              type: number
            stream_timeout:
              type: number
            max_retries:
              type: number
        contextWindow:
          type: integer
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`.
            Populated on `GET /models/{id}`.
        maxOutputTokens:
          type: integer
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`.
            Populated on `GET /models/{id}`.
        supportsExtendedOutput:
          type: boolean
          readOnly: true
          description: Static catalog metadata for `(provider, providerModelId)`.
            Populated on `GET /models/{id}`.
        dependentsSummary:
          allOf:
          - $ref: '#/components/schemas/DependentsSummary'
          readOnly: true
          description: 'Per-row dependents summary returned on `GET /models` unless
            the

            caller opts out via `include=dependentsSummary=false`. Counts

            entities (agents, agent teams, knowledge bases, ...) that

            reference this model.

            '
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - name
    CreateModelRequest:
      type: object
      description: 'Payload accepted by `POST /api/v1/projects/{projectId}/models`.
        Any

        field marked `readOnly` on the `Model` schema is ignored on input.

        '
      required:
      - name
      properties:
        name:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum:
          - openai
          - openai_compatible
          - aws_bedrock
          - azure
          - google
          - local
        providerModelId:
          type: string
        providerDeploymentName:
          type: string
        credentialId:
          type: string
          format: uuid
        modelType:
          type: string
          enum:
          - llm
          - embedding
        modelClass:
          type: string
        endpoint:
          type: string
        model_info:
          $ref: '#/components/schemas/ModelInfo'
        auth:
          $ref: '#/components/schemas/ModelAuth'
        limits:
          $ref: '#/components/schemas/ModelLimits'
        rateCardOverride:
          type: object
    UpdateModelRequest:
      type: object
      description: 'Payload accepted by `PUT /api/v1/projects/{projectId}/models/{id}`.

        All fields are optional and only the provided ones are written;

        credential/provider/endpoint changes are *not* re-propagated to the

        gateway — delete and recreate the model for those.

        '
      properties:
        name:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum:
          - openai
          - openai_compatible
          - aws_bedrock
          - azure
          - google
          - local
        providerModelId:
          type: string
        providerDeploymentName:
          type: string
        gatewayModelId:
          type: string
        credentialId:
          type: string
          format: uuid
        modelType:
          type: string
          enum:
          - llm
          - embedding
        modelClass:
          type: string
        endpoint:
          type: string
        model_info:
          $ref: '#/components/schemas/ModelInfo'
        auth:
          $ref: '#/components/schemas/ModelAuth'
        limits:
          $ref: '#/components/schemas/ModelLimits'
        rateCardOverride:
          type: object
    ModelInfo:
      type: object
      properties:
        architecture:
          type: string
        base_model:
          type: string
        variant:
          type: string
        parameters:
          type: string
        quantization:
          type: string
        size:
          type: number
    ModelAuth:
      type: object
      properties:
        access_token:
          type: string
        secret_key:
          type: string
    ModelLimits:
      type: object
      properties:
        tpm:
          type: number
        timeout:
          type: number
        stream_timeout:
          type: number
        max_retries:
          type: number
    ModelHistory:
      type: object
      description: A single immutable snapshot of a `Model` taken on every successful
        create/update.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entityId:
          type: string
          format: uuid
          description: UUID of the model this snapshot belongs to.
        version:
          type: integer
          description: Monotonically increasing version number per model.
        data:
          $ref: '#/components/schemas/Model'
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string
          nullable: true
        op:
          type: string
          nullable: true
          description: Operation that produced the snapshot (e.g. `create`, `update`,
            `restore`).
      required:
      - entityId
      - version
      - data
    ListAvailableModelsRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - openai
          - openai_compatible
          - aws_bedrock
          - azure
          - google
          - local
        credentialId:
          type: string
          format: uuid
          description: Required for remote providers; the secret is resolved server-side.
        type:
          type: string
          enum:
          - llm
          - embedding
          description: Optional filter applied by the adapter.
    ListAvailableModelsResponse:
      type: object
      properties:
        provider:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/ProviderModelEntry'
    ProviderModelEntry:
      type: object
      description: Normalized model item returned by a provider adapter.
      required:
      - id
      - name
      - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - llm
          - embedding
        description:
          type: string
        contextWindow:
          type: integer
        maxOutputTokens:
          type: integer
        supportsExtendedOutput:
          type: boolean
        rateCard:
          type: object
          properties:
            inputPricePerToken:
              type: number
            outputPricePerToken:
              type: number
            currency:
              type: string
        metadata:
          type: object
          additionalProperties: true
    InferRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InferMessage'
        temperature:
          type: number
        maxTokens:
          type: integer
          minimum: 1
          description: Forwarded to the gateway as `max_tokens`.
    InferMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
        content:
          type: string
          minLength: 1
          maxLength: 20000
    InferResponse:
      type: object
      properties:
        response:
          type: string
          description: Concatenated assistant content returned by the gateway.
        latencyMs:
          type: integer
          description: End-to-end gateway round-trip latency measured in the route.
        modelName:
          type: string
          description: Resolved model label as reported by the gateway (falls back
            to `displayName`/`name`).
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            totalTokens:
              type: integer
    DependentItem:
      type: object
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          description: Source entity kind (e.g. `agent`, `agent_team`, `knowledge_base`,
            `mcp_server`).
        id:
          type: string
          description: Source entity id.
        name:
          type: string
          nullable: true
          description: Resolved display name; `null` when the source row could not
            be looked up.
        relation:
          type: string
          description: Edge label describing how the source references the target.
    DependentsPage:
      type: object
      required:
      - items
      - totalByKind
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DependentItem'
        nextCursor:
          type: string
          nullable: true
          description: Opaque base64url cursor for the next page, or `null` when exhausted.
        totalByKind:
          type: object
          additionalProperties:
            type: integer
          description: Total dependents grouped by source kind. Independent of the
            current page.
    DependentsSummary:
      type: object
      required:
      - total
      - byKind
      properties:
        total:
          type: integer
          description: Total number of edges pointing at this target.
        byKind:
          type: object
          additionalProperties:
            type: integer
          description: Per-kind counts of source entities.
    HasDependentsError:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
          enum:
          - HAS_DEPENDENTS
        dependents:
          $ref: '#/components/schemas/DependentsPage'
    DataSet:
      type: object
      required:
      - name
      - description
      - type
      - kind
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - acquired
          - manual
        originConnector:
          type: string
        kind:
          type: string
          enum:
          - unstructured
          - structured
        bucketName:
          type: string
          readOnly: true
          description: Populated by the server from the project home_dir; ignored
            on create/update requests.
        uploadedFiles:
          type: array
          items:
            type: string
          description: Deprecated - files are now managed through manifests
        filterSpec:
          type: object
        fileProcessors:
          type: array
          items:
            type: string
        sqlQuery:
          type: string
        manifest:
          $ref: '#/components/schemas/DataSetManifest'
          description: Latest manifest (draft or committed) containing files for this
            dataset
    DataSetManifest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dataSetId:
          type: string
          format: uuid
        manifestId:
          type: integer
          description: Monotonically increasing manifest version number
        status:
          type: string
          enum:
          - draft
          - committed
          - deprecated
          description: Manifest status - only draft manifests can be modified
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the manifest
        schema:
          type: object
          additionalProperties: true
          description: Optional schema definition for the manifest
        files:
          type: array
          items:
            $ref: '#/components/schemas/DataSetManifestFile'
          description: List of files in this manifest
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataSetManifestFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        manifestId:
          type: string
          format: uuid
        fileName:
          type: string
          description: Original file name
        uri:
          type: string
          description: S3 URI or file path (e.g., s3://bucket/path/to/file)
        createdAt:
          type: string
          format: date-time
    KnowledgeBase:
      type: object
      required:
      - name
      - sourceDataset
      - embeddingModel
      - chunkSize
      - vectorSize
      - dataType
      properties:
        name:
          type: string
        description:
          type: string
        sourceDataset:
          type: string
        embeddingModel:
          type: string
        chunkSize:
          type: integer
        vectorSize:
          type: integer
        dataType:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    CreateProjectRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
    Bucket:
      type: object
      properties:
        namespace_id:
          type: string
        name:
          type: string
        region:
          type: string
        volume_info:
          type: object
          properties:
            type:
              type: string
            endpoint:
              type: string
            mount_options:
              type: array
              items:
                type: string
            provisioning_mode:
              type: string
              enum:
              - static
              - dynamic
            storage_class_name:
              type: string
            storage_size:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: string
            access_modes:
              type: array
              items:
                type: string
                enum:
                - ReadWriteOnce
                - ReadWriteMany
                - ReadOnlyMany
                - ReadWriteOncePod
              description: 'Access modes for PVC. If not specified, system will automatically
                select

                the best mode based on StorageClass provisioner capabilities.

                Prefers ReadWriteMany for shared access across pods.

                '
        auth_info:
          type: object
          properties:
            type:
              type: string
            username:
              type: string
            password_encrypted:
              type: string
          additionalProperties: true
        protocol:
          type: string
        deployment_config:
          type: object
          properties: {}
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    CreateBucketRequest:
      type: object
      required:
      - name
      - region
      - volume_info
      - auth_info
      - protocol
      properties:
        name:
          type: string
        region:
          type: string
        volume_info:
          type: object
          required:
          - type
          properties:
            type:
              type: string
            endpoint:
              type: string
              description: Required for static provisioning
            mount_options:
              type: array
              items:
                type: string
            provisioning_mode:
              type: string
              enum:
              - static
              - dynamic
              default: static
              description: Volume provisioning mode
            storage_class_name:
              type: string
              description: Required for dynamic provisioning
            storage_size:
              type: string
              description: Required for dynamic provisioning (e.g., "10Gi", "100Gi")
              pattern: ^\d+[KMGTPE]i?$
            parameters:
              type: object
              additionalProperties:
                type: string
              description: Provisioner-specific parameters
            access_modes:
              type: array
              items:
                type: string
                enum:
                - ReadWriteOnce
                - ReadWriteMany
                - ReadOnlyMany
                - ReadWriteOncePod
              description: 'Access modes for PVC. If not specified, system will automatically
                select

                the best mode based on StorageClass provisioner capabilities.

                Prefers ReadWriteMany for shared access across pods.

                '
        auth_info:
          type: object
          required:
          - type
          properties:
            type:
              type: string
            username:
              type: string
            password_encrypted:
              type: string
          additionalProperties: true
        protocol:
          type: string
        deployment_config:
          type: object
          properties: {}
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
    UpdateBucketRequest:
      type: object
      properties:
        region:
          type: string
        volume_info:
          type: object
          properties:
            type:
              type: string
            endpoint:
              type: string
            mount_options:
              type: array
              items:
                type: string
            provisioning_mode:
              type: string
              enum:
              - static
              - dynamic
            storage_class_name:
              type: string
            storage_size:
              type: string
              pattern: ^\d+[KMGTPE]i?$
            parameters:
              type: object
              additionalProperties:
                type: string
        auth_info:
          type: object
          properties:
            type:
              type: string
            username:
              type: string
            password_encrypted:
              type: string
          additionalProperties: true
        protocol:
          type: string
        deployment_config:
          type: object
          properties: {}
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
    MCPServerCatalogEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
          - infrastructure
          - database
          - filesystem
          - development
          - general
        image:
          type: string
        defaultTag:
          type: string
        envSchema:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              required:
                type: boolean
              secret:
                type: boolean
        securityProfile:
          type: string
          enum:
          - strict
          - network-access
        resourcePreset:
          type: string
          enum:
          - small
          - medium
          - large
        requiresRBAC:
          type: boolean
    RuntimeStatusInfo:
      type: object
      properties:
        runtimeStatus:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        restartCount:
          type: integer
        message:
          type: string
    MCPServer:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        name:
          type: string
          description: Alphanumeric with underscores only
        description:
          type: string
        deploymentType:
          type: string
          enum:
          - remote
          - managed
          default: remote
        catalogId:
          type: string
          description: ID of the catalog entry (for managed servers)
        managedConfig:
          type: object
          properties:
            resourcePreset:
              type: string
              enum:
              - small
              - medium
              - large
            envOverrides:
              type: object
              additionalProperties:
                type: string
            volumeSize:
              type: string
        k8sResourceName:
          type: string
        runtimeStatus:
          type: string
          enum:
          - provisioning
          - running
          - failed
          - deleting
        transport:
          type: string
          enum:
          - http
          - sse
          - stdio
        url:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: object
        authType:
          type: string
          enum:
          - none
          - api_key
          - bearer_token
          - basic
          - oauth2
          default: none
        credentialId:
          type: string
          format: uuid
        authorizationUrl:
          type: string
        tokenUrl:
          type: string
        staticHeaders:
          type: object
        extraHeaders:
          type: array
