openapi: 3.0.3
info:
  title: AgentStudio Services API
  version: 1.0.0
  description: Consolidated API documentation for all AgentStudio services (Config
    Service)
servers:
- url: http://localhost:8080
  description: AgentStudio Gateway (local)
- url: https://agentstudio.local:8443
  description: AgentStudio Gateway (local development)
security:
- bearerAuth: []
- oauth2:
  - openid
  - profile
  - email
paths:
  /config/api/v1/setup/status:
    get:
      summary: Get setup status
      tags:
      - Setup
      description: Returns whether Keycloak realm setup is complete and admin console
        URL/credentials
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSetupComplete:
                    type: boolean
                  adminConsoleUrl:
                    type: string
                  adminCredentials:
                    type: object
                    properties:
                      username:
                        type: string
                      password:
                        type: string
                  realmName:
                    type: string
  /config/api/v1/projects:
    post:
      summary: Create project
      tags:
      - Projects
      description: Creates a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List projects
      tags:
      - Projects
      description: Lists all projects
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
  /config/api/v1/projects/{projectId}:
    get:
      summary: Get project
      tags:
      - Projects
      description: Gets a project by ID
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update project
      tags:
      - Projects
      description: Updates a project
      operationId: updateProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete project
      tags:
      - Projects
      description: Deletes a project
      operationId: deleteProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Project deleted
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/projects/{projectId}/members:
    post:
      summary: Add project member
      tags:
      - Projects
      description: Invite a user as a project member
      operationId: addProjectMember
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
                role:
                  type: string
                  enum:
                  - admin
                  - member
                  default: member
      responses:
        '201':
          description: Member added
        '400':
          description: Invalid request
        '404':
          description: Project not found
        '409':
          description: User already a member
    get:
      summary: List project members
      tags:
      - Projects
      operationId: listProjectMembers
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
        '404':
          description: Project not found
  /config/api/v1/projects/{projectId}/members/{userId}:
    delete:
      summary: Remove project member
      tags:
      - Projects
      operationId: removeProjectMember
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Member removed
        '404':
          description: Project or member not found
  /config/api/v1/projects/{projectId}/members/{userId}/role:
    patch:
      summary: Update project member role
      tags:
      - Projects
      operationId: updateProjectMemberRole
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - admin
                  - member
      responses:
        '200':
          description: Role updated
        '400':
          description: Invalid role
        '404':
          description: Project or member not found
  /config/api/v1/projects/{projectId}/service-account:
    post:
      summary: Create or get project service account
      tags:
      - Projects
      description: Creates a Keycloak client (service account) for the project; idempotent
      operationId: createProjectServiceAccount
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Service account created
        '200':
          description: Service account already exists
        '404':
          description: Project not found
    get:
      summary: Get project service account
      tags:
      - Projects
      operationId: getProjectServiceAccount
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Service account (includes clientSecret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: string
                  clientId:
                    type: string
                  clientSecret:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '404':
          description: Project or service account not found
  /config/api/v1/projects/{projectId}/buckets:
    post:
      summary: Create bucket
      tags:
      - Buckets
      description: Registers a new bucket in a project
      operationId: createBucket
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bucket already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List buckets
      tags:
      - Buckets
      description: Lists all buckets in a project
      operationId: listBuckets
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bucket'
  /config/api/v1/projects/{projectId}/buckets/{bucketName}:
    get:
      summary: Get bucket
      tags:
      - Buckets
      description: Gets a bucket by name
      operationId: getBucket
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bucket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update bucket
      tags:
      - Buckets
      description: Updates a bucket
      operationId: updateBucket
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete bucket
      tags:
      - Buckets
      description: Deletes a bucket
      operationId: deleteBucket
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Bucket deleted
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/projects/{projectId}/buckets/{bucketName}/health:
    get:
      summary: Get bucket health
      tags:
      - Health
      description: Gets health status for a bucket across all deployments
      operationId: getBucketHealth
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bucket health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket_health:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketHealth'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/deployments:
    post:
      summary: Register deployment
      tags:
      - Deployments
      description: Registers a new regional deployment
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: Deployment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '200':
          description: Deployment updated (re-registration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List deployments
      tags:
      - Deployments
      description: Lists all registered deployments
      operationId: listDeployments
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
  /config/api/v1/deployments/{deploymentId}:
    get:
      summary: Get deployment
      tags:
      - Deployments
      description: Gets a deployment by ID
      operationId: getDeployment
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deployment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update deployment
      tags:
      - Deployments
      description: Updates a deployment
      operationId: updateDeployment
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
      responses:
        '200':
          description: Updated deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Deregister deployment
      tags:
      - Deployments
      description: Deregisters a deployment
      operationId: deleteDeployment
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deployment deregistered
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/deployments/{deploymentId}/buckets:
    get:
      summary: Get deployment buckets
      tags:
      - Deployments
      description: Gets bucket assignments for a deployment with role information
      operationId: getDeploymentBuckets
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: integer
        description: Config version for incremental updates
      responses:
        '200':
          description: Deployment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigResponse'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/deployments/{deploymentId}/config:
    get:
      summary: Get deployment config
      tags:
      - Deployments
      description: Gets full deployment configuration
      operationId: getDeploymentConfig
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: integer
        description: Config version for incremental updates
      responses:
        '200':
          description: Deployment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigResponse'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/buckets/{projectId}/{bucketName}/routing:
    get:
      summary: Get bucket routing
      tags:
      - Deployments
      description: Gets routing information for a bucket (all deployments serving
        it)
      operationId: getBucketRouting
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: bucketName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Routing information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketRoutingResponse'
        '404':
          description: Bucket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/storage-classes:
    get:
      summary: List storage classes
      tags:
      - StorageClasses
      description: Lists all available StorageClasses aggregated from active deployments
      operationId: listStorageClasses
      responses:
        '200':
          description: List of available StorageClasses
          content:
            application/json:
              schema:
                type: object
                properties:
                  storage_classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageClass'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/deployments/{deploymentId}/metrics:
    post:
      summary: Submit metrics
      tags:
      - Health
      description: Submits metrics from a regional deployment
      operationId: submitMetrics
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metrics'
      responses:
        '200':
          description: Metrics accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/deployments/{deploymentId}/health:
    post:
      summary: Report health
      tags:
      - Health
      description: Reports health status from a regional deployment
      operationId: reportHealth
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthReport'
      responses:
        '200':
          description: Health report accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /config/api/v1/projects/{projectId}/connectors:
    get:
      summary: List connectors
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: skip
        schema:
          type: integer
          default: 0
      - in: query
        name: field
        schema:
          type: string
      - in: query
        name: value
        schema:
          type: string
      - in: query
        name: nameRegex
        schema:
          type: string
      responses:
        '200':
          description: List of connectors
    post:
      summary: Create a connector
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
      responses:
        '201':
          description: Created
  /config/api/v1/projects/{projectId}/connectors/{id}:
    get:
      summary: Get connector by ID
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Connector
        '404':
          description: Not found
    put:
      summary: Update connector by ID
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
    delete:
      summary: Delete connector by ID
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /config/api/v1/projects/{projectId}/connectors/{id}/history:
    get:
      summary: Get connector version history
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of version history entries
        '404':
          description: Not found
  /config/api/v1/projects/{projectId}/connectors/{id}/restore-version:
    post:
      summary: Restore connector to a previous version
      tags:
      - Connectors
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: number
      responses:
        '200':
          description: Connector restored
        '404':
          description: Not found
  /config/api/v1/projects/{projectId}/datasets:
    get:
      summary: List datasets
      tags:
      - DataSets
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
      - in: query
        name: skip
        schema:
          type: integer
          default: 0
      - in: query
        name: field
        schema:
          type: string
      - in: query
        name: value
        schema:
          type: string
      - in: query
        name: nameRegex
        schema:
          type: string
      - in: query
        name: includeCatalog
        schema:
          type: boolean
          default: false
        description: Include catalog table metadata in response
      - in: query
        name: includeManifest
        schema:
          type: boolean
          default: false
        description: Deprecated - use includeCatalog instead. Included for backward
          compatibility.
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSet'
    post:
      summary: Create a dataset
      tags:
      - DataSets
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSet'
      responses:
        '201':
          description: Dataset created. If uploadedFiles are provided, a draft manifest
            is automatically created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
  /config/api/v1/projects/{projectId}/datasets/{id}:
    get:
      summary: Get dataset by ID
      tags:
      - DataSets
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dataset with latest manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
        '404':
          description: Not found
    put:
      summary: Update dataset by ID
      tags:
      - DataSets
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSet'
      responses:
        '200':
          description: Dataset updated. If uploadedFiles are provided, existing draft
            manifest is committed and a new draft manifest is created.
          content:
            application/json:
              schema:
