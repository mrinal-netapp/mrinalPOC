      description: Enter your JWT token obtained from Keycloak. You can get a token
        by logging into the GUI and copying the token from browser developer tools,
        or by using the OAuth2 flow below.
    oauth2:
      type: oauth2
      description: OAuth2 authentication via Keycloak. Click Authorize and login with
        your credentials.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.agentstudio.local:8443/realms/nemo/protocol/openid-connect/auth
          tokenUrl: https://auth.agentstudio.local:8443/realms/nemo/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect scope
            profile: User profile information
            email: User email address
