[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service-maf"
version = "0.1.0"
description = "A pluggable, protocol-agnostic agent framework with multi-framework support"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "websockets>=13.0",
    # LLM Gateway (httpx-based BifrostClient; litellm SDK retained during transition)
    "litellm>=1.50.0",  # TODO: remove once all litellm SDK references are fully migrated to BifrostClient
    # MCP
    "mcp>=1.0.0",
    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    # Utilities
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    # In-process TTL caches for the remote-config layer
    # (see src/agent_service_maf/config/remote_loader.py).
    "cachetools>=5.3.0",
    # Guardrails (Task 003) — light deps used by catalog guardrails:
    #   py3langid: language allowlist (bundled Naive Bayes model, no download)
    #   rapidfuzz: optional similarity path in system_prompt_leakage
    "py3langid>=0.3.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    # Pure-Python Redis surrogate used by tests/unit/test_redis_session_store.py
    # and tests/unit/test_redis_task_store.py. Pulls in redis-py transitively,
    # so the [redis] extra is not required just to collect these tests.
    "fakeredis>=2.20.0",
]

# Note: the observability SDK (`agentstudio-observability-client-runtime`,
# importable as `observability_client_runtime`) is intentionally NOT declared
# here. It is not published to any package index — it ships in-repo at
# `src/common-py/observability/observability-client` and is installed directly:
#   - deploy/Dockerfile          (builder stage: pip install the copied source)
#   - project.json `build` target (installs it before the app package)
#   - Local dev: pip install ../../common-py/observability/observability-client
# When absent (e.g. a bare `pip install -e .` for a quick unit-test run), the
# import in src/agent_service_maf/interface_layer/api.py degrades gracefully to
# a structlog-only fallback (JSON logs + secret redaction, no OTel/metrics).
# Microsoft Agent Framework (AF) — the production agent framework. Required for
# the `maf` adapter (src/agent_service_maf/framework/maf/), which is the default
# and only LLM-backed framework (`echo` is a dependency-free test adapter).
# `agent-framework-core` carries the core abstractions (BaseChatClient, Agent,
# ChatResponse/Update), the function-invocation layer, and WorkflowBuilder —
# enough for the custom Bifrost ChatClient + single-agent + tool calling.
# `agent-framework-orchestrations` adds the high-level multi-agent builders
# (Sequential / Concurrent / GroupChat / Handoff / Magentic). Provider
# sub-packages (foundry, etc.) are added only if a specific integration is required.
agent-framework = [
    "agent-framework-core>=1.9.0",
    # Versioned independently from core (1.0.0 line); compatible with core 1.9.0.
    "agent-framework-orchestrations>=1.0.0",
    # The orchestration runtime serializes messages via google.protobuf without
    # pinning it; pin it here so multi-agent orchestrations (sequential /
    # concurrent / handoff / group_chat / magentic) are self-sufficient.
    "protobuf>=4.25,<6",
]
# Task 004 — secret leakage guardrail. Lightweight regex plugin pack (no ML);
# the `secret_leakage` guardrail imports detect-secrets lazily and raises
# ConfigurationError if this extra is absent while the guardrail is enabled.
# Installed in the Docker image (see deploy/Dockerfile).
guardrails-secrets = [
    "detect-secrets>=1.5.0",
]
# Redis-backed session store. Required for any multi-process / multi-replica
# deployment because the default ``memory`` backend keeps sessions in a
# process-local dict — two uvicorn workers (the production default) cannot
# see each other's sessions, so GET /sessions/{id} and mid-conversation
# replay would intermittently 404 / lose history. Set
# ``AGENT_MEMORY__STORAGE_BACKEND=redis`` to opt in.
redis = [
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
agent-server = "agent_service_maf.interface_layer.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service_maf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
# Measure the FIRST-PARTY package only. Without this, `pytest --cov` (with no
# explicit target) measures every imported module — including the third-party
# `agent_framework` SDK in site-packages — which drags the reported total down
# to a misleading ~39% instead of the real ~86% for our code.
source = ["agent_service_maf"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "agent_framework",
    "agent_framework.*",
    "litellm",
    "litellm.*",
    "mcp",
    "mcp.*",
    "sse_starlette",
    "sse_starlette.*",
    "observability_client_runtime",
    "observability_client_runtime.*",
    "redis",
    "redis.*",
    "cachetools",
    "cachetools.*",
    "detect_secrets",
    "detect_secrets.*",
    "py3langid",
    "py3langid.*",
    "rapidfuzz",
    "rapidfuzz.*",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Pre-existing scaffold files — will be rewritten in future phases
"src/agent_service_maf/interface_layer/protocols/*" = ["ALL"]
"src/agent_service_maf/core/session.py" = ["ALL"]
"src/agent_service_maf/core/service.py" = ["ALL"]
# Tests legitimately diverge from production lint rules:
#   ANN*    Type hints on fixtures / mocks are noise.
#   B017    `pytest.raises(Exception)` is fine for "any error" assertions.
#   B007    Loop control vars are often just for enumerate-style indexing.
#   N801–N818  Test classes / protocol stubs / fixture vars often need non-PEP8 names
#              (e.g. Pydantic models with HTTP-style field names, protocol mocks
#              matching upstream camelCase APIs).
#   SIM117  Nested with-blocks come from pytest mock.patch stacking — flattening
#           them hurts readability.
#   E402    conftest path-manipulation before imports.
"tests/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN003",
    "ANN204",
    "ANN401",
    "B007",
    "B017",
    "N801",
    "N802",
    "N806",
    "N817",
    "N818",
    "SIM117",
    "E402",
    # Long lines in tests are usually string literals (mock payloads,
    # assertion messages, JSON fixtures) where wrapping hurts readability.
    "E501",
]
