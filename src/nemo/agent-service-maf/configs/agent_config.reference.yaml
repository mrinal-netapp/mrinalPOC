# ============================================================================
# REQUEST PAYLOAD EXAMPLES
# ============================================================================
#
# ── Simple invoke (uses default agent) ─────────────────────────────────────
#
#   POST /agents/default/invoke
#   {
#     "input": "What's the weather in NYC?"
#   }
#
# ── Invoke with per-request overrides ──────────────────────────────────────
#
#   POST /agents/default/invoke
#   {
#     "input": "Research the latest AI agent frameworks",
#     "session_id": "sess_abc123",
#     "metadata": {"source": "web-chat"},
#     "config_overrides": {
#       "agent": {
#         "model": "openai/gpt-4o",
#         "temperature": 0.2,
#         "timeout_seconds": 600
#       },
#       "gateway": {
#         "tool_loop": {
#           "max_tool_rounds": 20
#         }
#       },
#       "guardrails": {
#         "enabled": false
#       }
#     }
#   }
#
# ── Fields that CANNOT be overridden per-request ───────────────────────────
#   agent.framework              (set at startup)
#   semantic_kernel              (inner agent definitions; key retained for back-compat)
#   interface.*                  (server-level)
#   mcp.*                        (server-level)
#   mcp_servers.*                (server-level)
#   logging.*                    (server-level)
#   memory.*                     (storage config set at startup)
#
# ============================================================================

# ============================================================================
# ENVIRONMENT VARIABLE REFERENCE
# ============================================================================
#
# Agent:
#   AGENT_AGENT__FRAMEWORK=maf
#   AGENT_AGENT__MODEL=anthropic/claude-sonnet-4-20250514
#   AGENT_AGENT__TEMPERATURE=0.7
#   AGENT_AGENT__MAX_TOKENS=4096
#   AGENT_AGENT__TIMEOUT_SECONDS=300
#
# Interface (host/port driven by uvicorn CLI flags, not env):
#   AGENT_INTERFACE__CORS_ORIGINS=["*"]
#   AGENT_INTERFACE__REQUEST_TIMEOUT_SECONDS=300
#   AGENT_INTERFACE__MAX_CONCURRENT_REQUESTS=50
#   AGENT_INTERFACE__RATE_LIMITING__ENABLED=false
#
# Gateway:
#   AGENT_GATEWAY__URL=http://localhost:4000
#   AGENT_GATEWAY__API_KEY=
#   AGENT_GATEWAY__DEFAULT_MODEL=anthropic/claude-sonnet-4-20250514
#   AGENT_GATEWAY__REQUEST_TIMEOUT_SECONDS=120
#   AGENT_GATEWAY__RETRY_ON_TIMEOUT=true
#   AGENT_GATEWAY__MAX_RETRIES=2
#   AGENT_GATEWAY__TOOL_LOOP__MAX_TOOL_ROUNDS=10
#   AGENT_GATEWAY__USAGE_TRACKING__ENABLED=true
#
# Guardrails:
#   AGENT_GUARDRAILS__ENABLED=true
#   AGENT_GUARDRAILS__FAIL_OPEN=false
#   AGENT_GUARDRAILS__LOG_BLOCKED_REQUESTS=true
#
# MCP:
#   AGENT_MCP__CONNECTION_TIMEOUT_SECONDS=30
#   AGENT_MCP__LAZY_CONNECT=true
#   AGENT_MCP__TOOL_CALL_TIMEOUT_SECONDS=60
#   AGENT_MCP__MAX_TOOL_RETRIES=1
#   AGENT_MCP__RETRY_ON_TIMEOUT=true
#   AGENT_MCP__DISCOVERY_ON_CONNECT=true
#   AGENT_MCP__TOOL_NAME_FORMAT=qualified
#   AGENT_MCP__MAX_CONCURRENT_TOOL_CALLS=5
#
# Streaming:
#   AGENT_STREAMING__ENABLED=true
#   AGENT_STREAMING__TOKEN_CHUNK_SIZE=1
#
# Memory:
#   AGENT_MEMORY__ENABLED=false
#   AGENT_MEMORY__TYPE=conversation
