# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  LOGGING — Structured Logging Configuration                               ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# NOT overridable per-request.
# Env vars: AGENT_LOGGING__LEVEL, AGENT_LOGGING__FORMAT, etc.

logging:
  level: INFO # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: json # json | human
  include_timestamp: true # Include ISO-8601 timestamp

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  STREAMING — Response Streaming Configuration                             ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Controls SSE and WebSocket streaming behaviour.
# Per-request override: Yes (enabled)

streaming:
  enabled: true # Allow streaming responses
  token_chunk_size: 1 # Tokens per SSE/WS chunk (1–100)
  include_usage_in_stream: false # Include token usage in stream events
  include_metadata: true # Include metadata in stream events

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  MEMORY — Conversation Memory Configuration                               ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Controls how conversation history is maintained across requests.
# NOT overridable per-request (set at startup).

memory:
  enabled: false # Enable conversation history tracking
  type: conversation # conversation | long_term | hybrid
  max_history_size: 50 # Max conversation turns to retain (1–1000)
  max_context_tokens: 8192 # Max context window tokens (1–200000)
  summarize_after_turns: 0 # Summarize after N turns (0 = disabled)
  persist_to_db: false # Save to persistent storage
  storage_backend: memory # memory | redis | postgres | mongodb
  ttl_seconds: 3600 # Memory TTL in seconds (0 = forever)

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  ERROR HANDLING — Resilience Configuration                                ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Controls retry and fallback behaviour at the top-level agent.

error_handling:
  max_retries: 2 # Retries for agent-level failures (0–5)
  retry_backoff_seconds: 1 # Initial exponential backoff (seconds)
  max_backoff_seconds: 60 # Maximum backoff cap (seconds)
  timeout_behavior: fail # fail | retry | degrade
  fallback_agent: '' # Agent to fall back to on error (empty = none)
  retry_on_guardrail_block: false # Retry if guardrails block the request

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  ORCHESTRATION PATTERN EXAMPLES                                           ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
# ── Pattern 1: Single Agent ─────────────────────────────────────────────────
# The simplest pattern — one agent handles the entire request.
# Uses type: "single" which bypasses orchestration entirely.
#
#   semantic_kernel:
#     agents:
#       - name: assistant
#         instructions: "You are a helpful general-purpose assistant."
#         model: anthropic/claude-sonnet-4-20250514
#         tools: []
#         mcp_servers: ["filesystem", "web-search"]
#     orchestration:
#       type: single
#
# ── Pattern 2: Sequential Pipeline ──────────────────────────────────────────
# Agents run one after another, each building on the previous output.
# (This is what the main example above demonstrates.)
#
#   semantic_kernel:
#     agents: [researcher, analyst, synthesizer]
