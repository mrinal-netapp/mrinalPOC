# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  INTERFACE — HTTP Server Configuration                                    ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Controls the FastAPI application server. NOT overridable per-request.
# Bind address is driven by uvicorn's --host / --port CLI flags
# (configured in the Dockerfile CMD or the dev `make` target); the
# interface section does not carry host/port any more.

interface:
  cors_origins: # Allowed CORS origins
    - '*'
  request_timeout_seconds: 300 # Max request duration in seconds (min 1)
  max_concurrent_requests: 50 # Concurrent request limit (min 1)

  request_validation:
    max_input_length: 100000 # Max request body size in characters
    require_agent_id: false # Require agent_id in every request
    validate_json_schema: true # Validate request against JSON schema

  rate_limiting:
    enabled: false # Enable rate limiting
    requests_per_minute: 60 # RPM limit (0 = unlimited)
    requests_per_second: 0 # RPS limit (0 = unlimited)
    burst_size: 5 # Allow burst requests above rate
    by_agent_id: true # Apply limits per agent separately
    by_ip: false # Apply limits per client IP

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  GATEWAY — LLM Gateway (Bifrost/LiteLLM) Configuration                   ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# The framework never calls LLM APIs directly — all calls route through the
# gateway proxy. Model routing, failover, rate limiting, cost tracking, and
# provider abstraction are all handled by the gateway (Bifrost/LiteLLM).
#
# Per-request override: Yes (all fields)
# Env vars: AGENT_GATEWAY__URL, AGENT_GATEWAY__API_KEY, etc.

gateway:
  url: 'http://localhost:4000' # Bifrost/LiteLLM proxy URL
  api_key: '' # API key for gateway auth (empty if internal)
  default_model: anthropic/claude-sonnet-4-20250514 # Fallback when neither agent nor inner agent specifies model
  request_timeout_seconds: 120 # Per-LLM-call timeout (1–600)
  retry_on_timeout: true # Retry on timeout
  max_retries: 2 # Max retry attempts (0–5)

  tool_loop:
    max_tool_rounds: 10 # Max LLM↔tool roundtrips (1–100)
    tool_choice: auto # auto | required | none
    allow_parallel_tool_calls: true # Allow LLM to request multiple tools at once
    parallel_execution: true # Execute multiple tool calls concurrently

  usage_tracking:
    enabled: true # Enable local usage tracking
    track_by_model: true # Breakdown usage per model
    track_by_agent: true # Breakdown usage per inner agent name
    history_size: 1000 # Max tracking entries to retain (1–10000)
    cost_calculation_method: passthrough # passthrough (from Bifrost) | local

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  GUARDRAILS — Safety Pipeline Configuration                               ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Three-stage pipeline: Input → Output → Tool
#   Input:  validate/sanitize BEFORE adapter sees the request
#   Output: filter/validate AFTER adapter returns response
#   Tool:   authorize BEFORE each MCP tool call
#
# Guardrails operate at the TOP level (wrapping the entire framework execution),
# not per inner agent. If inner agent "researcher" calls a tool, the tool
# guardrail still applies.
#
# Per-request override: Yes (enabled, fail_open)
# Env vars: AGENT_GUARDRAILS__ENABLED, AGENT_GUARDRAILS__FAIL_OPEN, etc.

guardrails:
  enabled: true # Master switch for all guardrails
  fail_open: false # If true, guardrail errors allow request to proceed
  log_blocked_requests: true # Log requests blocked by guardrails

  input_guardrails:
    - name: input_validator
      enabled: true
      action_on_trigger: block
      config:
        max_length: 10000
        min_length: 1

    - name: prompt_injection
      enabled: true
      action_on_trigger: block
      config:
        patterns:
          - 'ignore previous instructions'
          - 'system prompt'

    - name: pii_masker
      enabled: true
      action_on_trigger: modify
      config:
        mask_email: true
        mask_phone: true
        mask_ssn: true
        mask_cc: true

  output_guardrails:
    - name: content_filter
      enabled: true
      action_on_trigger: block
      config: {}

    - name: pii_masker
      enabled: true
      action_on_trigger: modify
      config:
        mask_email: true
        mask_phone: true
        mask_ssn: true
        mask_cc: true

    - name: output_length
      enabled: true
      action_on_trigger: block
      config:
        max_chars: 50000

  tool_guardrails:
    mode: denylist # allowlist | denylist
    tools: [] # Tool names for the policy
    max_calls_per_request: 20 # Max tool calls per request (1–100)

  # ─── Per-Agent Guardrail Overrides ──────────────────────────────────────
  # Override guardrails for a specific top-level agent_id.
  # Keys match the agent_id in the URL: POST /agents/{agent_id}/invoke
  # agent_overrides:
  #   customer-support:
  #     input_guardrails:
  #       - name: pii_masker
  #         enabled: true
  #         action_on_trigger: modify
  #         config:
  #           mask_email: false
  #           mask_phone: true
  #           mask_ssn: true
  #           mask_cc: true
  #     tool_policy:
  #       mode: allowlist
  #       tools: ["knowledge-base.search", "knowledge-base.get_article"]
  #       max_calls_per_request: 5

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  MCP — Model Context Protocol (Global Settings)                           ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Controls how the framework connects to and manages MCP tool servers.
# Inner agents reference MCP servers by name (e.g., mcp_servers: ["web-search"]).
# NOT overridable per-request (server-level settings).
#
# Env vars: AGENT_MCP__LAZY_CONNECT, AGENT_MCP__TOOL_CALL_TIMEOUT_SECONDS, etc.

mcp:
  connection_timeout_seconds: 30 # Connection timeout per server (1–300)
  lazy_connect: true # true = connect on first use; false = at startup
  tool_call_timeout_seconds: 60 # Per-tool-call execution timeout (1–600)
  max_tool_retries: 1 # Retry count for failed tool calls (0–3)
  retry_on_timeout: true # Retry on tool call timeout
  discovery_on_connect: true # Auto-discover tools when connecting
  tool_name_format: qualified # qualified = server.tool_name; bare = tool_name
  max_concurrent_tool_calls: 5 # Max parallel tool executions (1–20)

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  MCP SERVERS — Individual Server Definitions                              ║
# ╚════════════════════════════════════════════════════════════════════════════╝
# Defined inline under mcp_servers[]. There is no external file option —
# servers travel with each team's JSON config.
# Inner agents reference these by name in their mcp_servers list.
#
# Transport types:
#   stdio:            subprocess via stdin/stdout
#   sse:              HTTP Server-Sent Events
#   streamable-http:  HTTP with streaming
#
# Environment variable interpolation: ${ENV_VAR_NAME}

mcp_servers:
