# StorageClass definitions for PVC-based volume management (Pattern B)
# These StorageClasses are used by Storage Manager to provision PVCs for buckets

---
# NFS StorageClass
# Requires: NFS CSI driver (e.g., csi-driver-nfs)
# Install NFS CSI driver before using this StorageClass:
#   - csi-driver-nfs: https://github.com/kubernetes-csi/csi-driver-nfs
#
# IMPORTANT: This StorageClass mounts EXISTING NFS shares, it does NOT create new storage.
# The NFS server and share path are specified per-PVC via annotations:
#   - nfs.csi.k8s.io/server: <nfs-server-ip-or-hostname>
#   - nfs.csi.k8s.io/share: </path/to/share>
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-storage
  labels:
    app: agentstudio
    component: storage-class
provisioner: nfs.csi.k8s.io  # NFS CSI driver provisioner
parameters:
  server: "10.10.10.10"
  
  # This ensures we mount existing NFS shares, not create new ones
allowVolumeExpansion: true
volumeBindingMode: Immediate  # Can be WaitForFirstConsumer for better pod scheduling
reclaimPolicy: Retain
---
# CIFS/SMB StorageClass
# Requires: SMB CSI driver (csi-driver-smb)
# Install SMB CSI driver before using this StorageClass:
#   https://github.com/kubernetes-csi/csi-driver-smb
#
# IMPORTANT: This StorageClass mounts EXISTING CIFS/SMB shares, it does NOT create new storage.
# The SMB share source is specified per-PVC via annotation:
#   - smb.csi.k8s.io/source: //server/share
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cifs-storage
  labels:
    app: agentstudio
    component: storage-class
provisioner: smb.csi.k8s.io  # SMB CSI driver provisioner
parameters:
  # On Windows, "*.default.svc.cluster.local" could not be recognized by csi-proxy
  source: //smb-server.default.svc.cluster.local/share
  # if csi.storage.k8s.io/provisioner-secret is provided, will create a sub directory
  # with PV name under source
  csi.storage.k8s.io/provisioner-secret-name: smbcreds
  csi.storage.k8s.io/provisioner-secret-namespace: nemo
  csi.storage.k8s.io/node-stage-secret-name: smbcreds
  csi.storage.k8s.io/node-stage-secret-namespace: nemo
allowVolumeExpansion: true
volumeBindingMode: Immediate
reclaimPolicy: Retain
