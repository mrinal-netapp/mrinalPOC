# Pre-prod Azure (AKS): infra -> storage -> deploy.
#
# Deploy is self-contained in this workflow (does NOT call deploy-reusable.yml).
#
# GitHub Environment `azure` (OIDC):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   OIDC subject: repo:<org>/<repo>:environment:azure
#
# Helm deploy settings come from deployments/azure/envs/preprod.yaml:
#   endpoint, containerRegistry.loginServer, resourceGroup, aks.clusterName
#
# Usage:
#   gh workflow run deploy-preprod-azure.yml -f image_tag=1.0.0-rc.1
#   gh workflow run deploy-preprod-azure.yml -f image_tag=1.0.0-rc.1 -f skip_infra_storage=false

name: Deploy Pre-Prod Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to deploy (e.g. 1.0.0-rc.1)"
        required: true
        type: string
      skip_infra_storage:
        description: "Skip infra plan/apply and storage (deploy Helm tiers only)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-preprod-azure
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (azure/preprod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify env yaml exists
        shell: bash -e {0}
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml
          ENV_FILE="deployments/azure/envs/preprod.yaml"
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "::error::Missing $ENV_FILE" >&2
            exit 1
          fi
          ey() { python3 deployments/_lib/env_yaml.py --file "$ENV_FILE" --path "$1"; }
          echo "Using $ENV_FILE (image_tag=${{ inputs.image_tag }})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "  endpoint             : $(ey endpoint)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "  container image repo : $(ey containerRegistry.loginServer)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "  aks cluster          : $(ey aks.clusterName)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "  resource group       : $(ey resourceGroup)" | tee -a "$GITHUB_STEP_SUMMARY"

  infra-plan:
    name: Infra plan (azure/preprod)
    needs: validate
    if: ${{ !inputs.skip_infra_storage }}
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Bicep is available
        run: az bicep install || az bicep version

      - name: Infra plan
        shell: bash -euo pipefail {0}
        run: |
          make infra CLOUD=azure ENV='preprod' ACTION=plan \
            | tee -a "$GITHUB_STEP_SUMMARY"

  infra-apply:
    name: Infra apply (azure/preprod)
    needs: infra-plan
    if: ${{ !inputs.skip_infra_storage }}
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Bicep is available
        run: az bicep install || az bicep version

      - name: Infra apply
        shell: bash -euo pipefail {0}
        run: |
          make infra CLOUD=azure ENV='preprod' ACTION=apply \
            | tee -a "$GITHUB_STEP_SUMMARY"

  storage:
    name: Storage (azure/preprod)
    needs: infra-apply
    if: ${{ !inputs.skip_infra_storage }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Storage (make storage)
        shell: bash -euo pipefail {0}
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml
          make storage CLOUD=azure ENV='preprod' \
            | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (azure/preprod)
    needs: [validate, infra-plan, infra-apply, storage]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (inputs.skip_infra_storage || needs.storage.result == 'success')
    runs-on: [self-hosted, netapp]
    environment: azure
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve cluster from preprod env file
        shell: bash -euo pipefail {0}
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml
          ENV_FILE="deployments/azure/envs/preprod.yaml"
          ey() { python3 deployments/_lib/env_yaml.py --file "$ENV_FILE" --path "$1"; }
          {
            echo "AKS_RESOURCE_GROUP=$(ey resourceGroup)"
            echo "AKS_CLUSTER_NAME=$(ey aks.clusterName)"
          } >> "$GITHUB_ENV"
          echo "AKS: $(ey resourceGroup) / $(ey aks.clusterName)"

      - name: Ensure Azure CLI is installed
        shell: bash -e {0}
        run: |
          if command -v az >/dev/null 2>&1; then
            echo "az already installed: $(az version --only-show-errors --query '"azure-cli"' -o tsv)"
            exit 0
          fi
          echo "Installing Azure CLI via apt..."
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          if [ -z "$SUDO" ]; then
            echo "::error::Azure CLI (az) is not installed and sudo is unavailable on this runner. Bake az into the self-hosted runner image." >&2
            exit 1
          fi
          $SUDO apt-get update -y
          $SUDO apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
          $SUDO install -m 0755 -d /etc/apt/keyrings
          curl -sLS https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | $SUDO tee /etc/apt/keyrings/microsoft.gpg >/dev/null
          $SUDO chmod go+r /etc/apt/keyrings/microsoft.gpg
          AZ_DIST="$(lsb_release -cs)"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ ${AZ_DIST} main" \
            | $SUDO tee /etc/apt/sources.list.d/azure-cli.list >/dev/null
          $SUDO apt-get update -y
          $SUDO apt-get install -y azure-cli

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure unzip is installed
        shell: bash -e {0}
        run: |
          if command -v unzip >/dev/null 2>&1; then exit 0; fi
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update -y && $SUDO apt-get install -y unzip

      - name: Setup kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name:   ${{ env.AKS_CLUSTER_NAME }}
          admin:          'false'
          use-kubelogin:  'true'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Verify cluster access
        shell: bash -e {0}
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide || true

      - name: Install Istio prerequisites
        shell: bash -e {0}
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml
          endpoint="$(python3 deployments/_lib/env_yaml.py --file deployments/azure/envs/preprod.yaml --path endpoint)"
          make istio-prereq ENDPOINT="$endpoint"

      - name: Verify Istio prerequisites
        shell: bash -e {0}
        run: make verify-istio-gateway

      - name: Verify AKS deploy scripts
        shell: bash -euo pipefail {0}
        run: |
          test -f deployments/azure/scripts/aks-edge-helm-sets.sh || { echo "::error::Missing deployments/azure/scripts/aks-edge-helm-sets.sh"; exit 1; }

      - name: Deploy (make deploy)
        shell: bash -euo pipefail {0}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # Env-file mode: ENDPOINT, CONTAINER_IMAGE_REPO, KEYCLOAK_HOSTNAME
          # are read from deployments/azure/envs/preprod.yaml by make deploy.
          # Unset Entra-related env vars so AZURE_TENANT_ID does not look like
          # partial Entra config to helm-identity-install-aks.
          unset KEYCLOAK_ENTRA_APP_CLIENT_ID KEYCLOAK_TENANT_ID \
            KEYCLOAK_ENTRA_GROUP_ADMINS_OBJECTID KEYCLOAK_ENTRA_GROUP_MEMBERS_OBJECTID \
            KEYCLOAK_KV_NAME KEYCLOAK_UAMI_CLIENT_ID KEYCLOAK_HOSTNAME \
            KEYCLOAK_DEPLOY_TARGET || true
          make deploy CLOUD=azure ENV=preprod \
            IMAGE_TAG="$IMAGE_TAG" \
            OBSERVABILITY=1

      - name: Show release status
        if: always()
        shell: bash -e {0}
        run: |
          for ns in database agentstudio-identity agentstudio-platform \
                    agentstudio-llm-gateway agentstudio-services agentstudio-console \
                    agentstudio-workers agentstudio-edge monitoring; do
            echo "--- Releases in $ns ---"
            helm list -n "$ns" 2>/dev/null || true
          done

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          az logout || true
          az account clear || true

  pipeline-status:
    name: Pipeline result
    if: always()
    needs: [validate, infra-plan, infra-apply, storage, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any stage failed
        shell: bash -e {0}
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "${{ needs.validate.result }}" == "success" ]] || fail "Validate failed"
          if [[ "${{ inputs.skip_infra_storage }}" != "true" ]]; then
            [[ "${{ needs.infra-plan.result }}"  == "success" ]] || fail "Infra plan failed"
            [[ "${{ needs.infra-apply.result }}" == "success" ]] || fail "Infra apply failed"
            [[ "${{ needs.storage.result }}"     == "success" ]] || fail "Storage failed"
          else
            echo "Skipped infra + storage (skip_infra_storage=true)"
          fi
          [[ "${{ needs.deploy.result }}" == "success" ]] || fail "Deploy failed"
          echo "All stages succeeded."
