# Local Kubernetes overlay for the workers tier.
# Works on KIND, Docker Desktop, k3d, minikube.
#
# Differences from values-aks.yaml:
#   - ServiceAccounts created explicitly and bound to the existing local/KIND federated UAMIs
#   - Uses nemo-local-shared (hostPath) StorageClass for shared default bucket PVC
#   - Reduced resource requests for local dev
#   - crossNsServices use ExternalName (Istio CRDs not present on local clusters)
#
# Usage: helm upgrade --install ... -f values.yaml -f values-local.yaml

# Redundant with the values.yaml default (now externalName), kept explicit for
# clarity on local dev clusters where Istio ServiceEntry CRDs may be absent.
crossNsServices:
  mode: externalName

global:
  imageRepository: "docker.repo.eng.netapp.com/user/rp29322"
  storageClass: "standard"
  gatewayHttpsPort: "8443"   # KIND can't bind <1024; cloud uses 443 default.
  gatewayHttpPort: "8080"    # Storage-manager DEPLOYMENT_HTTP_ENDPOINT.

# s3gateway owns its own PVC now; disable the legacy standalone PVC.
defaultBucketPvc:
  create: false

dataset-worker:
  serviceAccount:
    create: true
    azureClientId: "83d27bbd-4b2a-4162-97cc-f4a5c7486bb1"
  workloadIdentity:
    enabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "4Gi"

kb-worker:
  serviceAccount:
    create: true
    azureClientId: "977cad45-54d1-4339-ba66-dd58bd4a247a"
  workloadIdentity:
    enabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "4Gi"

connector-worker:
  serviceAccount:
    create: true
    azureClientId: "3dc813b0-7494-4cf4-8128-8bb007ae2ec9"
  workloadIdentity:
    enabled: true
  redisStandalone: true
  env:
    - name: TEMPORAL_ADDRESS
      value: "temporal.agentstudio-platform.svc.cluster.local:7233"
    - name: TEMPORAL_NAMESPACE
      value: "default"
    - name: TASK_QUEUE
      value: "connector-operations"
    - name: MAX_CONCURRENT_ACTIVITIES
      value: "3"
    - name: CONFIG_SERVICE_URL
      value: "http://config-service.agentstudio-services.svc.cluster.local:3000"
    - name: S3_ENDPOINT
      value: "http://s3gateway:7070"
    - name: WORKFLOW_ENGINE_URL
      value: "http://workflow-engine.agentstudio-services.svc.cluster.local:8080"
    - name: ACQ_REDIS_URL
      value: "redis://redis-master.{{ .Values.global.platformNamespace | default \"agentstudio-platform\" }}.svc.cluster.local:6379/3"
    - name: ACQ_REDIS_SENTINEL_URL
      value: ""
    - name: ACQ_REDIS_SENTINEL_MASTER
      value: ""
    - name: ACQ_REDIS_DB
      value: "3"
    - name: ACQ_BATCH_SIZE
      value: "64"
    - name: ACQ_MAX_BATCHES_PER_ACTIVITY
      value: "8"
    - name: ACQ_STREAM_MAXLEN
      value: "50000"
    - name: AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH
      value: "/dev/stdout"
    - name: OTEL_SERVICE_NAME
      value: "connector-worker"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# ── S3 Gateway (moved from agentstudio-platform) ─────────────────────────────
# For Trident-backed clusters (e.g. sks6316), compose values-trident.yaml on
# top to flip s3gateway storage to ontap-nas RWX and authorize the services
# namespace as a shareFromPVC consumer:
#   HELM_EXTRA_ARGS='-f deployments/helm/workers/values-trident.yaml'
s3gateway:
  serviceAccount:
    create: true
    azureClientId: "0e75adb4-c1b9-4ab8-baad-da909f67ee5d"
  workloadIdentity:
    enabled: true
  storage:
    accessMode: ReadWriteOnce   # matches preserved nemo-default-bucket-platform PV
  defaultBucket:
    storageClass: "nemo-local-shared"   # binds to nemo-default-bucket-workers PV (same hostPath as old platform PV)
  image:
    fullImage: "versity/versitygw:latest"  # Pull directly from Docker Hub; avoids corporate registry prefix for local dev
    pullPolicy: IfNotPresent

# ── Storage Manager (moved from agentstudio-services) ────────────────────────
storage-manager:
  serviceAccount:
    create: true
    azureClientId: "259d35d0-7987-44fb-9e01-ad492c2de39e"
  workloadIdentity:
    enabled: true
