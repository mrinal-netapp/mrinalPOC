{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connector-worker.fullname" . }}
  labels:
    {{- include "connector-worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "connector-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "connector-worker.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        # Native Istio sidecar so the `wait-for-temporal` initContainer
        # can reach temporal in the STRICT-mTLS agentstudio-platform
        # namespace.
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 120 }}
      serviceAccountName: {{ include "connector-worker.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nemo-default-bucket
          persistentVolumeClaim:
            claimName: {{ include "nemo.defaultBucketPvcName" . }}
        {{- if .Values.certs.enabled }}
        - name: custom-ca-certs
          secret:
            secretName: {{ .Values.certs.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-temporal
          # See dataset-worker/templates/deployment.yaml for why this
          # uses the worker image + `python -m shared.temporal_readiness`
          # instead of init-tools + `nc -z`. Same race fix.
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ if .Values.global.imagePullPolicy }}{{ .Values.global.imagePullPolicy }}{{ else }}IfNotPresent{{ end }}
          command: ['python', '-m', 'shared.temporal_readiness', 'probe']
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ .Values.temporalHost | default "temporal.agentstudio-platform.svc.cluster.local" }}:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_PROBE_MAX_ATTEMPTS
              value: "90"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: connector-worker
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nemo-default-bucket
              mountPath: /mnt/pvcs/default-nemo
            {{- if .Values.certs.enabled }}
            - name: custom-ca-certs
              mountPath: {{ .Values.certs.mountPath }}
              readOnly: true
            {{- end }}
          env:
            {{- if .Values.certs.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: "{{ .Values.certs.mountPath }}/{{ .Values.certs.certFileName }}"
            - name: SSL_CERT_FILE
              value: "{{ .Values.certs.mountPath }}/{{ .Values.certs.certFileName }}"
            {{- end }}
            {{- range .Values.env }}
            {{- if and $.Values.redisStandalone (or (eq .name "ACQ_REDIS_SENTINEL_URL") (eq .name "ACQ_REDIS_SENTINEL_MASTER")) }}
            {{- else }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ tpl (.value | default "") $ | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ printf "%s/protocol/openid-connect/token" (.Values.keycloakInternalIssuer | default "http://keycloak.agentstudio-identity.svc.cluster.local:8080/realms/nemo") | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3gatewayCredentialsSecretName | default "nemo-s3gateway-credentials" }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3gatewayCredentialsSecretName | default "nemo-s3gateway-credentials" }}
                  key: secret-key
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: connector-worker-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: connector-worker-client-secret
            - name: TEMPORAL_GRACEFUL_SHUTDOWN_TIMEOUT
              value: {{ .Values.gracefulShutdownTimeout | default "90" | quote }}
            - name: NEMO_DEFAULT_STORE_ROOT
              value: "/mnt/pvcs/default-nemo"
{{- end }}
