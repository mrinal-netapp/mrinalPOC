{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemo.s3gatewayCredentialsName" . }}
  labels:
    {{- include "s3gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.credentials.accessKey | default "testuser" | quote }}
  secret-key: {{ .Values.credentials.secretKey | default "secret" | quote }}
{{- end }}
