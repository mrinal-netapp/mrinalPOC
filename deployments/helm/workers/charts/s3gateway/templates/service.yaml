{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemo.s3gatewayServiceName" . }}
  labels:
    {{- include "s3gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: s3
      protocol: TCP
      appProtocol: tcp
      name: tcp-s3
  selector:
    {{- include "s3gateway.selectorLabels" . | nindent 4 }}
{{- end }}
