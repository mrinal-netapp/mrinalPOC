{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eval-worker.fullname" . }}
  labels:
    {{- include "eval-worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "eval-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eval-worker.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        # Native Istio sidecar so the `wait-for-temporal` initContainer
        # (`nc -z temporal 7233`) can reach temporal in the STRICT-mTLS
        # agentstudio-platform namespace.
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      serviceAccountName: {{ include "eval-worker.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nemo-default-bucket
          persistentVolumeClaim:
            claimName: {{ include "nemo.defaultBucketPvcName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-temporal
          image: {{ .Values.global.imageRepository }}/init-tools:latest
          imagePullPolicy: {{ if .Values.global.imagePullPolicy }}{{ .Values.global.imagePullPolicy }}{{ else }}IfNotPresent{{ end }}
          command: ['sh', '-c', 'until nc -z {{ .Values.temporalHost | default "temporal.agentstudio-platform.svc.cluster.local" }} 7233; do echo waiting for temporal; sleep 2; done']
      containers:
        - name: eval-worker
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nemo-default-bucket
              mountPath: /mnt/pvcs/default-nemo
          env:
            {{- toYaml .Values.env | nindent 12 }}
            {{- $root := . }}
            - name: KEYCLOAK_INTERNAL_ISSUER
              value: {{ include "nemo.keycloakInternalIssuer" $root | quote }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: eval-worker-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: eval-worker-client-secret
            - name: TEMPORAL_GRACEFUL_SHUTDOWN_TIMEOUT
              value: {{ .Values.gracefulShutdownTimeout | default "30" | quote }}
          ports:
            - name: metrics
              containerPort: 9465
              protocol: TCP
{{- end }}
