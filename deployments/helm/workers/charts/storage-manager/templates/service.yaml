{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemo.storageManagerServiceName" . }}
  labels:
    {{- include "storage-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
      name: http-api
    {{- if .Values.service.metricsPort }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "storage-manager.selectorLabels" . | nindent 4 }}
{{- end }}
