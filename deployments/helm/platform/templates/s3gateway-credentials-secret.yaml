{{- /*
  Standalone s3gateway credentials secret for this namespace.
  When s3gateway.enabled is true, the s3gateway sub-chart creates this secret
  itself.  When s3gateway is deployed elsewhere (e.g. agentstudio-workers) but
  the bootstrap jobs still need the credentials here, this template creates it.
*/}}
{{- if and (not .Values.s3gateway.enabled) (or .Values.defaultSetup.enabled .Values.defaultSetup.s3gatewayBootstrapEnabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemo.s3gatewayCredentialsName" . }}
  namespace: {{ include "nemo.namespace" . }}
  labels:
    {{- include "nemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3gateway-credentials
type: Opaque
stringData:
  access-key: {{ .Values.s3gateway.credentials.accessKey | default "testuser" | quote }}
  secret-key: {{ .Values.s3gateway.credentials.secretKey | default "secret" | quote }}
{{- end }}
