{{- if .Values.lakekeeper.enabled }}
{{- /* 
  Secret for LakeKeeper to access shared PostgreSQL database
  This secret contains the database credentials that match the database namespace secret
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: shared-postgresql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: lakekeeper-database
type: Opaque
stringData:
  postgres: {{ .Values.lakekeeper.externalDatabase.user | default "postgres" | quote }}
  postgres-password: {{ .Values.lakekeeper.externalDatabase.password | default "agentstudio-postgres-password" | quote }}
{{- end }}

