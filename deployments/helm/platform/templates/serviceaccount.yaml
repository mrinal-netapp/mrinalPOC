{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nemo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemo.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- /*
      Hook weight -10 ensures this SA exists before the lakekeeper-db-init job
      (weight -5) and lakekeeper-wait-keycloak-rbac job (weight -4) run.
      "before-hook-creation" cleans up the previous hook SA on each upgrade
      before recreating it, keeping the resource fresh without orphaning it.
    */}}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
