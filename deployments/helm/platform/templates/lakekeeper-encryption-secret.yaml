{{- if .Values.lakekeeper.enabled }}
{{- /*
Lakekeeper postgres-encryption Secret — owned by the platform umbrella.

WHY THIS LIVES HERE, NOT IN THE LAKEKEEPER SUBCHART
---------------------------------------------------
The lakekeeper subchart (v0.9.0) auto-generates this Secret when
`secretBackend.postgres.encryptionKeySecret` is empty, and uses `lookup`
to preserve the existing key across upgrades. That sounds safe until it
isn't: if the Secret ever leaves the cluster (namespace recreated,
deploy from a different release name, accidental delete, race during a
helm uninstall+install), the chart silently generates a NEW random key.
The DB still has rows encrypted with the OLD key. Result: every
warehouse-credential fetch fails with `Wrong key or corrupt data` →
500s on every table create, dataset import, etc.

This exact failure mode bit us on cluster sks6316: a deploy without the
`--set lakekeeper.secretBackend.postgres.encryptionKeySecret=...` flag
auto-gen'd one key; a subsequent deploy regenerated with a different
key; the postgres rows from the first deploy became unreadable.

By owning the Secret here:
  - We control the name and lifecycle independently of the lakekeeper
    chart's gate (`secretBackend.postgres.encryptionKeySecret` empty).
  - `lookup` + `helm.sh/resource-policy: keep` guarantee the key value
    survives every helm operation we run, including `helm uninstall`.
  - Operators can pre-create or replace the Secret via an external
    secret manager (Key Vault, ExternalSecrets) and this template will
    pick up the existing value verbatim.
  - The lakekeeper subchart's auto-gen template still skips (gate is
    `empty .Values.secretBackend.postgres.encryptionKeySecret`, and the
    Make-level --set keeps that key non-empty).

KEY ROTATION
------------
There is NO supported rotation here. Lakekeeper encrypts at write-time
and decrypts at read-time with the same key. Rotating the key requires
decrypting every row with the old key + re-encrypting with the new key,
which the upstream chart doesn't ship. If you ever need rotation,
expect to do it via a Job that uses the lakekeeper admin API to
re-create every warehouse credential after switching keys (or just
drop+recreate warehouses, the dev path).
*/}}
{{- $secretName := .Values.lakekeeper.externalDatabase.encryptionKeySecret | default "lakekeeper-postgres-encryption" }}
{{- $secretKey := .Values.lakekeeper.externalDatabase.encryptionKeySecretKey | default "encryptionKey" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingData := (get $existing "data") | default dict }}
{{- $key := (get $existingData $secretKey) | default (randAlphaNum 40 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: lakekeeper-encryption
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{ $secretKey }}: {{ $key | quote }}
{{- end }}
