{{- if .Values.lakekeeper.enabled }}
{{- /*
  Pre-install/pre-upgrade hook to ensure the lakekeeper database exists before lakekeeper starts.
  This job waits for PostgreSQL to be ready and creates the database if it doesn't exist.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nemo.fullname" . }}-lakekeeper-db-init
  namespace: {{ include "nemo.namespace" . }}
  labels:
    {{- include "nemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: lakekeeper-db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      name: {{ include "nemo.fullname" . }}-lakekeeper-db-init
      annotations:
        # Mesh this pre-install hook so it reaches Postgres over mTLS under
        # the database namespace's STRICT PeerAuthentication.
        sidecar.istio.io/inject: "true"
        # Native-sidecar mode (k8s 1.28+, Istio 1.20+): inject istio-proxy
        # as an initContainer with restartPolicy=Always. That way the
        # sidecar (a) is already running when db-init makes its first
        # postgres call (the comment above was aspirational — the
        # `inject: true` alone does NOT make it native; this annotation
        # does), and (b) exits when db-init completes, so the Job
        # reaches Succeeded without a lifecycle hang.
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "nemo.serviceAccountName" . }}
      containers:
      - name: db-init
        image: {{ .Values.global.imageRepository }}/init-tools:latest
        imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # Sidecar lifecycle handled by `sidecar.istio.io/nativeSidecar: "true"`
          # on the pod template — kubelet auto-exits istio-proxy when
          # this main container completes. (No /quitquitquit trap: it
          # would race the native sidecar's restartPolicy=Always.)
          echo "Initializing lakekeeper database..."
          
          # Extract connection details from values
          # Note: Using values directly since secrets may not exist when pre-install hook runs
          POSTGRES_HOST="{{ .Values.lakekeeper.externalDatabase.host_write }}"
          POSTGRES_PORT="{{ .Values.lakekeeper.externalDatabase.port }}"
          POSTGRES_DB="{{ .Values.lakekeeper.externalDatabase.database }}"
          POSTGRES_USER="{{ .Values.lakekeeper.externalDatabase.user }}"
          POSTGRES_PASSWORD="{{ .Values.lakekeeper.externalDatabase.password }}"
          
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL at $POSTGRES_HOST:$POSTGRES_PORT to be ready..."
          until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
            echo "PostgreSQL is not ready yet, waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
          
          # Check if database exists
          echo "Checking if database '$POSTGRES_DB' exists..."
          DB_EXISTS=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" | grep -q 1 && echo "yes" || echo "no")
          
          if [ "$DB_EXISTS" = "yes" ]; then
            echo "Database '$POSTGRES_DB' already exists. Skipping creation."
          else
            echo "Database '$POSTGRES_DB' does not exist. Creating..."
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$POSTGRES_DB\";"
            if [ $? -eq 0 ]; then
              echo "Database '$POSTGRES_DB' created successfully!"
            else
              echo "Error: Failed to create database '$POSTGRES_DB'"
              exit 1
            fi
          fi
          
          echo "Lakekeeper database initialization completed successfully!"
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "string" . }}
        - name: {{ . | quote }}
        {{- else if kindIs "map" . }}
        - {{- toYaml . | nindent 10 }}
        {{- else }}
        - name: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
