# AWS EKS overlay for the platform tier (FSx Trident / fsxn-nas).
global:
  storageClass: "fsxn-nas"
  # Re-pull after ECR manifest fixes (avoids stale wrong-arch cache on nodes).
  imagePullPolicy: Always

keycloak:
  setup:
    image:
      pullPolicy: Always

redis:
  master:
    persistence:
      storageClass: "fsxn-nas"

# Dedicated ServiceAccounts (mirrors the AKS overlay, minus Azure WI/clientId).
# The base chart defaults serviceAccount.create=false, so without these the
# s3gateway / temporal pods run as the namespace `default` SA — tripping the
# mesh's `admissionPolicies.denyDefaultServiceAccount` guardrail. AKS gets named
# SAs for free via Azure Workload Identity; on EKS we create them explicitly
# (only the SPIFFE identity matters here).
s3gateway:
  serviceAccount:
    create: true

temporal:
  serviceAccountName: temporal
  serviceAccount:
    create: true
