apiVersion: v2
name: platform
description: AgentStudio platform tier — temporal, lakekeeper, redis + init jobs
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - agentstudio
  - platform
maintainers:
  - name: AgentStudio Team

dependencies:
  - name: temporal
    version: "1.0.0"
    repository: "file://./charts/temporal"
    condition: temporal.enabled
  - name: lakekeeper
    version: "0.9.0"
    repository: "https://lakekeeper.github.io/lakekeeper-charts/"
    condition: lakekeeper.enabled
  - name: redis
    version: "24.1.8"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
