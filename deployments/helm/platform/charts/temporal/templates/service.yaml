{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
      appProtocol: tcp
  selector:
    {{- include "temporal.selectorLabels" . | nindent 4 }}
{{- end }}

