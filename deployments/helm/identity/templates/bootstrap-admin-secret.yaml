{{- /*
Keycloak first-boot bootstrap admin credentials.

Read by the StatefulSet (KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD).
Once the realm export is imported and a real admin user exists, this
account should be disabled.

Render-time gates:
  1. existingSecret set                  -> nothing rendered. Keycloak
                                            reads the operator-supplied
                                            Secret (AKS path: materialised
                                            by SecretProviderClass from
                                            Azure Key Vault, e.g.
                                            existingSecret =
                                            "keycloak-bootstrap-admin-from-kv").
  2. existingSecret empty
     AND password empty                  -> nothing rendered. KC 26 falls
                                            back to its built-in
                                            admin/admin defaults and
                                            prompts the operator to rotate
                                            on first login. Operators who
                                            want chart-managed creds opt
                                            in via `-f values-local.yaml`
                                            (dev) or `--set
                                            keycloak.bootstrapAdmin.password=...`.
  3. password set, no existingSecret     -> renders this Secret with the
                                            operator-supplied credentials.

Resolution order is documented in values.yaml under
keycloak.bootstrapAdmin.
*/}}
{{- if not .Values.keycloak.bootstrapAdmin.existingSecret }}
{{- if .Values.keycloak.bootstrapAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.bootstrapAdminSecretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.keycloak.bootstrapAdmin.secretKeys.usernameKey }}: {{ .Values.keycloak.bootstrapAdmin.username | quote }}
  {{ .Values.keycloak.bootstrapAdmin.secretKeys.passwordKey }}: {{ .Values.keycloak.bootstrapAdmin.password | quote }}
{{- end }}
{{- end }}
