{{- /*
Entra broker client-secret Secret (T-103, dev-path).

Renders only when realmBootstrap.broker is enabled AND no existingSecret
is supplied AND clientSecret is non-empty. The realm-bootstrap Job reads
KC_ENTRA_CLIENT_SECRET off this Secret via secretKeyRef.

In production (AKS), realmBootstrap.broker.existingSecret points at
`keycloak-entra-broker-from-kv` which the SPC materialises out of Key
Vault — and this template renders nothing. The chart has only one
source of the broker secret at any time, exactly mirroring the
bootstrap-admin-secret.yaml convention so the two are easy to reason
about side-by-side.

The clientId, tenantId, and the two security-group objectIds are NOT
secrets — they flow through Helm values directly into the Job's env at
install time, not via this Secret. See values.yaml under
realmBootstrap.broker.* for the rationale.
*/}}
{{- if and .Values.realmBootstrap.enabled .Values.realmBootstrap.broker.enabled }}
{{- if not .Values.realmBootstrap.broker.existingSecret }}
{{- if .Values.realmBootstrap.broker.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.brokerSecretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: realm-bootstrap
type: Opaque
stringData:
  {{ .Values.realmBootstrap.broker.secretKeys.clientSecretKey }}: {{ .Values.realmBootstrap.broker.clientSecret | quote }}
{{- end }}
{{- end }}
{{- end }}
