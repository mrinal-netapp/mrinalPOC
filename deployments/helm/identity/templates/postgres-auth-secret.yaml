{{- /*
PostgreSQL credentials Secret consumed by Keycloak.

Keycloak connects to the shared PostgreSQL StatefulSet that lives in the
`database` namespace (`shared-postgresql.database.svc.cluster.local`).
The `keycloak` database itself is created by that chart's initdb script,
so this chart never has to provision the database.

Render-time gates (mirroring bootstrap-admin-secret.yaml):
  1. postgres.auth.existingSecret set    -> nothing rendered. Keycloak's
                                            KC_DB_USERNAME / KC_DB_PASSWORD
                                            reference the operator-supplied
                                            Secret (AKS path: materialised
                                            by SecretProviderClass from
                                            Azure Key Vault, e.g.
                                            existingSecret =
                                            "keycloak-postgres-auth-from-kv").
  2. existingSecret empty
     AND password set                    -> chart RENDERS a Secret with
                                            the operator-supplied creds
                                            (used by values-local.yaml).
  3. existingSecret empty
     AND password empty                  -> chart RENDERS NOTHING. The
                                            StatefulSet's `if .password OR
                                            .existingSecret` gate kicks in
                                            (see templates/statefulset.yaml
                                            postgres env block) and Helm
                                            fails fast with a `required`
                                            error -- this is intentional
                                            so a plain `helm install`
                                            never silently ships a
                                            well-known DB password.
*/}}
{{- if not .Values.postgres.auth.existingSecret }}
{{- if .Values.postgres.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.postgres.secretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.secretKeys.usernameKey }}: {{ .Values.postgres.auth.username | quote }}
  {{ .Values.postgres.auth.secretKeys.passwordKey }}: {{ .Values.postgres.auth.password | quote }}
{{- end }}
{{- end }}
