{{- /*
SecretProviderClass -- mounts Azure Key Vault objects into the Keycloak
pods and syncs them into Kubernetes Secrets that the StatefulSet env
block (KC_DB_USERNAME / _PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD)
and the realm-bootstrap Job (KC_ENTRA_CLIENT_SECRET) reference via
secretKeyRef.

Materialised Kubernetes Secrets (referenced via existingSecret in
postgres.auth, keycloak.bootstrapAdmin, and realmBootstrap.broker):
  - keycloak-postgres-auth-from-kv     (postgres credentials)
  - keycloak-bootstrap-admin-from-kv   (Keycloak first-boot admin)
  - keycloak-entra-broker-from-kv      (Entra IdP broker client secret)

Disabled in dev (values-local.yaml). Enabled and populated in
values-aks.yaml.
*/}}
{{- if .Values.secretProviderClass.enabled }}
{{- /*
Cross-config invariant: SPC mounts on AKS only work when the pod also
carries the `azure.workload.identity/use=true` label. That label is
gated on `.Values.serviceAccount.workloadIdentityEnabled`, so enabling
SPC without WI would render pods that mount the CSI volume without a
federated token -- the CSI driver then can't authenticate to Key Vault
and the volume mount fails with an opaque AAD error at first pod
start. Catch the misconfiguration at render time.
*/}}
{{- if not .Values.serviceAccount.workloadIdentityEnabled }}
{{- fail "secretProviderClass.enabled=true requires serviceAccount.workloadIdentityEnabled=true. The Azure CSI driver needs a federated AAD token to fetch Key Vault secrets; the Azure Workload Identity webhook injects that token only when the POD template carries the `azure.workload.identity/use=true` label (NOT a label on the ServiceAccount). That pod-template label is gated on .Values.serviceAccount.workloadIdentityEnabled in templates/statefulset.yaml -- flip that toggle on, then enable the SecretProviderClass." }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keycloak.fullname" . }}-secrets
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    ## When secretProviderClass.enabled=true, these three values are
    ## mandatory -- without them the Azure CSI provider can authenticate
    ## but cannot resolve the Key Vault, so the volume mount fails at
    ## pod start. `required` them at render time so missing config fails
    ## the helm install fast and loud, instead of producing a chart that
    ## installs cleanly and only blows up at runtime.
    clientID: {{ required ".Values.secretProviderClass.clientID is required when secretProviderClass.enabled=true (Workload Identity UAMI client-id federated to the Keycloak SA)" .Values.secretProviderClass.clientID | quote }}
    keyvaultName: {{ required ".Values.secretProviderClass.keyvaultName is required when secretProviderClass.enabled=true (e.g. agent-studio-kv)" .Values.secretProviderClass.keyvaultName | quote }}
    tenantId: {{ required ".Values.secretProviderClass.tenantId is required when secretProviderClass.enabled=true (Azure AD tenant the Key Vault lives in)" .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        {{- /*
        Per-object filter: skip the Entra broker KV object when broker
        is disabled. Operators turning brokering on/off must NOT be
        forced to also reach into the values file and add/remove the
        broker entry from the SPC objects list -- that's two coupled
        edits where one suffices. Equivalently, the bootstrap
        provisioning script only creates `kc-entra-broker-secret`
        when entra-register has been run, so requesting it
        unconditionally here ContainerCreating-deadlocks the pod on
        a side-by-side smoke install.

        Filter on objectName specifically (not via a separate values
        flag) because the KV object name IS the contract; if it ever
        gets renamed the rename touches both the values list and this
        guard, which is the right blast radius.
        */}}
        {{- $brokerEnabled := and .Values.realmBootstrap.enabled .Values.realmBootstrap.broker.enabled }}
        {{- range .Values.secretProviderClass.objects }}
        {{- if and (eq .objectName "kc-entra-broker-secret") (not $brokerEnabled) }}
        {{- /* skip: broker disabled, KV object not provisioned */ -}}
        {{- else }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType | default "secret" }}
          objectAlias: {{ .objectAlias | default .objectName }}
        {{- end }}
        {{- end }}
  {{- with .Values.secretProviderClass.secretObjects }}
  secretObjects:
    {{- /*
    Mirror of the broker filter above for the secretObjects sync
    list, with one extra wrinkle: a secretObjects entry with an
    EMPTY data: array is rejected by the CSI driver (the JSONSchema
    requires data to be a non-empty array). The broker secret entry
    in values-aks.yaml has exactly one data ref (kc-entra-broker-secret);
    filtering that ref out leaves data: [] and breaks the install.
    So when broker is disabled, drop the entire secretObjects entry
    whose data list would become empty -- not just the inner ref.

    Implementation note: we identify "the broker entry" by checking
    whether any of its data refs use kc-entra-broker-secret AS THE
    objectName. If/when the values file gains another secretObjects
    entry that mixes broker + non-broker refs, this filter starts
    over-skipping. There aren't any such entries today and adding one
    would be a smell (one secretObjects per K8s Secret = clean
    contract), but if we ever cross that line, change the filter to
    drop the broker DATA REFS individually and skip the whole entry
    only when its remaining data list is empty.
    */}}
    {{- $brokerEnabled := and $.Values.realmBootstrap.enabled $.Values.realmBootstrap.broker.enabled }}
    {{- range . }}
    {{- $entry := . }}
    {{- $hasBroker := false }}
    {{- range $entry.data }}
    {{- if eq .objectName "kc-entra-broker-secret" }}{{- $hasBroker = true }}{{- end }}
    {{- end }}
    {{- if and $hasBroker (not $brokerEnabled) }}
    {{- /* skip: broker disabled, drop the entire keycloak-entra-broker-from-kv sync */ -}}
    {{- else }}
    - secretName: {{ $entry.secretName }}
      type: {{ $entry.type | default "Opaque" }}
      data:
        {{- range $entry.data }}
        - objectName: {{ .objectName }}
          key: {{ .key }}
        {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
