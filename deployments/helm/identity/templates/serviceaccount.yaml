{{- /*
ServiceAccount for Keycloak server pods.

In AKS this SA is federated (via `az identity federated-credential`) to a
User-Assigned Managed Identity that has GET permission on the Key Vault
secrets listed in templates/secretproviderclass.yaml. The federation
subject is:
  system:serviceaccount:<release-namespace>:<sa-name>
where <release-namespace> is whatever `helm install -n <ns>` targets
(conventionally `agentstudio-identity` for this chart) and <sa-name>
resolves through `keycloak.serviceAccountName`.

The Azure Workload Identity webhook injects an AAD token into a POD
(not into the SA itself) when the POD template carries the
`azure.workload.identity/use=true` label -- see
templates/statefulset.yaml where that label is gated on
`.Values.serviceAccount.workloadIdentityEnabled`. The CSI driver then
uses that injected token to fetch secrets from Key Vault on the pod's
behalf.

We also stamp the same `azure.workload.identity/use=true` label onto the
SA here when workloadIdentityEnabled is true, purely so a
`kubectl get sa -o yaml` makes the SA's role obvious. The webhook itself
does not key off the SA label.

In local dev (`workloadIdentityEnabled: false`) the annotations block is
empty and the SA is just a normal namespace-scoped SA.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak.serviceAccountName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    {{- if .Values.serviceAccount.workloadIdentityEnabled }}
    azure.workload.identity/use: "true"
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
