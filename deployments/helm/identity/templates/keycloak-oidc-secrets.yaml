{{- if and .Values.keycloak.oidcClients (not .Values.skipKeycloakOidcSecrets) }}
{{- /*
  Create OIDC secrets even when Keycloak subchart is disabled, as services need these credentials.
  On first install this creates the secret with placeholder values ("changeme-*").
  The keycloak-setup post-install hook then patches the secret with real Keycloak-generated secrets.

  On subsequent upgrades we use Helm's lookup to detect the existing secret: if a key already
  holds a real (non-placeholder) value we preserve it instead of overwriting with the default.
  This preserves live credentials across upgrades for services that lack init-containers
  (e.g. storage-manager).
*/}}
{{- $existing := dict }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "keycloak-oidc-secrets") }}
{{- if and $existingSecret $existingSecret.data }}
{{-   range $key, $value := $existingSecret.data }}
{{-     $decoded := $value | b64dec }}
{{-     if and (ne $decoded "") (not (hasPrefix "changeme-" $decoded)) }}
{{-       $_ := set $existing $key $decoded }}
{{-     end }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-oidc-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: oidc
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  gui-client-id: {{ index $existing "gui-client-id" | default (.Values.keycloak.oidcClients.gui.clientId | default "agentstudio-gui") | quote }}

  lakekeeper-client-id: {{ index $existing "lakekeeper-client-id" | default (.Values.keycloak.oidcClients.lakekeeper.clientId | default "agentstudio-lakekeeper") | quote }}
  lakekeeper-client-secret: {{ index $existing "lakekeeper-client-secret" | default (.Values.keycloak.oidcClients.lakekeeper.clientSecret | default "changeme-lakekeeper-secret") | quote }}

  lakekeeper-ui-client-id: {{ index $existing "lakekeeper-ui-client-id" | default (.Values.keycloak.oidcClients.lakekeeperUi.clientId | default "agentstudio-lakekeeper-ui") | quote }}

  workflow-engine-client-id: {{ index $existing "workflow-engine-client-id" | default (.Values.keycloak.oidcClients.workflowEngine.clientId | default "agentstudio-workflow-engine") | quote }}
  workflow-engine-client-secret: {{ index $existing "workflow-engine-client-secret" | default (.Values.keycloak.oidcClients.workflowEngine.clientSecret | default "changeme-workflow-engine-secret") | quote }}

  analytics-engine-client-id: {{ index $existing "analytics-engine-client-id" | default (.Values.keycloak.oidcClients.analyticsEngine.clientId | default "agentstudio-analytics-engine") | quote }}
  analytics-engine-client-secret: {{ index $existing "analytics-engine-client-secret" | default (.Values.keycloak.oidcClients.analyticsEngine.clientSecret | default "changeme-analytics-engine-secret") | quote }}

  config-service-client-id: {{ index $existing "config-service-client-id" | default (.Values.keycloak.oidcClients.configService.clientId | default "agentstudio-config-service") | quote }}
  config-service-client-secret: {{ index $existing "config-service-client-secret" | default (.Values.keycloak.oidcClients.configService.clientSecret | default "changeme-config-service-secret") | quote }}

  storage-manager-client-id: {{ index $existing "storage-manager-client-id" | default (.Values.keycloak.oidcClients.storageManager.clientId | default "agentstudio-storage-manager") | quote }}
  storage-manager-client-secret: {{ index $existing "storage-manager-client-secret" | default (.Values.keycloak.oidcClients.storageManager.clientSecret | default "changeme-storage-manager-secret") | quote }}

  agent-service-client-id: {{ index $existing "agent-service-client-id" | default (.Values.keycloak.oidcClients.agentService.clientId | default "agentstudio-agent-service") | quote }}
  agent-service-client-secret: {{ index $existing "agent-service-client-secret" | default (.Values.keycloak.oidcClients.agentService.clientSecret | default "changeme-agent-service-secret") | quote }}

  connector-worker-client-id: {{ index $existing "connector-worker-client-id" | default (.Values.keycloak.oidcClients.connectorWorker.clientId | default "agentstudio-connector-worker") | quote }}
  connector-worker-client-secret: {{ index $existing "connector-worker-client-secret" | default (.Values.keycloak.oidcClients.connectorWorker.clientSecret | default "changeme-connector-worker-secret") | quote }}

  eval-worker-client-id: {{ index $existing "eval-worker-client-id" | default (.Values.keycloak.oidcClients.evalWorker.clientId | default "agentstudio-eval-worker") | quote }}
  eval-worker-client-secret: {{ index $existing "eval-worker-client-secret" | default (.Values.keycloak.oidcClients.evalWorker.clientSecret | default "changeme-eval-worker-secret") | quote }}

  grafana-proxy-client-id: {{ index $existing "grafana-proxy-client-id" | default ((.Values.keycloak.oidcClients.grafanaProxy | default dict).clientId | default "agentstudio-grafana-proxy") | quote }}
  ## Secret is generated by Keycloak and read back by post-realm-bootstrap-job.yaml.
  ## The changeme- prefix causes the upgrade-preservation guard to keep the real value once patched.
  grafana-proxy-client-secret: {{ index $existing "grafana-proxy-client-secret" | default ((.Values.keycloak.oidcClients.grafanaProxy | default dict).clientSecret | default "changeme-grafana-proxy-secret") | quote }}

  ## UUID of the agent-studio-api resource-server client. Generated by Keycloak
  ## at realm-import; resolved + patched in by templates/post-realm-bootstrap-job.yaml.
  ## The `changeme-` placeholder triggers the preservation guard above so the
  ## resolved value survives subsequent helm upgrades.
  resource-server-uuid: {{ index $existing "resource-server-uuid" | default (.Values.keycloak.oidcClients.resourceServerUuid | default "changeme-resource-server-uuid") | quote }}

{{- end }}
