{{- if and .Values.httproute .Values.httproute.enabled }}
# HTTPRoute attaches to the shared services-gateway and routes all traffic for
# phoenix.<endpoint> directly to the Phoenix service. Phoenix has no
# authentication proxy — access should be restricted via network policy or VPN
# in production. For local dev this gives direct browser access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "phoenix.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "phoenix.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
      sectionName: {{ .Values.httproute.gateway.sectionName }}
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ include "phoenix.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
