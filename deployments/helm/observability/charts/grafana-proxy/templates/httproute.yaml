{{- if .Values.enabled }}
# HTTPRoute attaches to the shared nemo-gateway and routes all traffic for
# the configured hostname to the grafana-proxy service.  The proxy handles
# OIDC authentication and forwards authenticated requests upstream to Grafana.
# Grafana itself remains a ClusterIP service with no direct external route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "grafana-proxy.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana-proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ include "grafana-proxy.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
