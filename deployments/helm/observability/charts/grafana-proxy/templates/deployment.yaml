{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafana-proxy.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "grafana-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana-proxy.labels" . | nindent 8 }}
        component: grafana-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-proxy
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- if .Values.keycloak.publicIssuer }}
            - name: KEYCLOAK_PUBLIC_ISSUER
              value: {{ .Values.keycloak.publicIssuer | quote }}
            {{- end }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-proxy.keycloakSecretName" . }}
                  key: {{ .Values.keycloak.clientSecretKey | default "clientSecret" }}
            - name: KEYCLOAK_REDIRECT_URI
              value: {{ include "grafana-proxy.redirectURI" . | quote }}
            - name: CONFIG_SERVICE_URL
              value: {{ .Values.configServiceURL | quote }}
            - name: GRAFANA_UPSTREAM_URL
              value: {{ .Values.grafanaUpstreamURL | quote }}
            - name: SESSION_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-proxy.sessionSecretName" . }}
                  key: sessionHashKey
            - name: SESSION_BLOCK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-proxy.sessionSecretName" . }}
                  key: sessionBlockKey
            - name: SESSION_TTL_HOURS
              value: {{ .Values.session.ttlHours | quote }}
            - name: PROJECT_CACHE_TTL_SECONDS
              value: {{ .Values.projectCacheTTLSeconds | quote }}
            - name: PLATFORM_ADMIN_ROLE
              value: {{ .Values.platformAdminRole | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            {{- if .Values.keycloak.tlsSkipVerify }}
            - name: TLS_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-proxy.internalTokenSecretName" . }}
                  key: internalToken
{{- end }}
