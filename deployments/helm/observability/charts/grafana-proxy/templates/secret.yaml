{{- if .Values.enabled }}
{{- /* Render the Keycloak client secret only when no existingSecret is provided. */}}
{{- if not .Values.keycloak.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-proxy.fullname" . }}-keycloak
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.keycloak.clientSecret | quote }}
---
{{- end }}
{{- /* Render the session keys secret only when no existingSecret is provided. */}}
{{- if not .Values.session.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-proxy.fullname" . }}-session
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  sessionHashKey: {{ .Values.session.hashKey | quote }}
  sessionBlockKey: {{ .Values.session.blockKey | quote }}
---
{{- end }}
{{- /* Render the internal token secret used by prometheus-proxy. */}}
{{- if not .Values.internalToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-proxy.fullname" . }}-internal
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  internalToken: {{ .Values.internalToken.value | quote }}
{{- end }}
{{- end }}
