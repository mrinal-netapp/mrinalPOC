apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tempo.fullname" . }}-config
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  tempo-config.yaml: |
    server:
      http_listen_port: {{ .Values.service.ports.http }}

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: '0.0.0.0:{{ .Values.service.ports.grpc }}'

    ingester:
      max_block_duration: {{ .Values.ingester.maxBlockDuration }}

    compactor:
      compaction:
        block_retention: {{ .Values.retention.blockRetention }}

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal

    overrides:
      defaults:
        global:
          max_bytes_per_trace: {{ .Values.overrides.maxBytesPerTrace }}
