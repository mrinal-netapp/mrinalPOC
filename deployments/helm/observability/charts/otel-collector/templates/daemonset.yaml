{{- if .Values.daemonset.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "otel-collector.daemonsetName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "otel-collector.daemonsetSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Checksum annotation forces a rolling update whenever the DaemonSet
      # ConfigMap changes, so log-tailing always uses the current config.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-daemonset.yaml") . | sha256sum }}
        {{- with .Values.daemonset.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "otel-collector.daemonsetSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "otel-collector.daemonsetName" . }}
      {{- include "otel-collector.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: otel-collector
          image: {{ include "otel-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            # Expose the node name so the resource/k8s_node processor can stamp
            # k8s.node.name on every forwarded log record.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Run as root so the filelog receiver can read pod log files, which
          # are owned by the container runtime (root or a high UID). This matches
          # the agent-studio pattern; tighten with a securityContext PSA exception
          # if your cluster enforces restricted Pod Security Standards.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: false
          {{- with .Values.daemonset.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
            # Primary pod log directory — filelog/pods include glob points here.
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # Symlink directory that points into /var/log/pods; mounted read-only
            # to satisfy filelog symlink resolution without write access.
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            # Docker-based nodes (OrbStack, Docker Desktop, k3s+Docker) store the
            # actual log files under /var/lib/docker/containers/<id>/<id>-json.log.
            # The 0.log symlinks in /var/log/pods/ point here, so this mount is
            # required for the filelog receiver to follow symlinks on Docker nodes.
            # On pure containerd nodes (AKS, EKS, GKE) the mount is harmless
            # (DirectoryOrCreate returns an empty dir if Docker is absent).
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.daemonsetName" . }}-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
