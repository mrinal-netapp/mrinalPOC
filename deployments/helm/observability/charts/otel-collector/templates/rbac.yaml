# ServiceAccount + ClusterRole + ClusterRoleBinding for the central Deployment
# collector. The central collector calls the Kubernetes API to discover kubelet
# and node-exporter scrape targets (prometheus/infra receiver).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-collector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-collector.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.daemonset.enabled }}
---
# ServiceAccount + ClusterRole + ClusterRoleBinding for the per-node DaemonSet
# log collector. The DaemonSet only needs pod/node read access to enrich log
# records — it does not need kubelet proxy access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-collector.daemonsetName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-collector.daemonsetName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-collector.daemonsetName" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-collector.daemonsetName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-collector.daemonsetName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
