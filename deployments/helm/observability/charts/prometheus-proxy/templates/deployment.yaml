{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-proxy.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prometheus-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prometheus-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus-proxy.labels" . | nindent 8 }}
        component: prometheus-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-proxy
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROMETHEUS_UPSTREAM_URL
              value: {{ .Values.prometheusUpstreamURL | quote }}
            - name: GRAFANA_PROXY_URL
              value: {{ .Values.grafanaProxyURL | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prometheus-proxy.internalTokenSecretName" . }}
                  key: internalToken
            - name: PROJECT_CACHE_TTL_SECONDS
              value: {{ .Values.projectCacheTTLSeconds | quote }}
            - name: LISTEN_ADDR
              value: ":9091"
{{- end }}
