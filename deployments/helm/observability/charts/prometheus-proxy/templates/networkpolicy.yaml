{{- if .Values.enabled }}
# NetworkPolicy for the prometheus-proxy pod.
#
# Ingress allowed from:
#   - Grafana pods (Grafana backend sends datasource queries here)
#
# Egress allowed to:
#   - Prometheus (forward rewritten queries)
#   - grafana-proxy (/.internal/projects lookup)
#   - kube-dns (DNS resolution)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prometheus-proxy.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prometheus-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "prometheus-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Grafana → prometheus-proxy: datasource query traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9091
          protocol: TCP

  egress:
    # DNS resolution (kube-dns).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Prometheus upstream — forward rewritten queries.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
    # grafana-proxy — /.internal/projects lookup.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-proxy
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
