# GKE overlay for the SERVICES tier.
#
# Provisions the services-namespace default-bucket PVC on GCNV-native Trident
# NAS (RWX); everything else uses the default cluster RWO class.
#
# Why the default-bucket PVC is needed and must be RWX:
#   artifact-service and kb-retrieval-service both *unconditionally* mount a
#   nemo-default-bucket volume backed by the `s3gateway-default-bucket` PVC. That
#   PVC only exists when defaultBucketPvc.create=true. Two pods co-mount it, so it
#   must be ReadWriteMany on an RWX-capable class (GCNV NAS).
#
# This PVC MUST share the SAME GCNV volume that workers/s3gateway writes to, via
# Trident shareFromPVC. kb-worker publishes each KB's LanceDB index + metadata.json
# through s3gateway onto the workers-namespace bucket; kb-retrieval-service reads
# them from this mount. If this PVC dynamically provisions its own (separate,
# empty) volume, every KB search 503s ("Knowledge base directory does not exist on
# data mount") and, with no metadata.json, the embedding model falls back to a
# bare id the gateway can't route. shareFromPVC binds both namespaces' PVCs to one
# NetApp volume so workers' writes are immediately visible here. Requires the
# source PVC to authorize this namespace (workers values:
# s3gateway.defaultBucket.shareToNamespaces).
#
# Gateway: the services chart already defaults
# gateway.listeners.{http,https}.allowedRoutes.namespaces.from: All, so the
# cross-namespace Keycloak HTTPRoute (in agentstudio-identity) attaches with no
# override. The gateway TLS secret (nemo-gateway-tls) is prepared at deploy time.
#
# global.endpoint / image registry / tag are passed via --set at deploy time
# (parameterized -- no domain baked into this overlay).
#
# Prometheus ServiceMonitor toggles live in values.yaml (enabled by default).
# Subchart templates gate on the Prometheus operator CRD, so metrics scraping
# activates automatically when OBSERVABILITY=1 installs observability first.
#
# Workload Identity stays OFF (base default); GKE WI is a planned follow-up.
#
# Dedicated ServiceAccounts ARE still created (serviceAccount.create=true) even
# though GKE WI is off. The base chart defaults serviceAccount.create=false, so
# without these overrides every pod runs as the namespace `default` SA. That
# breaks the mesh in two ways:
#   1. The principal-based Istio AuthorizationPolicies (e.g.
#      `allow-services-to-bifrost`, `allow-apigateway-to-agent-service`,
#      `allow-phoenix-from-services` in edge/istio-mesh-policies) match on the
#      pod's SPIFFE identity (.../sa/<service>). A `default`-SA pod is not in
#      the allow-list, so Bifrost's sidecar returns 403 "RBAC: access denied"
#      and project-init's gateway-setup step fails with status 500.
#   2. `admissionPolicies.denyDefaultServiceAccount` forbids the default SA.
# AKS gets these SAs for free because Azure Workload Identity requires named,
# annotated SAs. On GKE/EKS we must create them explicitly. WI/azureClientId
# are intentionally omitted — only the SPIFFE identity matters here. Each SA
# name defaults to the service's fullnameOverride (sa/agent-service,
# sa/config-service, …), which is exactly what the policy principals expect.

defaultBucketPvc:
  create: true
  accessMode: ReadWriteMany
  storageClass: gcnv-nas-rwx
  # Keep the historical 1Ti request so Helm does not try to shrink an existing
  # services PVC on upgrade; shareFromPVC still binds this claim to the workers
  # tier's shared underlying volume.
  size: 1Ti
  # Bind to the same GCNV volume as agentstudio-workers/s3gateway-default-bucket
  # instead of provisioning a fresh (empty) one. Emits the
  # trident.netapp.io/shareFromPVC annotation + a TridentVolumeReference CR.
  shareFromPVC:
    namespace: agentstudio-workers
    name: s3gateway-default-bucket

agent-service:
  serviceAccount:
    create: true

agent-service-maf:
  serviceAccount:
    create: true
    name: agent-service-maf

apigateway-service:
  serviceAccount:
    create: true

workflow-engine:
  serviceAccount:
    create: true

kb-retrieval-service:
  serviceAccount:
    create: true

analytics-engine:
  serviceAccount:
    create: true

analytics-mcp-server:
  serviceAccount:
    create: true

artifact-service:
  serviceAccount:
    create: true

config-service:
  serviceAccount:
    create: true
  # Keycloak master-realm admin credentials for /api/v1/setup/status realm checks.
  # GKE renders the bootstrap admin as `keycloak-bootstrap-admin` (no Key Vault);
  # `make sync-shared-secrets` mirrors it into this namespace. Keys: username/password.
  # (AKS sets the same env to the keycloak-bootstrap-admin-from-kv variant.)
  # Use extraEnv — Helm replaces env[] wholesale; do not override env here.
  extraEnv:
    - name: KEYCLOAK_ADMIN_USER
      valueFrom:
        secretKeyRef:
          name: keycloak-bootstrap-admin
          key: username
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-bootstrap-admin
          key: password

# Gateway / TLS configuration moved to the new `edge` Helm chart
# (deployments/helm/edge/values-gke.yaml). The services chart no longer
# ships any Gateway-API resources.
