{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "analytics-engine.fullname" . }}
  labels:
    {{- include "analytics-engine.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "analytics-engine.fullname" . }}
  labels:
    {{- include "analytics-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "analytics-engine.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "analytics-engine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}