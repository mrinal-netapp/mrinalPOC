{{- if .Values.enabled }}
{{- $root := . }}
{{- range .Values.models }}
{{- $modelKey := .key }}
{{- $args := dict "root" $root "modelKey" $modelKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tei.modelFullname" $args }}
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  labels:
    {{- include "tei.commonLabels" $args | nindent 4 }}
    {{- include "tei.selectorLabels" $args | nindent 4 }}
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  # `Recreate` (not the default `RollingUpdate`) when the model is backed
  # by a ReadWriteOnce PVC. RollingUpdate brings the new ReplicaSet up
  # alongside the old, and RWO can only attach to one node — the new
  # pod hangs with `Multi-Attach error` while the old pod keeps serving.
  # Safe to use unconditionally here: TEI is single-replica per model
  # by default; if HPA scales it beyond 1 the chart needs to switch to
  # RWX storage anyway (multiple TEI replicas can't share an RWO model
  # cache). Same pattern as bifrost / artifact-service / s3gateway.
  strategy:
    type: Recreate
    # See bifrost/templates/deployment.yaml for the rationale.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "tei.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tei.selectorLabels" $args | nindent 8 }}
    spec:
      {{- with $root.Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $root.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tei
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy | default $root.Values.image.pullPolicy }}
          {{- with $root.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--model-id"
            - {{ .hfModelId | quote }}
            - "--port"
            - "80"
            {{- if .autoTruncate | default true }}
            - "--auto-truncate"
            {{- end }}
            - "--max-client-batch-size"
            - {{ .maxClientBatchSize | default 128 | quote }}
            - "--max-batch-tokens"
            - {{ .maxBatchTokens | default 65536 | quote }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: model-cache
              mountPath: /data
          livenessProbe:
            {{- toYaml $root.Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $root.Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
      volumes:
        - name: model-cache
          {{- if eq $root.Values.cache.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "tei.modelFullname" $args }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if eq $root.Values.cache.type "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tei.modelFullname" $args }}-cache
  namespace: {{ $root.Values.namespace | default $root.Release.Namespace }}
  labels:
    {{- include "tei.commonLabels" $args | nindent 4 }}
    {{- include "tei.selectorLabels" $args | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $root.Values.cache.accessModes | nindent 4 }}
  {{- with $root.Values.cache.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $root.Values.cache.size }}
{{- end }}
{{- end }}
{{- end }}
