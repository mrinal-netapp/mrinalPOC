enabled: true
# Namespace for TEI Deployments. Leave empty to use .Release.Namespace
# (recommended — matches the services umbrella's namespace). Override only
# when TEI must live in a different namespace than the rest of the services
# tier (e.g., dedicated GPU node pool with namespace-scoped node selectors).
namespace: ""

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  # cpu-1.5 ships hf-hub 0.3.2, which can't parse HuggingFace Hub's current
  # redirect shape and dies on model download with "relative URL without a
  # base" (deterministic; not egress/mesh-related — both verified healthy).
  # cpu-1.7 bundles a fixed downloader and loads all-MiniLM-L6-v2 cleanly.
  tag: "cpu-1.7"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# One TEI Deployment + Service per built-in (`tei-<key>`). Keys must match
# `teiServiceName` suffixes in config-service `BuiltinModels.ts`.
models:
  - key: minilm
    hfModelId: sentence-transformers/all-MiniLM-L6-v2
    dimensions: 384
    autoTruncate: true
    maxBatchTokens: 16384
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  - key: bge-small-en-v1-5
    hfModelId: BAAI/bge-small-en-v1.5
    dimensions: 384
    autoTruncate: true
    maxBatchTokens: 16384
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70

  - key: all-minilm-l12-v2
    hfModelId: sentence-transformers/all-MiniLM-L12-v2
    dimensions: 384
    autoTruncate: true
    maxBatchTokens: 16384
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70

  - key: bge-base-en-v1-5
