    autoTruncate: true
    maxBatchTokens: 16384
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: 2000m
        memory: 3Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70

