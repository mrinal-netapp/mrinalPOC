{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apigateway-service.fullname" . }}
  labels:
    {{- include "apigateway-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apigateway-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apigateway-service.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "apigateway-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apigateway-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.service.metricsPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- $keycloakIssuerSet := false }}
            {{- $root := . }}
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if eq .name "KEYCLOAK_ISSUER" }}
              {{- $keycloakIssuerSet = true }}
              {{- /* Always set KEYCLOAK_ISSUER from template, ignore value from values.yaml */}}
              value: {{ include "nemo.keycloakIssuer" $root | quote }}
              {{- else if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- /* Ensure KEYCLOAK_ISSUER is always set if not in env list */}}
            {{- if not $keycloakIssuerSet }}
            - name: KEYCLOAK_ISSUER
              value: {{ include "nemo.keycloakIssuer" $root | quote }}
            {{- end }}
            {{- /* Set KEYCLOAK_INTERNAL_ISSUER for service-to-service JWKS fetching */}}
            - name: KEYCLOAK_INTERNAL_ISSUER
              value: {{ include "nemo.keycloakInternalIssuer" $root | quote }}
            {{- /*
              WORKSPACE_LABEL_PREFIX: prefix used by proxy.IsWorkspaceSubdomain
              and middleware.isWorkspaceHost to recognise per-workspace public
              hosts of the form {prefix}{workspaceId}.{endpoint}. Must match
              the GUI build-time VITE_WORKSPACE_LABEL_PREFIX so client-built
              URLs and server-side matchers agree.
            */}}
            - name: WORKSPACE_LABEL_PREFIX
              value: {{ include "nemo.workspaceLabelPrefix" $root | quote }}
            {{- /*
              PUBLIC_ENDPOINT: configured public hostname suffix (e.g.
              "agentstudio.dev.openeng.netapp.com") used by the S3 proxy CORS
              handler to allow cross-origin requests from sibling subdomains
              such as catalog.<endpoint> (Lakekeeper UI / DuckDB-WASM range
              reads) and app.<endpoint> (AgentStudio console).
            */}}
            - name: PUBLIC_ENDPOINT
              value: {{ include "nemo.endpoint" $root | quote }}
            {{- /* Add S3 gateway credentials from secret */}}
            {{- /* Use same helper function as s3gateway chart */}}
            {{- $root := . }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemo.s3gatewayCredentialsName" $root }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemo.s3gatewayCredentialsName" $root }}
                  key: secret-key
            {{- if .Values.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "apigateway-service"
            {{- end }}
            {{- if .Values.global.observability.otlpEndpoint }}
            - name: AGENT_STUDIO_OBSERVABILITY_OTLP_LOGS_ENDPOINT
              value: {{ .Values.global.observability.otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "string" . }}
        - name: {{ . | quote }}
        {{- else if kindIs "map" . }}
        - {{- toYaml . | nindent 10 }}
        {{- else }}
        - name: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}



