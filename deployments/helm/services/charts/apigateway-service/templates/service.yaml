{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  labels:
    {{- include "apigateway-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
      name: http-api
    {{- if .Values.service.httpsPort }}
    - port: {{ .Values.service.httpsPort }}
      targetPort: http
      protocol: TCP
      appProtocol: https
      name: https-api
    {{- end }}
    {{- if .Values.service.metricsPort }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "apigateway-service.selectorLabels" . | nindent 4 }}
{{- end }}



