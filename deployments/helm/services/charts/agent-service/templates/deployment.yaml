{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-service.fullname" . }}
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-service.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "agent-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if .Values.service.metricsPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- $root := . }}
            {{- range .Values.env }}
            {{- if and $.Values.redisStandalone (or (eq .name "REDIS_SENTINEL_URL") (eq .name "REDIS_SENTINEL_MASTER")) }}
            {{- /* standalone Redis: omit sentinel; client uses REDIS_URL */}}
            {{- else if eq .name "KEYCLOAK_TOKEN_URL" }}
            {{- /* Derive from namespace so helm-common.sh index overrides are unnecessary */}}
            - name: {{ .name }}
              value: {{ printf "%s/protocol/openid-connect/token" (include "nemo.keycloakInternalIssuer" $root) | quote }}
            {{- else if eq .name "KUBERNETES_NAMESPACE" }}
            - name: {{ .name }}
              value: {{ include "nemo.namespace" $root | quote }}
            {{- else }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ tpl (.value | default "") $root | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: CONFIG_SERVICE_URL
              value: {{ .Values.configServiceUrl | default (include "nemo.configServiceClusterURL" $root) | quote }}
            - name: KEYCLOAK_INTERNAL_ISSUER
              value: {{ include "nemo.keycloakInternalIssuer" $root | quote }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: agent-service-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-secrets
                  key: agent-service-client-secret
            - name: DB_PASSWORD
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey | default "postgres-password" }}
              {{- else }}
              value: {{ .Values.database.password | quote }}
              {{- end }}
            - name: POSTGRES_URL
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DB_POOL_SIZE
              value: {{ .Values.database.poolSize | default 3 | quote }}
            - name: DB_MAX_OVERFLOW
              value: {{ .Values.database.maxOverflow | default 2 | quote }}
            {{- if .Values.global.observability.otlpEndpoint }}
            - name: PHOENIX_COLLECTOR_ENDPOINT
              value: {{ printf "%s/v1/traces" .Values.global.observability.otlpEndpoint | quote }}
            - name: AGENT_STUDIO_OBSERVABILITY_OTLP_LOGS_ENDPOINT
              value: {{ .Values.global.observability.otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "string" . }}
        - name: {{ . | quote }}
        {{- else if kindIs "map" . }}
        - {{- toYaml . | nindent 10 }}
        {{- else }}
        - name: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
