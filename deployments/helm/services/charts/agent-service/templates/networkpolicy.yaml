{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-service.fullname" . }}
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: apigateway-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              component: config-service
      ports:
        - port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-llm-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
              component: bifrost
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              component: kb-retrieval-service
      ports:
        - port: 5000
    - to:
        - podSelector:
            matchLabels:
              component: analytics-engine
      ports:
        - port: 5000
    # Phoenix (OTLP HTTP + UI) in monitoring — PHOENIX_COLLECTOR_ENDPOINT
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: phoenix
      ports:
        - port: 6006
          protocol: TCP
    # Redis: 6379 data plane; 26379 Sentinel (required when REDIS_SENTINEL_URL is set)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 8080
          protocol: TCP
    # DNS (kube-dns in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Istio control plane: pilot-agent (UID 1337) needs to reach istiod for
    # workload certificate signing (15012) and xDS (15010/15012).
    # Without this, sidecar injection succeeds but the proxy cannot obtain
    # its mTLS certificate and stays stuck in Init state.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
        - port: 15010
          protocol: TCP
        - port: 15014
          protocol: TCP
        - port: 15017
          protocol: TCP
{{- end }}
