{{- if .Values.enabled }}
{{- /*
  Creates the postgres password Secret only when database.existingSecret is not set.
  For production, set database.existingSecret + database.existingSecretKey to source
  the password from a pre-existing Secret (e.g. shared-postgresql-secret) so no
  credential ever appears in values files or Helm release history.
  For local dev, database.password is used as a fallback.
*/}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "config-service.fullname" . }}-postgresql
  labels:
    {{- include "config-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.database.password | default "agentstudio-postgres-password" | quote }}
{{- end }}
{{- end }}