{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-service-maf.fullname" . }}
  labels:
    {{- include "agent-service-maf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-service-maf.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: apigateway-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # config-service (config + agent + team fetch) — same namespace
    - to:
        - podSelector:
            matchLabels:
              component: config-service
      ports:
        - port: 3000
    # Bifrost gateway — MCP traffic + LLM calls go through here
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-llm-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
              component: bifrost
      ports:
        - port: 8080
    # kb-retrieval-service (KB tool calls; identity propagation via X-User-Token)
    - to:
        - podSelector:
            matchLabels:
              component: kb-retrieval-service
      ports:
        - port: 5000
    # workflow-engine (HITL approval bridge — Temporal signal channel via REST)
    - to:
        - podSelector:
            matchLabels:
              component: workflow-engine
      ports:
        - port: 8080
    # Observability collector (OTLP HTTP) in monitoring — traces, metrics, and
    # logs export here via global.observability.otlpEndpoint (see .Values.env).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 4318
          protocol: TCP
    # Redis: 6379 data plane; 26379 Sentinel (required when REDIS_SENTINEL_URL is set)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
    # Keycloak (OIDC token endpoint, service account flow)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentstudio-identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 8080
          protocol: TCP
    # DNS (kube-dns in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Istio control plane: pilot-agent (UID 1337) needs to reach istiod for
    # workload certificate signing (15012) and xDS (15010/15014).
    # Without this, sidecar injection succeeds but the proxy cannot obtain
    # its mTLS certificate and stays stuck in Init state.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
        - port: 15010
          protocol: TCP
        - port: 15014
          protocol: TCP
        - port: 15017
          protocol: TCP
{{- end }}
