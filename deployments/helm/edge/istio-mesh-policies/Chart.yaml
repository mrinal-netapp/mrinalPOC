apiVersion: v2
name: istio-mesh-policies
description: >
  Pure-manifest Helm chart that applies AgentStudio Istio mesh policies:
  namespace injection labels, PeerAuthentication (mTLS), AuthorizationPolicy,
  RequestAuthentication, RBAC, ValidatingAdmissionPolicy guardrails, optional
  Istio Gateway/VirtualService, and sample test workloads.
  Install order: istio-base → istio-istiod → istio-mesh-policies.
type: application
version: 0.1.0
appVersion: "1.30.1"
