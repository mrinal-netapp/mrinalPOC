{{- /*
catalog.<endpoint> -> Lakekeeper (Iceberg catalog UI + REST API).
*/ -}}
{{- if and .Values.gateway.enabled (eq (.Values.gateway.provider | default "nginx") "istio") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-catalog
  namespace: {{ include "nemo.namespace" . }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "nemo.gatewayName" . }}
  hostnames:
    - {{ include "nemo.catalogSubdomain" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lakekeeper
          namespace: {{ include "nemo.platformNamespace" . }}
          port: 8181
{{- end }}
