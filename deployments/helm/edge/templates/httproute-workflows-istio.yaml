{{- /*
workflows.<endpoint> -> Temporal UI.
*/ -}}
{{- if and .Values.gateway.enabled (eq (.Values.gateway.provider | default "nginx") "istio") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-workflows
  namespace: {{ include "nemo.namespace" . }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "nemo.gatewayName" . }}
  hostnames:
    - {{ include "nemo.workflowsSubdomain" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: temporal-ui
          namespace: {{ include "nemo.platformNamespace" . }}
          port: 8080
{{- end }}
