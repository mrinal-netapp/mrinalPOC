{{- /*
phoenix.<endpoint> -> Phoenix observability UI.
*/ -}}
{{- if and .Values.gateway.enabled (eq (.Values.gateway.provider | default "nginx") "istio") (.Values.observability).enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-phoenix
  namespace: {{ include "nemo.namespace" . }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "nemo.gatewayName" . }}
  hostnames:
    - {{ include "nemo.phoenixSubdomain" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: phoenix
          namespace: {{ include "nemo.monitoringNamespace" . }}
          port: 6006
{{- end }}
