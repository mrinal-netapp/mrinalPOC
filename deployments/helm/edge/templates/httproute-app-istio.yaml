    - {{ $consoleHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /internal/temporal
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: temporal-ui
          namespace: {{ $platformNs }}
          port: 8080
{{- if (.Values.observability).enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-app-prometheus
  namespace: {{ $namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  hostnames:
    - {{ $consoleHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /prometheus
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: prometheus-prometheus
          namespace: {{ $monitoringNs }}
          port: 9090
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-app-s3
  namespace: {{ $namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  hostnames:
    - {{ $consoleHost | quote }}
  rules:
    # /s3/* still passes through `apigateway-service` for SigV4 re-signing
    # (cannot be expressed declaratively). Path is preserved (no rewrite)
    # because the chi router inside `apigateway-service` mounts at /s3.
    - matches:
        - path:
            type: PathPrefix
            value: /s3
      backendRefs:
        - name: apigateway-service
          namespace: {{ $servicesNs }}
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-app-api-docs
  namespace: {{ $namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  hostnames:
    - {{ $consoleHost | quote }}
  rules:
    # /api-docs/* serves Swagger UI from `apigateway-service` (kept until
    # PR-D extracts it to a static-serve Deployment).
    - matches:
        - path:
            type: PathPrefix
            value: /api-docs
      backendRefs:
        - name: apigateway-service
          namespace: {{ $servicesNs }}
          port: 8080
{{- end }}
