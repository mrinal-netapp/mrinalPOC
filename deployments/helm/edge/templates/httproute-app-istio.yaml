---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentstudio-app-internal-lakekeeper
  namespace: {{ $namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  hostnames:
    - {{ $consoleHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
