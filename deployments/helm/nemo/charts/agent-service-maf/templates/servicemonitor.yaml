{{- if and .Values.enabled (default false .Values.metrics.serviceMonitor.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-service-maf
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-service-maf.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "agent-service-maf.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ default "/metrics" .Values.metrics.path }}
      interval: {{ default "30s" .Values.metrics.serviceMonitor.interval }}
{{- end }}
