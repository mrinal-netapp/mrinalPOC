# Legacy monolith AWS EKS overlay (nemo chart only).
#
# NOT used by tiered `make deploy-eks` — that path installs workers/platform/
# services/console/llm-gateway tiers with per-chart values-eks.yaml overlays
# (e.g. services/values-eks.yaml for the internet-facing NLB gateway).
#
# Use this file only for legacy monolith Helm installs of the nemo chart:
#   helm upgrade --install nemo deployments/helm/nemo \
#     -f deployments/helm/nemo/values.yaml \
#     -f deployments/helm/nemo/values-eks.yaml ...
#
# FSx Trident PVCs + internet-facing NLB for the NGINX Gateway Fabric data plane.
# Mirrors values-aks.yaml (static public PIP): expose the gateway with a routable
# address so lab /etc/hosts or Route53 can target hostnames under ENDPOINT.
#
# Default EKS behaviour (private node subnets + kubernetes.io/role/internal-elb only)
# creates an *internal* NLB (VPC-private IP). Omit this file for VPC-only access or
# kubectl port-forward to nemo-gateway-nginx.
#
# Prerequisites (VPC):
#   - At least one *public* subnet tagged kubernetes.io/role/elb=1
#   - Subnets tagged kubernetes.io/cluster/<CLUSTER_NAME>=shared|owned
#
# After legacy monolith deploy:
#   kubectl get svc -n agentstudio nemo-gateway-nginx
#
# Requires AWS Load Balancer Controller in kube-system when using type: external.

global:
  storageClass: "fsxn-nas"
  cutover:
    keycloak:
      # Overridden at deploy time via EKS_HELM_SETS (--set-string with ENDPOINT).
      issuer: ""

gateway:
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
  # Keycloak HTTPRoute lives in agentstudio-identity; default SameNamespace
  # rejects it and *.agentstudio.local sends auth traffic to apigateway-service.
  listeners:
    http:
      allowedRoutes:
        namespaces:
          from: All
    https:
      allowedRoutes:
        namespaces:
          from: All
  service:
    type: LoadBalancer
