      path: /ready
      port: 5000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  metrics:
    serviceMonitor:
      enabled: false
  # Note: global values (imageRepository, imagePullSecrets) are automatically inherited from parent chart's root-level global

# Keycloak configuration (Identity Provider)
# Using Bitnami Keycloak chart from https://charts.bitnami.com/bitnami
# Adapted to use shared PostgreSQL in database namespace
# Keycloak configuration
# NOTE: Keycloak is installed separately (not as a subchart) as a standalone Helm release.
# Use 'make helm-keycloak-upgrade' to install/upgrade Keycloak.
# However, OIDC client configurations are kept here for services that need Keycloak credentials.
# Keycloak will be accessible at auth.agentstudio.local (routed through API gateway)
keycloak:
  enabled: false  # Keycloak is installed separately, not as a subchart
  
  # Keycloak setup job configuration
  # This job creates the realm and OIDC clients automatically
  setup:
    enabled: true  # Set to false to disable automatic setup
    # Empty = chart default http://keycloak.agentstudio-identity.svc.cluster.local:8080 (override via keycloakNamespace below or set the URL explicitly)
    keycloakUrl: "http://keycloak.agentstudio-identity.svc.cluster.local:8080"
    # Kubernetes namespace where the standalone Keycloak release runs (empty = same as .Values.namespace / SERVICES_NAMESPACE)
    keycloakNamespace: "agentstudio-identity"
    adminUser: "admin"  # Keycloak admin username
    adminPassword: "AgentstudioAdmin123!"  # Keycloak admin password (must match keycloak.bootstrapAdmin.password in deployments/helm/identity/values-local.yaml)
    realmName: "nemo"  # Realm name to create
    domain: ""  # Base endpoint domain (if empty, derived from .Values.endpoint via nemo.endpoint)
    # consoleHost: single-label public host for the console + API gateway; used as
    # the OIDC redirect target for agentstudio-gui, agentstudio-gateway, and
    # agentstudio-swagger. If empty, derived from nemo.consoleHost (e.g. app.{endpoint}).
    # OIDC URIs intentionally avoid the bare apex {endpoint} because clusters with
    # single-label-only wildcard DNS cannot resolve it.
    consoleHost: ""
    # catalogHost: single-label public host for the Lakekeeper UI; used as the
    # OIDC redirect target for agentstudio-lakekeeper-ui. If empty, derived from
    # nemo.catalogSubdomain (e.g. catalog.{endpoint}).
    catalogHost: ""
    # Protocol for redirect URIs registered on the agentstudio-gui / agentstudio-swagger clients.
    # Defaults to https because the Gateway listens on TLS at :8443; the keycloak-setup script
    # also registers http://localhost:3000/* so local Vite dev servers still work.
    protocol: "https"
    image:
      repository: ""  # If empty, defaults to {global.imageRepository}/keycloak-setup
      tag: ""  # Image tag precedence: explicit keycloak.setup.image.tag > global.imageTag (or Make IMAGE_TAG) > latest
      pullPolicy: "IfNotPresent"  # Image pull policy
  
  # OIDC Client configurations (custom values for our OIDC secret templates)
  # These are NOT part of the official chart - used by our keycloak-oidc-secrets.yaml template
  oidcClients:
    gui:
      clientId: "agentstudio-gui"
      # Public client (SPA) - no secret needed
    gateway:
      clientId: "agentstudio-gateway"
      clientSecret: "changeme-gateway-secret"  # Should be changed in production
    lakekeeper:
      clientId: "agentstudio-lakekeeper"
      clientSecret: "changeme-lakekeeper-secret"  # Should be changed in production
    lakekeeperUi:
      clientId: "agentstudio-lakekeeper-ui"
    swagger:
      clientId: "agentstudio-swagger"
      # Public client for Swagger UI - no secret needed
    workflowEngine:
      clientId: "agentstudio-workflow-engine"
      clientSecret: "changeme-workflow-engine-secret"  # Should be changed in production
    analyticsEngine:
      clientId: "agentstudio-analytics-engine"
      clientSecret: "changeme-analytics-engine-secret"  # Should be changed in production
    configService:
      clientId: "agentstudio-config-service"
      clientSecret: "changeme-config-service-secret"  # Should be changed in production
    storageManager:
      clientId: "agentstudio-storage-manager"
      clientSecret: "changeme-storage-manager-secret"  # Should be changed in production
    agentService:
      clientId: "agentstudio-agent-service"
      clientSecret: "changeme-agent-service-secret"  # Should be changed in production
    connectorWorker:
      clientId: "agentstudio-connector-worker"
      clientSecret: "changeme-connector-worker-secret"  # Should be changed in production
    evalWorker:
      clientId: "agentstudio-eval-worker"
      clientSecret: "changeme-eval-worker-secret"  # Should be changed in production

# LLM gateway (Bifrost only).
# Override at helm install/upgrade time, e.g. --set llmGateway.bifrost.url=https://bifrost.example.com
# Empty falls back to the in-cluster bifrost-proxy service.
llmGateway:
  bifrost:
    url: ""

# Bifrost LLM gateway (Go, port 8080); disable with bifrost.enabled=false when using external LLM_GATEWAY_URL
# v1.5.x has breaking changes — see https://docs.getbifrost.ai/migration-guides/v1.5.0 before upgrading prod.
# When CONTAINER_IMAGE_REPO is set, helm-common.sh overrides image.repository to {repo}/bifrost.
bifrost:
  enabled: true
  fullnameOverride: "bifrost"
  replicaCount: 1
  namespace: agentstudio
  image:
    repository: maximhq/bifrost
    tag: "v1.5.7"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  metrics:
    serviceMonitor:
      enabled: false
  # Postgres backend (config_store + logs_store + governance). Dedicated DB so
  # Bifrost-managed tables don't collide with the AgentStudio `nemo` schema.
  database:
    host: "shared-postgresql.database.svc.cluster.local"
    port: "5432"
    name: "bifrost"
    user: "postgres"
    password: "agentstudio-postgres-password"
    sslMode: "disable"

# Processing Workers configuration (long-running Temporal workers for dataset, KB, and connector processing)
processing-workers:
  enabled: true
  datasetWorker:
    image:
      repository: dataset-processor
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    env:
      - name: TEMPORAL_ADDRESS
        value: "temporal:7233"
      - name: TEMPORAL_NAMESPACE
        value: "default"
      - name: TASK_QUEUE
        value: "dataset-processing"
      - name: MAX_CONCURRENT_ACTIVITIES
        value: "2"
      - name: WORKFLOW_ENGINE_URL
        value: "http://workflow-engine:8080"
      - name: OTEL_SERVICE_NAME
        value: "dataset-processor"
      - name: AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH
        value: "/dev/stdout"
      - name: AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT
        value: "9090"
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: "http://otel-collector:4318/v1/traces"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 60
      customMetric:
        # Requires prometheus-adapter + Temporal ServiceMonitor.
        # Enable after: make helm-observability-upgrade (deploys adapter with Temporal rules).
        enabled: false
        type: Pods
        name: "temporal_queue_backlog_dataset"
        target:
          type: AverageValue
          averageValue: "10"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  kbWorker:
    image:
      repository: kb-processor
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: "2"
        memory: "3Gi"
      limits:
        cpu: "4"
        memory: "4Gi"
    env:
      - name: TEMPORAL_ADDRESS
        value: "temporal:7233"
      - name: TEMPORAL_NAMESPACE
        value: "default"
      - name: TASK_QUEUE
        value: "kb-processing"
      - name: MAX_CONCURRENT_ACTIVITIES
        value: "2"
      - name: WORKFLOW_ENGINE_URL
        value: "http://workflow-engine:8080"
      - name: OTEL_SERVICE_NAME
        value: "kb-processor"
      - name: AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH
        value: "/dev/stdout"
      - name: AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT
        value: "9090"
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: "http://otel-collector:4318/v1/traces"
    autoscaling:
      # Phase-1 rollout: enable kb worker autoscaling first.
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      customMetric:
        enabled: false
        type: Pods
        name: "temporal_queue_backlog_kb"
        target:
          type: AverageValue
          averageValue: "10"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  connectorWorker:
    redisStandalone: true
    enabled: true
    certs:
      enabled: true
      secretName: netapp-ca-certs-secret
      mountPath: /etc/ssl/certs/custom
      certFileName: netapp-ca-cert.pem
    image:
      repository: connector-worker
      tag: "latest"
      pullPolicy: IfNotPresent
    # Default 2 replicas. Scaling formula: max_parallel_copies = replicas * MAX_CONCURRENT_ACTIVITIES.
    # See docs/design/stream-pipeline.md for tuning guidance.
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        # 4Gi accommodates 8 concurrent download+upload activities buffering files
        # via tempfile. For files >1GB cross-cluster, lower MAX_CONCURRENT_ACTIVITIES.
        memory: "4Gi"
    env:
      - name: TEMPORAL_ADDRESS
        value: "temporal:7233"
      - name: TEMPORAL_NAMESPACE
        value: "default"
      - name: TASK_QUEUE
        value: "connector-operations"
      # Bumped from 2 to 8 for the streaming acquisition pipeline (Phase 1b).
      - name: MAX_CONCURRENT_ACTIVITIES
        value: "8"
      - name: CONFIG_SERVICE_URL
        value: "http://config-service:3000"
      - name: S3_ENDPOINT
        value: "http://s3gateway:7070"
      - name: WORKFLOW_ENGINE_URL
        value: "http://workflow-engine:8080"
      # Acquisition pipeline Redis (DB 3).
      - name: ACQ_REDIS_URL
        value: "redis://redis-master.{{ .Values.global.platformNamespace | default \"agentstudio-platform\" }}.svc.cluster.local:6379/3"
      - name: ACQ_REDIS_SENTINEL_URL
        value: ""
      - name: ACQ_REDIS_SENTINEL_MASTER
        value: ""
      - name: ACQ_REDIS_DB
        value: "3"
      - name: ACQ_BATCH_SIZE
        value: "64"
      - name: ACQ_MAX_BATCHES_PER_ACTIVITY
        value: "8"
      - name: ACQ_STREAM_MAXLEN
        value: "50000"
      - name: OTEL_SERVICE_NAME
        value: "connector-worker"
      - name: AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH
        value: "/dev/stdout"
      - name: AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT
        value: "9090"
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: "http://otel-collector:4318/v1/traces"
      # S3_ACCESS_KEY, S3_SECRET_KEY, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET,
      # and KEYCLOAK_TOKEN_URL are injected by the deployment template from secrets
    # CPU-based HPA by default. Queue backlog scaling (customMetric) is enabled in
    # values-enable-observability.yaml together with Temporal ServiceMonitor + observability
    # prometheus-adapter (see docs/observability/worker-hpa-runbook.md).
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 50
      customMetric:
        enabled: false
        type: Pods
        name: "temporal_queue_backlog_connector"
        target:
          type: AverageValue
          averageValue: "10"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  # Evaluation worker (TypeScript). Overrides subchart defaults for in-cluster
  # service URLs. See deployments/helm/nemo/charts/processing-workers/values.yaml
  # for the full evalWorker schema.
  evalWorker:
    enabled: true
    image:
      repository: eval-worker
      tag: "latest"
      pullPolicy: IfNotPresent
    env:
      - name: TEMPORAL_ADDRESS
        value: "temporal:7233"
      - name: TEMPORAL_NAMESPACE
        value: "default"
      - name: METRICS_PORT
        value: "9465"
      - name: LOG_LEVEL
        value: "info"
      - name: CONFIG_SERVICE_URL
        value: "http://config-service:3000"
      - name: AGENT_SERVICE_URL
        value: "http://agent-service:8000"
      # Bifrost ships as `bifrost-proxy` (port 4001), not `bifrost:8080`.
      # Override at install time if the LLM gateway lives elsewhere.
      - name: LLM_GATEWAY_URL
        value: "http://bifrost-proxy:4001"
      - name: WORKFLOW_ENGINE_URL
        value: "http://workflow-engine:8080"
      # POSIX-on-PVC store (same mount as dataset/kb/connector workers).
      - name: NEMO_DEFAULT_STORE_ROOT
        value: "/mnt/pvcs/default-nemo"

# Project initialization defaults
projectInit:
  defaultStorageClass: "standard"
  defaultStorageSize: "2Gi"
  defaultRegion: "us-east-1"  # Or from deployment config

