# S3Gateway configuration
s3gateway:
  enabled: true
  # Must stay aligned with global.s3gatewayFullname (worker PVC claimName = {fullname}-default-bucket).
  fullnameOverride: "s3gateway"
  replicaCount: 2
  namespace: agentstudio
  serviceAccountName: ""  # Will be computed from parent, defaults to release-name-nemo
  image:
    repository: versitygw/versitygw  # Uses global.imageRepository as registry prefix; tag is pinned (not affected by global.imageTag)
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 7070  # VersityGW default S3 port
  storage:
    backend: filesystem
    dataPath: /mnt/pvcs
    accessMode: ReadWriteOnce  # local-path provisioner only supports RWO
  credentials:
    accessKey: "testuser"  # Default, should be overridden in production
    secretKey: "secret"   # Default, should be overridden in production
  env: 
    - name: VGW_BACKEND
      value: "posix"
    - name: VGW_BACKEND_ARG
      value: "/mnt/pvcs"
    - name: ROOT_ACCESS_KEY
      value: "testuser"
    - name: ROOT_SECRET_KEY
      value: "secret"
    - name: VGW_ARGS
      value: "--health /health"
    - name: VGW_HEALTH
      value: "/health"
    - name: VGW_META_SIDECAR
      value: "/mnt/metadata"
  resources:
    # Reduced for laptop/Kind clusters
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  healthEndpoint: "/health"
  metadata:
    enabled: true
    size: 10Gi
    storageClass: ""  # If empty, uses default storage class or global.storageClass
  pvcsMountPath: /mnt/pvcs
  region: ""  # If empty, defaults to us-east-1
  podSecurityContext:
    fsGroup: 1000
  securityContext: {}
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  # Default bucket for Lakekeeper default warehouse (pre-created at deploy time)
  # Default bucket name follows deploymentName: default-{deploymentName}
  defaultBucket:
    enabled: true
    name: default-nemo  # Must match deploymentName; override both together
    size: 1Ti
    storageClass: ""

# Default setup job: bootstraps Lakekeeper (EULA), creates default warehouse (verifies default bucket exists)
# Runs as post-install/post-upgrade hook after keycloak-setup and lakekeeper-restart (weight 10)
defaultSetup:
  enabled: true
  # Whether Lakekeeper is available (deployed separately or as subchart).
  # Used by default-setup-job condition instead of lakekeeper.enabled so that the operator
  # can deploy Lakekeeper as a separate release and still run default-setup via the app chart.
  lakekeeperEnabled: true
  # Run a hook (weight 4) that registers the default bucket in S3gateway via CreateBucket.
  # Idempotent — safe to leave enabled. Ensures VersityGW recognizes the mounted PVC as a bucket.
  registerDefaultBucket: true
  # Warehouse name in Lakekeeper (default: deploymentName, e.g. nemo)
  warehouseName: ""  # If empty, uses deploymentName
  lakekeeperUrl: "http://lakekeeper:8181"
  s3GatewayUrl: "http://s3gateway:7070"
  # Max seconds the bootstrap Jobs wait for s3gateway / lakekeeper to come up.
  # Sized so the FIRST provisioning of an RWX PVC (GKE Filestore Standard takes
  # ~5-10 min for the initial share) completes inside one Job attempt before
  # backoffLimit retries kick in. Bumped from the script's old hardcoded 120s
  # which was tuned for instant ANF NFS provisioning on AKS and timed out
  # immediately on Filestore-backed clusters. Override per-cluster:
  #   make deploy-platform-deps HELM_EXTRA_ARGS='--set defaultSetup.s3GatewayWaitSec=900'
  s3GatewayWaitSec: 600
  lakekeeperWaitSec: 300
  # Job-level retry budget. The pod inside each attempt already polls for
  # s3GatewayWaitSec, so this is the OUTER retry count -- e.g. backoffLimit=2
  # plus s3GatewayWaitSec=600 means total wall-clock = 3 attempts * 600s = 30m
  # before the Job is considered failed. Helm's --timeout (HELM_UPGRADE_TIMEOUT,
  # default 30m) governs how long Helm waits for the hook Job to complete.
  s3BucketInitBackoffLimit: 2
  lakekeeperBootstrapBackoffLimit: 3

# Storage Manager configuration
storage-manager:
  enabled: true
  fullnameOverride: "storage-manager"
  replicaCount: 1
  namespace: agentstudio
  serviceAccountName: ""  # Will be computed from parent, defaults to release-name-nemo
  image:
    repository: nemo/storage-manager
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    # Reduced for laptop/Kind clusters
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    - name: CONFIG_SERVICE_URL
      value: "http://config-service:3000"
    - name: K8S_NAMESPACE
      value: ""  # Overridden by template to use actual release namespace
    - name: CONFIG_SYNC_INTERVAL
      value: "30s"
    - name: LOG_LEVEL
      value: "info"
    - name: KEYCLOAK_INTERNAL_ISSUER
      value: ""  # Will be set from template (internal issuer for service-to-service auth)
    # Observability — client lib configuration
    # Note: OTEL_SERVICE_NAME, AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH, and
    # AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT are set by the deployment
    # template directly (via service.metricsPort) to avoid duplicate env-key errors.
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "{{ .Values.global.observability.otlpEndpoint }}/v1/traces"
    - name: AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT
      value: "9090"
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  metrics:
    serviceMonitor:
      enabled: false

# Artifact Service configuration (Node/TypeScript).
# Provides the persistent, version-tracked artifact store for agents.
# Bare git repos live under /mnt/pvcs/default-nemo/projects/{pid}/artifacts/{storeId}/.
artifact-service:
  enabled: true
  fullnameOverride: "artifact-service"
  replicaCount: 1
  namespace: agentstudio
  serviceAccountName: ""  # computed from parent
  image:
    repository: nemo/artifact-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  nemoDataMount: /mnt/pvcs/default-nemo
  database:
    host: "shared-postgresql.database.svc.cluster.local"
    port: "5432"
    name: "nemo"
    user: "postgres"
    password: "agentstudio-postgres-password"
  redis:
    # Empty = idempotency dedup degrades to best-effort miss (git's
    # content addressing handles identical retries on its own). Set to
    # e.g. "redis://nemo-redis-master:6379/5" to enable cross-pod dedup.
    url: ""
  logLevel: "info"
  # Observability — client lib configuration
  env:
    # Note: OTEL_SERVICE_NAME, AGENT_STUDIO_OBSERVABILITY_LOG_FILE_PATH, and
    # AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT are set by the deployment
    # template directly (via service.metricsPort) to avoid duplicate env-key errors.
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "{{ .Values.global.observability.otlpEndpoint }}/v1/traces"
    - name: AGENT_STUDIO_OBSERVABILITY_PROMETHEUS_METRICS_PORT
      value: "9090"
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
  initContainer:
    enabled: true
    waitForKeycloakSetup: true
  # podSecurityContext / securityContext: intentionally left to the
  # subchart's values.yaml so the platform's secure defaults
  # (runAsNonRoot, runAsUser=1000, readOnlyRootFilesystem, drop ALL
  # caps, allowPrivilegeEscalation=false) apply automatically. To
  # tighten or override in a specific deployment, set them here
  # explicitly — e.g. artifact-service.securityContext.readOnlyRootFilesystem: false.
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  metrics:
    serviceMonitor:
      enabled: false

# KB Retrieval Service configuration (Rust).
kb-retrieval-service:
  enabled: true
  fullnameOverride: "kb-retrieval-service"
  replicaCount: 1
  namespace: agentstudio
  serviceAccountName: ""  # Will be computed from parent, defaults to release-name-nemo
