  # S3 credentials (derived from deploymentName if empty)
  s3:
    enabled: true
    secretName: ""  # Derived from deploymentName
    endpoint: "http://s3gateway:7070"
    region: "us-east-1"
    defaultBucketName: ""  # Derived from deploymentName
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
