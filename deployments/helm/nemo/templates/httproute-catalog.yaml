{{- if and .Values.gateway.enabled .Values.lakekeeper.enabled -}}
{{- $gatewayName := include "nemo.gatewayName" . }}
{{- $namespace := include "nemo.namespace" . }}
{{- $catalogHost := include "nemo.catalogSubdomain" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nemo.httprouteName" . }}-catalog
  namespace: {{ $namespace }}
  labels:
    {{- include "nemo.labels" . | nindent 4 }}
  annotations:
    debug.gateway-api.service-name: "lakekeeper"
    debug.gateway-api.service-port: "8181"
    debug.gateway-api.parent-gateway: {{ $gatewayName | quote }}
    debug.gateway-api.namespace: {{ $namespace | quote }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $namespace }}
  hostnames:
    - {{ $catalogHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: lakekeeper
          port: 8181
{{- end }}
