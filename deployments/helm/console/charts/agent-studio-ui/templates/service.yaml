{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: agent-studio-ui
  labels:
    {{- include "agent-studio-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agent-studio-ui.selectorLabels" . | nindent 4 }}
{{- end }}
