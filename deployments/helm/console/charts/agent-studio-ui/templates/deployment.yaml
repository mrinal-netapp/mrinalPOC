{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-studio-ui.fullname" . }}
  labels:
    {{- include "agent-studio-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-studio-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-studio-ui.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- $root := . }}
      serviceAccountName: {{ include "agent-studio-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-studio-ui
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRepository }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: API_SERVICE_NAME
              value: {{ .Values.apiService.name | quote }}
            - name: API_SERVICE_PORT
              value: {{ .Values.apiService.port | quote }}
            - name: WORKFLOW_SERVICE_NAME
              value: {{ .Values.workflowService.name | default "workflow-engine" | quote }}
            - name: WORKFLOW_SERVICE_PORT
              value: {{ .Values.workflowService.port | default "8080" | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ include "nemo.keycloakIssuer" $root | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.keycloakClientId | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "string" . }}
        - name: {{ . | quote }}
        {{- else if kindIs "map" . }}
        - {{- toYaml . | nindent 10 }}
        {{- else }}
        - name: {{ . | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
