{{- if .Values.enabled }}
{{- /*
  Mirrors the database namespace's postgres password into this namespace so the
  Bifrost pod can read it via secretKeyRef. Keep .database.password in sync with
  the shared-postgresql secret (database chart). For prod, prefer ExternalSecrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bifrost.fullname" . }}-postgresql
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.database.password | default "agentstudio-postgres-password" | quote }}
{{- end }}
