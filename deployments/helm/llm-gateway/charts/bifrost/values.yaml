enabled: true
replicaCount: 1
fullnameOverride: "bifrost-proxy"

# Recreate avoids RWO Multi-Attach deadlocks on upgrades: the old pod must
# release the ReadWriteOnce PVC (persistence below) before the new pod can
# attach it. RollingUpdate surges the new pod up first, which hangs forever
# in Init with "Multi-Attach error for volume ... already used by pod(s)".
strategy:
  type: Recreate

image:
  # Default: pull the AgentStudio bifrost mirror — a bare image name
  # (no `/`) gets prefixed with `{{ global.imageRepository }}` by the
  # deployment template, so this resolves to e.g.
  #   <registry>/bifrost:<global.imageTag | default tag>
  # where <registry> is the cluster's AgentStudio image repo. The mirror
  # bakes in the pricing datasheets at /app/builtin-pricing/ (see
  # src/images/bifrost/Dockerfile + `make bifrost-build-push`), which is
  # what the `pricing` block below points at by default.
  #
  # To use stock upstream maximhq/bifrost instead, set this to a value
  # containing a slash (e.g. `maximhq/bifrost`) — the template recognises
  # that as a full image path and skips the registry prefix. You'll also
  # need to override `pricing.pricingUrl` + `pricing.modelParametersUrl`
  # to the upstream getbifrost.ai URLs because the stock image doesn't
  # have /app/builtin-pricing/.
  repository: bifrost
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  # NFS-backed PVCs (e.g. ANF) ignore Pod fsGroup. The bifrost container runs
  # as UID 1000 and writes to /app/data; without a chown init the container
  # cannot create /app/data/logs. Set true on AKS/ANF, leave false on local.
  fixPermissions: false
  fixPermissionsImage: "busybox:1.36"

# Postgres backend for Bifrost's config_store / logs_store / governance state.
database:
  host: "shared-postgresql.database.svc.cluster.local"
  port: "5432"
  name: "bifrost"
  user: "postgres"
  password: "agentstudio-postgres-password"
  sslMode: "disable"

initContainer:
  image:
    repository: ""           # defaults to {{ global.imageRepository }}/init-tools
    tag: "latest"
    pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Bifrost client / compat settings (rendered into config.json)
client:
  initialPoolSize: 300
  enableLogging: true
  disableContentLogging: false
  enforceAuthOnInference: false
  compat:
    convertTextToChat: true
    convertChatToResponses: true
    shouldDropParams: true
    shouldConvertParams: true

mcp:
  toolExecutionTimeout: 120
  # Namespaces where config-service's MCPRuntimeManager spawns managed
  # MCP server pods (labelled `component: mcp-stdio-runner`, port 8000).
  # Each entry expands into a Bifrost egress allowlist rule. Add new
  # entries for any deployment topology where MCPs are launched in a
  # namespace other than agentstudio-services (e.g. per-project namespaces,
  # multi-tenant isolation). Entries are interpreted as
  # `kubernetes.io/metadata.name` exact matches.
  managedServerNamespaces:
    - agentstudio-services
  # Port managed MCP servers listen on. Pinned to 8000 to match
  # MCPRuntimeManager's containerPort/service port; change in lock-step
  # if that ever moves.
  managedServerPort: 8000

auth:
  isEnabled: false
  adminUsername: ""
  adminPassword: ""

# Pricing manager configuration.
#
# Bifrost's pricing manager fetches the model-pricing datasheet from
# `https://getbifrost.ai/datasheet` on startup and refreshes every 24h.
# In clusters that intercept outbound HTTPS with a MITM proxy presenting
# its own SAN (e.g. corporate egress that rewrites to `*.example.com`),
# hostname verification fails and bifrost fatal-exits during pricing
# manager init — even though bifrost trusts the proxy's CA at the cert
# level, the SAN mismatch is unrecoverable from inside the pod.
#
# AgentStudio's bifrost mirror image (src/images/bifrost/Dockerfile)
# pre-fetches the two JSON datasheets from getbifrost.ai at IMAGE BUILD
# time and bakes them into `/app/builtin-pricing/` so runtime never has
# to reach getbifrost.ai. This works in airgapped + MITM-proxy clusters
# out of the box. See:
#   https://github.com/maximhq/bifrost/blob/main/docs/deployment-guides/how-to/airgapped.mdx
#
# Defaults below point at those baked-in files. Clear them to "" or
# override to the upstream URLs ONLY IF you're running stock upstream
# `maximhq/bifrost` (no mirror) AND have unrestricted outbound egress.
pricing:
  # Pricing / model-parameters datasheet URLs.
  #
  # Defaults point at the BAKED-IN copies the AgentStudio bifrost mirror
  # image places at /app/builtin-pricing/ (see src/images/bifrost/Dockerfile).
  # That copy is fetched from https://getbifrost.ai/datasheet at IMAGE
  # BUILD time — when build runs on a network without the MITM problem —
  # and shipped inside the image, so runtime never has to reach
  # getbifrost.ai. Works in airgapped + MITM-proxy clusters out of the
  # box.
  #
  # To refresh pricing data, rebuild the mirror image:
  #   make bifrost-build-push CONTAINER_IMAGE_REPO=...
  # Pricing changes slowly (months); the rebuild cadence is fine.
  #
  # Override to the upstream URLs if you're running stock maximhq/bifrost
  # without the AgentStudio mirror AND have unrestricted outbound egress:
  #   pricingUrl: "https://getbifrost.ai/datasheet"
  #   modelParametersUrl: "https://getbifrost.ai/datasheet/model-parameters"
  pricingUrl: "file:///app/builtin-pricing/pricing.json"
  modelParametersUrl: "file:///app/builtin-pricing/model-parameters.json"
  # Refresh interval in seconds; bifrost enforces a 3600s (1h) minimum.
  # With file:// URLs the re-read just reloads the same static file, so
  # this knob mostly only matters when pointed at a remote URL.
  syncIntervalSeconds: 86400

  # Optional secondary delivery mechanism: render a ConfigMap from these
  # strings and mount it at /app/pricing-data inside the pod. Useful for
  # cluster operators who want to provide their own datasheets without
  # rebuilding the mirror image. Used via --set-file:
  #   helm upgrade ... \
  #     --set-file 'bifrost.pricing.localFiles.pricingData=./pricing.json' \
  #     --set-file 'bifrost.pricing.localFiles.modelParametersData=./model-parameters.json' \
  #     --set bifrost.pricing.pricingUrl='file:///app/pricing-data/pricing.json' \
  #     --set bifrost.pricing.modelParametersUrl='file:///app/pricing-data/model-parameters.json'
  #
  # NB. ConfigMap values are limited to 1 MiB each. The pricing datasheet
  # is ~1.3 MB and model-parameters is ~18 MB, so this path only works
  # for trimmed / curated datasheets. The image-baked path above has no
  # such limit — prefer it.
  localFiles:
    pricingData: ""
    modelParametersData: ""

env: []

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

metrics:
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
affinity: {}
tolerations: {}

serviceAccount:
  create: false
  name: ""
  azureClientId: ""

workloadIdentity:
  enabled: false

# Optional custom CA bundle injection for outbound TLS trust.
# Use with the shared NetApp CA secret when private CAs are required.
certs:
  enabled: false
  createSecret: false
  secretName: netapp-ca-certs-secret
  mountPath: /etc/ssl/certs/custom
  certFileName: netapp-ca-cert.pem
