# LLM Gateway tier umbrella values
# Namespace: agentstudio-llm-gateway (set via Helm --namespace at install time)
#
# Cross-namespace dependencies:
#   shared-postgresql → database
#   keycloak          → agentstudio-identity
#   redis-master      → agentstudio-platform

createNamespace: true
namespacePodSecurity:
  enforce: privileged
  audit: privileged
  warn: privileged

deploymentName: "nemo"
endpoint: "agentstudio.local"

keycloakNamespace: "agentstudio-identity"
platformNamespace: "agentstudio-platform"
servicesNamespace: "agentstudio-services"

serviceAccount:
  create: true
  name: ""
  annotations: {}

global:
  imageRegistry: ""
  imageRepository: "docker.repo.eng.netapp.com/user/sekaranr"
  imageTag: ""
  imagePullSecrets: []
  storageClass: ""
  endpoint: "agentstudio.local"
  deploymentName: "nemo"
  s3gatewayFullname: "s3gateway"

keycloak:
  setup:
    keycloakNamespace: "agentstudio-identity"

bifrost:
  enabled: true
  fullnameOverride: "bifrost-proxy"
  replicaCount: 1
  serviceAccountName: ""
  image:
    # Default: the AgentStudio bifrost mirror (built by `make bifrost-build-push`)
    # which bakes the pricing datasheets at /app/builtin-pricing/. The
    # deployment template prepends global.imageRepository when this value
    # has no `/` in it. To use stock upstream maximhq/bifrost, set this
    # to "maximhq/bifrost" — but then also override pricing.pricingUrl +
    # pricing.modelParametersUrl back to the upstream URLs, since the
    # upstream image doesn't ship the pre-built datasheet files.
    repository: bifrost
    # Pinned to v1.5.16 (was v1.5.7) — v1.5.16 is the first upstream
    # transports release that loads pricing from file:// URLs without a
    # fatal "unsupported protocol scheme" crash. See the Dockerfile's
    # ARG comment for the full rationale.
    #
    # Lockstep — this tag must stay in sync with three other places:
    #   * `ARG BIFROST_UPSTREAM_VERSION` in src/images/bifrost/Dockerfile
    #   * `BIFROST_UPSTREAM_VERSION` in src/images/bifrost/Makefile
    #   * `BIFROST_TAG` in mk/build.mk
    tag: "v1.5.16"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  database:
    host: "shared-postgresql.database.svc.cluster.local"
    port: "5432"
    name: "bifrost"
    user: "postgres"
    password: "agentstudio-postgres-password"
  serviceAccount:
    create: false
    name: ""
    azureClientId: ""
  workloadIdentity:
    enabled: false
  certs:
    enabled: true
    createSecret: true
    secretName: netapp-ca-certs-secret
    mountPath: /etc/ssl/certs/custom
    certFileName: netapp-ca-cert.pem
